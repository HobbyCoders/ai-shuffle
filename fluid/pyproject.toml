[project]
name = "fluid"
version = "0.1.0"
description = "A multi-provider agent harness: cache-first context, event-driven core, code-as-actions."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.2",
]
# CLI REPL works with the stdlib alone (tomllib + argparse); this extra exists
# for symmetry and future CLI-only deps.
cli = []
# Only the Textual TUI (`fluid chat --tui`) needs textual; the REPL does not.
tui = [
    "textual>=0.80",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mcp>=1.2",
]

[project.scripts]
fluid = "fluid.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fluid"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true
