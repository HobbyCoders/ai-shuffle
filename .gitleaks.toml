[[rules]]
id = "google-api-key"
description = "Google API key"
regex = '''\bAIza[A-Za-z0-9_-]{35}\b'''

[[rules]]
id = "slack-token"
description = "Slack token"
regex = '''\bxox[baprs]-[A-Za-z0-9-]{20,}\b'''

[[rules]]
id = "stripe-live-key"
description = "Stripe live secret/restricted key"
regex = '''\b[rs]k_live_[A-Za-z0-9]{16,}\b'''

[[rules]]
id = "private-key"
description = "Private key PEM material"
regex = '''-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----(?:\s|\\[nr])+[A-Za-z0-9+/=]{64,}'''


[[rules]]
id = "cloudflare-api-token"
description = "Cloudflare scoped token assigned to a Cloudflare token setting"
regex = '''(?i:\b(?:cloudflare|cf)[_-]?(?:api[_-]?)?token)["']?\s*[:=]\s*["']?([A-Za-z0-9_-]{40})(?:$|[^A-Za-z0-9_-])'''

[[rules]]
id = "telegram-bot-token"
description = "Telegram bot ID and authentication token"
regex = '''\b([0-9]{6,12}:[A-Za-z0-9_-]{35})(?:$|[^A-Za-z0-9_-])'''

[[rules]]
id = "discord-bot-token"
description = "Discord bot token (encoded ID, timestamp, signature; not a generic JWT)"
regex = '''\b([MNO][A-Za-z0-9_-]{23,27}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{27,40})(?:$|[^A-Za-z0-9_-])'''

[[rules]]
id = "slack-app-token"
description = "Slack app-level socket-mode token"
regex = '''\bxapp-[0-9]-[A-Z0-9]{6,}-[0-9]+-[A-Za-z0-9]{16,}\b'''

[[rules]]
id = "stripe-webhook-secret"
description = "Stripe webhook signing secret"
regex = '''\bwhsec_[A-Za-z0-9]{16,}\b'''

[[rules]]
id = "postgres-password-url"
description = "PostgreSQL URL containing a literal password (not interpolation/redaction)"
regex = '''\bpostgres(?:ql)?(?:\+asyncpg|\+psycopg2?)?://[A-Za-z0-9_.%+-]+:([^\s@/\\"'`<>${}\[\]*]+)@[^\s/\\"'`<>${}]+(?:/[^\s\\"'`<>${}]*)?'''


