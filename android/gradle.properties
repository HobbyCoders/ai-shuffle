# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Gradle 8.11.1: transient repository transfers only, never whole task retries.
# Shared by debug CI, Play builds and local Gradle invocations. The resolver
# permits five attempts with 10/20/40/80s backoff; HTTP transport may also retry I/O.
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=10000
