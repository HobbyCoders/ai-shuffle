[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Invocation-owned basetemp is removed on exit (including failed runs).
# Also disable pytest's shared numbered-directory retention for fallback runs.
tmp_path_retention_count = 0
tmp_path_retention_policy = none

# Async mode
asyncio_mode = auto

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    real_agent_gate: run with the real credential gate instead of the test default (ready)
    real_install_detection: use the real Docker/native detection instead of the test default (native)
    boot_smoke: starts the real server process against a private PostgreSQL 16 (tests/smoke; run serially)

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
