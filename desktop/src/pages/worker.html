<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'"
		/>
		<title>AI Shuffle</title>
		<link rel="stylesheet" href="worker.css" />
	</head>
	<body>
		<header class="titlebar" aria-hidden="true">
			<span class="titlebar-title">AI Shuffle</span>
		</header>

		<main class="stage">
			<!-- Worker status: starting, stopped, failed -->
			<section id="status" class="panel panel-status" aria-labelledby="status-heading" hidden>
				<div class="status-head">
					<span id="status-dot" class="dot dot-checking" aria-hidden="true"></span>
					<div>
						<h1 id="status-heading">Starting the worker…</h1>
						<p id="status-detail" class="lede"></p>
						<p id="status-postgres" class="hint"></p>
					</div>
				</div>
				<pre id="status-error" class="error-block" hidden></pre>
				<div class="log-wrap">
					<div class="log-head">
						<span>Startup log</span>
						<button id="open-logs" class="btn btn-ghost-text" type="button">Open log file</button>
					</div>
					<pre id="log" class="log" aria-live="polite"></pre>
				</div>
				<div class="actions">
					<span class="spacer"></span>
					<button id="restart" class="btn btn-primary" type="button" hidden>Restart worker</button>
				</div>
			</section>
		</main>

		<footer class="foot">
			<span id="version"></span>
		</footer>

		<script src="worker.js"></script>
	</body>
</html>
