<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Full background for maskable (no rounded corners - system handles that) -->
  <rect width="512" height="512" fill="#0a0a0f"/>

  <!-- Scaled down to fit in safe zone (80% = inner 410px, centered) -->
  <g transform="translate(51, 51) scale(0.8)">
    <!-- Back card (rotated left) -->
    <g transform="rotate(-12, 256, 266)">
      <rect x="143" y="113" width="205" height="287" rx="20" fill="url(#cardGrad)" stroke="#374151" stroke-width="6"/>
    </g>

    <!-- Middle card (rotated right) -->
    <g transform="rotate(8, 256, 266)">
      <rect x="154" y="113" width="205" height="287" rx="20" fill="url(#cardGrad)" stroke="#374151" stroke-width="6"/>
    </g>

    <!-- Front card -->
    <rect x="164" y="113" width="205" height="287" rx="20" fill="url(#cardGrad)" stroke="#4b5563" stroke-width="6"/>

    <!-- AI sparkle/circuit on front card -->
    <circle cx="267" cy="215" r="41" fill="none" stroke="url(#tealGrad)" stroke-width="10"/>
    <circle cx="267" cy="215" r="15" fill="#14b8a6"/>

    <!-- Connection lines (AI circuit feel) -->
    <line x1="267" y1="174" x2="267" y2="143" stroke="#14b8a6" stroke-width="8" stroke-linecap="round"/>
    <line x1="308" y1="215" x2="339" y2="215" stroke="#14b8a6" stroke-width="8" stroke-linecap="round"/>
    <line x1="226" y1="215" x2="195" y2="215" stroke="#14b8a6" stroke-width="8" stroke-linecap="round"/>
    <line x1="267" y1="256" x2="267" y2="287" stroke="#14b8a6" stroke-width="8" stroke-linecap="round"/>

    <!-- Sparkle dots -->
    <circle cx="267" cy="133" r="8" fill="#14b8a6"/>
    <circle cx="349" cy="215" r="8" fill="#14b8a6"/>
    <circle cx="185" cy="215" r="8" fill="#14b8a6"/>
    <circle cx="267" cy="297" r="8" fill="#14b8a6"/>

    <!-- "AS" text on card -->
    <text x="190" y="369" font-family="system-ui, sans-serif" font-size="41" font-weight="700" fill="#9ca3af">AS</text>
  </g>
</svg>
