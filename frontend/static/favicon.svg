<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="#0a0a0f"/>

  <!-- Back card (rotated left) -->
  <g transform="rotate(-12, 50, 52)">
    <rect x="28" y="22" width="40" height="56" rx="4" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5"/>
  </g>

  <!-- Middle card (rotated right) -->
  <g transform="rotate(8, 50, 52)">
    <rect x="30" y="22" width="40" height="56" rx="4" fill="url(#cardGrad)" stroke="#374151" stroke-width="1.5"/>
  </g>

  <!-- Front card -->
  <rect x="32" y="22" width="40" height="56" rx="4" fill="url(#cardGrad)" stroke="#4b5563" stroke-width="1.5"/>

  <!-- AI sparkle/circuit on front card -->
  <circle cx="52" cy="42" r="8" fill="none" stroke="url(#tealGrad)" stroke-width="2"/>
  <circle cx="52" cy="42" r="3" fill="#14b8a6"/>

  <!-- Connection lines (AI circuit feel) -->
  <line x1="52" y1="34" x2="52" y2="28" stroke="#14b8a6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="42" x2="66" y2="42" stroke="#14b8a6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="42" x2="38" y2="42" stroke="#14b8a6" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="50" x2="52" y2="56" stroke="#14b8a6" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Sparkle dots -->
  <circle cx="52" cy="26" r="1.5" fill="#14b8a6"/>
  <circle cx="68" cy="42" r="1.5" fill="#14b8a6"/>
  <circle cx="36" cy="42" r="1.5" fill="#14b8a6"/>
  <circle cx="52" cy="58" r="1.5" fill="#14b8a6"/>

  <!-- Small "AS" text on card -->
  <text x="37" y="72" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#9ca3af">AS</text>
</svg>
