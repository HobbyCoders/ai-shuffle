<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flight recorder proof page</title>
<!--
  Proof page for the UI flight recorder (verify-flight-recorder.mjs). Each button
  plays one scenario on a mock chat surface that carries the same data-ui-*
  attributes as ChatView:
    Clean     new -> loading -> active, nothing goes back       => no anomalies
    Flicker   new -> active -> new (one frame) -> active        => reversal
    Remount   the composer is torn down and rebuilt             => remount
    Jump      a late banner pushes the surface down (no input)  => layout_shift
  Swapped content is absolutely positioned and the composer moves by transform,
  so only "Jump" shifts layout. body[data-done] names the finished scenario.
  Self-contained on purpose: no fonts or scripts from the network.
-->
<style>
  :root {
    --ink: hsl(36 18% 90%);
    --muted: hsl(210 8% 58%);
    --panel: hsl(220 16% 11%);
    --deck: hsl(222 18% 7%);
    --line: hsl(220 12% 20%);
    --signal: hsl(28 92% 60%);
    --go: hsl(150 52% 52%);
    --radius: 10px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--deck); color: var(--ink);
    font: 14px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    background-image: radial-gradient(hsl(220 20% 14%) 1px, transparent 1px);
    background-size: 18px 18px;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;
    padding: 16px 20px; border-bottom: 1px solid var(--line); background: hsl(222 18% 8% / .9);
  }
  h1 { margin: 0; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  h1 b { color: var(--signal); font-weight: 700; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; min-height: 44px; padding: 0 16px 0 12px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: border-color .2s ease-out, background .2s ease-out, transform .12s ease-out;
  }
  button::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); transition: background .2s ease-out, box-shadow .2s ease-out; }
  button:hover { border-color: hsl(28 60% 40%); background: hsl(220 16% 13%); }
  button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button[aria-pressed="true"]::before { background: var(--signal); box-shadow: 0 0 8px var(--signal); }
  body[data-done] button[aria-pressed="true"]::before { background: var(--go); box-shadow: 0 0 8px var(--go); }

  main { max-width: 880px; margin: 24px auto; padding: 0 16px; }
  .banner {
    height: 160px; margin-bottom: 16px; border-radius: var(--radius); border: 1px dashed var(--signal);
    display: grid; place-items: center; color: var(--signal); letter-spacing: .08em;
  }
  .chat {
    position: relative; height: 520px; overflow: hidden; border-radius: var(--radius);
    background: var(--panel); border: 1px solid var(--line); box-shadow: 0 24px 60px -30px #000;
  }
  .stage { position: absolute; inset: 0 0 96px; }
  .stage > * { position: absolute; inset: 0; padding: 28px; }
  .hero { display: grid; place-content: center; text-align: center; gap: 8px; }
  .hero strong { font-size: clamp(22px, 4vw, 30px); letter-spacing: -.01em; }
  .hero span { color: var(--muted); }
  .skeleton { display: grid; align-content: start; gap: 14px; }
  .skeleton i { display: block; height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--line), hsl(220 12% 26%), var(--line)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
  .skeleton i:nth-child(2n) { width: 70%; }
  .list { display: grid; align-content: start; gap: 12px; }
  .row { padding: 10px 14px; border-radius: 8px; background: hsl(220 14% 15%); border: 1px solid var(--line); }
  .row.user { justify-self: end; background: hsl(28 40% 18%); border-color: hsl(28 40% 28%); }
  .composer {
    position: absolute; left: 16px; right: 16px; bottom: 16px; height: 64px;
    border-radius: 14px; border: 1px solid var(--line); background: var(--deck);
    display: flex; align-items: center; padding: 0 16px; color: var(--muted);
    transform: translateY(-190px); transition: transform .25s cubic-bezier(.16, 1, .3, 1);
  }
  .chat[data-ui-composer="bottom"] .composer { transform: none; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) {
    .composer, button { transition: none; }
    .skeleton i { animation: none; }
  }
  @media (max-width: 480px) { .chat { height: 460px; } header { padding: 12px; } }
</style>
</head>
<body>
<header>
  <h1><b>●</b> flight recorder · proof page</h1>
  <nav aria-label="Scenarios">
    <button id="clean" type="button" aria-pressed="false">Clean</button>
    <button id="flicker" type="button" aria-pressed="false">Flicker</button>
    <button id="remount" type="button" aria-pressed="false">Remount</button>
    <button id="jump" type="button" aria-pressed="false">Jump</button>
  </nav>
</header>
<main id="main">
  <section class="chat" id="chat" aria-label="Mock chat" data-ui-state="chat" data-ui-mount="ChatView"
    data-ui-surface="new" data-ui-session="none" data-ui-composer="centre" data-ui-messages="0" data-ui-loading="false" data-ui-streaming="false">
    <div class="stage" id="stage">
      <div class="hero" data-ui-mount="NewSessionHero"><strong>Let's build</strong><span>Runs on this worker</span></div>
    </div>
    <div class="composer" data-ui-mount="ChatInput">Ask anything…</div>
  </section>
</main>
<script>
  const chat = document.getElementById('chat');
  const stage = document.getElementById('stage');
  const frame = () => new Promise((resolve) => requestAnimationFrame(() => resolve()));
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const set = (values) => { for (const [key, value] of Object.entries(values)) chat.setAttribute(`data-ui-${key}`, value); };
  const view = (html) => { stage.innerHTML = html; };
  const HERO = '<div class="hero" data-ui-mount="NewSessionHero"><strong>Let\'s build</strong><span>Runs on this worker</span></div>';
  const SKELETON = '<div class="skeleton" aria-busy="true"><i></i><i></i><i></i><i></i></div>';
  const LIST = '<div class="list" data-ui-mount="MessageArea">'
    + '<div class="row user" data-ui-row="m1">Make the header sticky</div>'
    + '<div class="row" data-ui-row="m2">Done: the header now stays put on scroll.</div></div>';
  const ACTIVE = { surface: 'active', session: 's:k2x9qa', composer: 'bottom', messages: '2', loading: 'false' };

  function finish(name) { document.body.dataset.done = name; }
  function busy(button) {
    document.querySelectorAll('nav button').forEach((b) => { b.disabled = true; b.setAttribute('aria-pressed', String(b === button)); });
  }

  const scenarios = {
    // new -> loading -> active: every field only moves forward.
    async clean() {
      set({ surface: 'loading', session: 's:k2x9qa', composer: 'bottom', loading: 'true' });
      view(SKELETON);
      await wait(120);
      set(ACTIVE);
      view(LIST);
      await frame(); await frame();
    },
    // The worktree-session bug in miniature: the chat goes active, shows the
    // centred new-chat surface for exactly one painted frame, then goes back.
    // Code after `await frame()` runs before that frame paints, so a state set
    // there is on screen for that frame; two awaits wait out a painted frame.
    async flicker() {
      set(ACTIVE);
      view(LIST);
      await frame(); await frame();
      set({ surface: 'new', session: 'none', composer: 'centre', messages: '0' });
      view(HERO);
      await frame();
      set(ACTIVE);
      view(LIST);
      await frame(); await frame();
    },
    // Same position, new instance: the composer is torn down and rebuilt.
    async remount() {
      const composer = chat.querySelector('.composer');
      await frame();
      composer.remove();
      await frame();
      const fresh = document.createElement('div');
      fresh.className = 'composer';
      fresh.dataset.uiMount = 'ChatInput';
      fresh.textContent = 'Ask anything…';
      chat.append(fresh);
      await frame(); await frame();
    },
    // A late banner, well after the click, so it counts as unexpected.
    async jump() {
      await wait(900);
      const banner = document.createElement('div');
      banner.className = 'banner';
      banner.textContent = 'A new version is ready';
      document.getElementById('main').prepend(banner);
      await frame(); await frame();
      await wait(100);
    },
  };

  for (const [name, play] of Object.entries(scenarios)) {
    const button = document.getElementById(name);
    button.addEventListener('click', async () => {
      busy(button);
      await play();
      finish(name);
    });
  }
</script>
</body>
</html>
