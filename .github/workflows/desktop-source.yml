name: Publish desktop source update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-source-publish
  cancel-in-progress: false

jobs:
  publish:
    # Store and sign GitHub's source ZIP in a private release. No application builds.
    runs-on: ubuntu-latest
    environment: account-hub-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/hub/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: android/hub
      - name: Publish signed source revision
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_APPLICATION_SIGNING_KEY: ${{ secrets.DESKTOP_APPLICATION_SIGNING_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_HUB_DATABASE_ID: ${{ vars.ACCOUNT_HUB_DATABASE_ID }}
        run: node desktop/scripts/publish-source.mjs
