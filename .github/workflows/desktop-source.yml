name: Publish desktop source update

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [main-suite]
    types: [completed]
    branches: [main]

# Transition step 2: workers from 0.9.6 on accept both names, so the daily
# build is signed nightly. It is still stored in, and served from, the edge lane.
env:
  SOURCE_CHANNEL: nightly

permissions:
  contents: read
  statuses: read
  actions: read

jobs:
  gate:
    # Read-only: unchanged main stops before setup, attestation reads or signing.
    if: >-
      github.repository == 'HobbyCoders/ai-shuffle' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && github.actor_id == '76577322' && github.triggering_actor == github.actor) ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.status == 'completed' &&
        github.event.workflow_run.name == 'main-suite' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.repository.full_name == 'HobbyCoders/ai-shuffle' &&
        github.event.workflow_run.head_repository.full_name == 'HobbyCoders/ai-shuffle'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.ci.outputs.ready }}
      revision: ${{ steps.ci.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Skip an unchanged main revision
        id: changed
        run: python3 scripts/ci/nightly_changed.py
      - uses: actions/setup-python@v5
        if: steps.changed.outputs.changed == 'true'
        with:
          python-version: '3.12'
      - run: python -m pip install "httpx==0.27.2" "cryptography>=44.0.0"
        if: steps.changed.outputs.changed == 'true'
      - name: Select the newest attested unpublished first-parent revision
        if: steps.changed.outputs.changed == 'true'
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/edge_publication_gate.py --select

  ui:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/source-ui-bundle.yml
    with:
      source-ref: ${{ needs.gate.outputs.revision }}

  publish:
    needs: [gate, ui]
    if: needs.gate.outputs.ready == 'true'
    # A manual retry must not interrupt a scheduled signing/database write.
    concurrency:
      group: desktop-source-publish
      cancel-in-progress: false
    # Signing secrets are available only after the read-only gate succeeds.
    runs-on: ubuntu-latest
    environment: account-hub-production
    permissions:
      contents: write
      statuses: read
      actions: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .publication-control
    env:
      SOURCE_REVISION: ${{ needs.gate.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      # Control code is trusted workflow-main code, never an older candidate.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .publication-control
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "httpx==0.27.2" "cryptography>=44.0.0"
      # Superseded jobs exit before installing the Node publication dependencies.
      - name: Skip superseded publication before build setup
        id: settled
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I scripts/ci/edge_publication_gate.py --source-root "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        if: steps.settled.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .publication-control/scripts/source-publisher/package-lock.json
      - run: npm ci --no-audit --no-fund
        if: steps.settled.outputs.ready == 'true'
        working-directory: .publication-control/scripts/source-publisher
      - name: Recheck the pass and main immediately before signing
        if: steps.settled.outputs.ready == 'true'
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I scripts/ci/edge_publication_gate.py --source-root "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v4
        if: steps.ci.outputs.ready == 'true'
        with:
          name: source-ui
          path: ${{ runner.temp }}/source-ui
      - name: Publish signed source revision
        if: steps.ci.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_UI_BUNDLE_FILE: ${{ runner.temp }}/source-ui/ui.zip
          DESKTOP_APPLICATION_SIGNING_KEY: ${{ secrets.DESKTOP_APPLICATION_SIGNING_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_HUB_DATABASE_ID: ${{ vars.ACCOUNT_HUB_DATABASE_ID }}
          RELEASE_GITHUB_REPO: ${{ vars.RELEASE_GITHUB_REPO || 'HobbyCoders/ai-shuffle' }}
          RELEASE_GITHUB_REPO_ID: ${{ vars.RELEASE_GITHUB_REPO_ID }}
        run: node desktop/scripts/publish-source.mjs --source-root "$GITHUB_WORKSPACE"
