name: Publish desktop source update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-source-publish
  cancel-in-progress: false

jobs:
  publish:
    # Only mirror and sign GitHub's source ZIP. No app builds or Blacksmith runners.
    runs-on: ubuntu-latest
    environment: account-hub-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/hub/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: android/hub
      - name: Ensure private source bucket exists
        working-directory: android/hub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler r2 bucket info ai-shuffle-desktop-sources || npx wrangler r2 bucket create ai-shuffle-desktop-sources || npx wrangler r2 bucket info ai-shuffle-desktop-sources
      - name: Publish authenticated source revision
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_APPLICATION_SIGNING_KEY: ${{ secrets.DESKTOP_APPLICATION_SIGNING_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node desktop/scripts/publish-source.mjs
