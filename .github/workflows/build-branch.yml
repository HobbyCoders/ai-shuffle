name: Build Branch Image (Lab)

# Builds a single-platform (linux/amd64) image for a non-main branch and
# pushes it to ghcr.io tagged with the branch name, so an agent can pull a
# disposable test image without waiting on a full multi-arch main/tag build.
#
# Manual only: `gh workflow run build-branch.yml --ref <branch>`. Pushes
# never build an image; every build is an explicit dispatch.
on:
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Build without Docker cache (forces full rebuild)'
        required: false
        type: boolean
        default: false

concurrency:
  group: docker-build-branch-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Lab images go to the private package too (see docker-publish.yml).
  IMAGE_NAME: ${{ github.repository_owner }}/ai-shuffle-server

jobs:
  build:
    timeout-minutes: 30
    # Standard Linux runner with BuildKit layers cached in GitHub Actions.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker requires lowercase image names but github.repository preserves casing
      - name: Lowercase image name
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      # Tag as branch-<sanitized-branch-name> plus a sha tag for traceability.
      # Single platform + direct push (no digest/manifest-list dance) since this
      # is amd64-only for the Unraid lab host, not a public multi-arch release.
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch,prefix=branch-
            type=sha,prefix=sha-

      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ai-shuffle:postgres-candidate
          load: true
          push: false
          # Shared scope; GitHub cache access remains branch-isolated.
          cache-from: type=gha,scope=Dockerfile
          cache-to: type=gha,mode=max,scope=Dockerfile
          no-cache: ${{ inputs.no_cache == true }}
          build-args: GIT_SHA=${{ github.sha }}

      - name: Verify actual container lifecycle and UI
        run: python scripts/verify_container_postgres.py --image ai-shuffle:postgres-candidate --artifacts "$RUNNER_TEMP/container-postgres"

      # Diagnostics only: a lab image is pushed only after verification passes.
      - name: Upload container evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: container-postgres-${{ github.sha }}
          path: ${{ runner.temp }}/container-postgres
          if-no-files-found: ignore

      - name: Push verified candidate without rebuilding
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag ai-shuffle:postgres-candidate "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
