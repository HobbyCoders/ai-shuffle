name: Withdraw stable release

# Stops the update feed offering a bad stable release, or offers it again
# (docs/ci/release-channels.md, "A bad stable release"). Calls the hub's
# POST /v1/releases/stable/{version} (android/hub/src/release-admin.ts) with
# the RELEASE_ADMIN_TOKEN secret; nothing is built, signed or deployed.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version, such as 0.9.2 (no "v")
        required: true
        type: string
      action:
        description: withdraw stops offering it; restore offers it again
        required: true
        type: choice
        options:
          - withdraw
          - restore
      reason:
        description: One line for the record (withdraw only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: withdraw-release
  cancel-in-progress: false

jobs:
  withdraw:
    if: >-
      github.repository == 'HobbyCoders/ai-shuffle' && github.actor_id == '76577322' && github.triggering_actor == github.actor && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: account-hub-production
    steps:
      - name: Call the hub
        env:
          RELEASE_ADMIN_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
          VERSION: ${{ inputs.version }}
          ACTION: ${{ inputs.action }}
          REASON: ${{ inputs.reason }}
        run: |
          : "${RELEASE_ADMIN_TOKEN:?Set RELEASE_ADMIN_TOKEN in the account-hub-production environment secrets}"
          if ! printf '%s' "$VERSION" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::version must look like 0.9.2"; exit 1
          fi
          if [ "$ACTION" = withdraw ]; then
            body=$(jq -cn --arg reason "$REASON" '{withdrawn: true} + (if $reason == "" then {} else {reason: $reason} end)')
          else
            body='{"withdrawn":false}'
          fi
          status=$(curl -sS -o "$RUNNER_TEMP/response.json" -w '%{http_code}' -X POST \
            "https://hobbycoders.com/v1/releases/stable/$VERSION" \
            -H "Authorization: Bearer $RELEASE_ADMIN_TOKEN" -H 'Content-Type: application/json' \
            --data "$body")
          jq . "$RUNNER_TEMP/response.json" || cat "$RUNNER_TEMP/response.json"
          if [ "$status" != 200 ]; then echo "::error::The hub answered $status"; exit 1; fi
          {
            echo "## $ACTION $VERSION"
            echo
            echo "Stable feed now serves: $(jq -r '.serving.version // "nothing"' "$RUNNER_TEMP/response.json")"
            held=$(jq -r '.held // empty' "$RUNNER_TEMP/response.json")
            if [ -n "$held" ]; then echo; echo "Held: $held"; fi
          } >> "$GITHUB_STEP_SUMMARY"
