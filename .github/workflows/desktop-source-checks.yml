name: Desktop source update checks
on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'android/hub/**'
      - '.github/workflows/desktop-source*.yml'
      - 'Start AI Shuffle.cmd'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm test
        working-directory: desktop
      - run: npm ci --no-audit --no-fund && npm run typecheck && npm test
        working-directory: android/hub
