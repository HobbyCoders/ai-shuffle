name: Desktop source update checks
# Checks the app side of the source-update protocol on every PR.
# Cloud-side checks run separately.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # CI's daily run gets its own group so it never queues with a push run.
  group: desktop-source-checks-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'schedule' && '-daily' || github.event_name == 'workflow_dispatch' && '-manual' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm test
        working-directory: desktop
