name: Desktop source update checks
# Checks the app side of the source-update protocol on every PR.
# Cloud-side checks run separately.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-source-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm test
        working-directory: desktop

  # Leave a record that these checks passed on exactly these files, so
  # main-suite need not repeat them after the merge (scripts/ci/proven.py).
  record:
    needs: [check]
    if: needs.check.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/record-pass.yml
    with:
      area: desktop-source
