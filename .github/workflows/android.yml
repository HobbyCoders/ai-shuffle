name: Android CI
run-name: "${{ github.workflow }}${{ github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:full' && ' (unrelated label event)' || '' }}"

# Android app (android/) and the Cloudflare account hub (android/hub). Paths-
# filtered like the other CI workflows: a PR that touches nothing under
# android/ never starts it. Chat loads the phone UI from the paired worker's
# /mobile/ (app/mobile_ui.py), so mobile/ and frontend/ changes ship with a
# worker update and are covered by frontend CI, not an emulator run. The APK
# bundles mobile/ only as the offline demo. Signed sideload builds require
# publish_download; normal CI only stages APKs for emulator verification.
# A merge must not ship a client before its workers serve /mobile/
# (docs/mobile-desktop-ui-split.md). Merges to main do not re-run it — the PR
# already did, and the publish job below only fires from a dispatch or a
# release workflow_call that sets publish_download.
#
# Blacksmith runners are PAID per minute; every trigger below is deliberate.
on:
  pull_request:
    # Platform jobs are deferred on PRs. Add ci:full to run them on every push
    # (for PRs that really change this platform); removing it cancels them.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - '.github/workflows/deploy-site.yml'
      - '.github/workflows/deploy-hub.yml'
      - 'scripts/ci/require-full-ci.py'
      - 'scripts/ci/android-inputs.py'
  workflow_dispatch:
    inputs:
      publish_download:
        description: Publish only after compatible workers and account hub are deployed and verified
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish_download:
        description: Compatible workers and account hub have been deployed and verified
        type: boolean
        default: false
      release_tag:
        description: Existing versioned release to attach the verified APK to
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # Unrelated label events must not replace a running OR pending validation.
  group: android-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:full' && github.run_id || 'validation' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Classify Android APK inputs${{ github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:full' && ' (unrelated label event)' || '' }}
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'ci:full'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apk: ${{ steps.inputs.outputs.apk }}
    steps:
      - uses: actions/checkout@v4
      - name: Classify changed paths (manual and release runs always build)
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo 'apk=true' >> "$GITHUB_OUTPUT"
          else
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" > "$RUNNER_TEMP/android-changes.json"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/android-pr.json"
            python3 scripts/ci/android-inputs.py "$RUNNER_TEMP/android-changes.json" "$RUNNER_TEMP/android-pr.json" "$PR_HEAD" >> "$GITHUB_OUTPUT"
          fi

  account-hub:
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'ci:full'
    name: Account hub Worker and D1 tests${{ github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:full' && ' (unrelated label event)' || '' }}
    timeout-minutes: 8
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: android/hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            android/hub/package-lock.json
            android/site/package-lock.json
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Cloudflare deploy guard and configuration tests
        working-directory: .
        run: python3 android/ci/test-cloudflare-deploy.py
      # The website Worker shares the hostname, so it is checked in the same job.
      - name: Website Worker tests
        working-directory: android/site
        run: npm ci && npm run typecheck && npm test
      # The Vitest suite never lays a page out; this checks the docs pages in
      # Chromium at phone and desktop widths (no page-wide horizontal scroll).
      - name: Website rendered layout tests
        working-directory: android/site
        run: |
          npx --no-install playwright-core install --with-deps --only-shell chromium
          npm run test:rendered
      - name: Chat download bridge tests
        working-directory: android
        run: node --test app/src/test/js/chat-downloads.test.cjs

  build:
    needs: changes
    if: needs.changes.outputs.apk == 'true'
    name: Build and test Android app${{ github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:full' && ' (unrelated label event)' || '' }}
    timeout-minutes: 20
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Robolectric's Android 16 runtime requires Java 21; app bytecode stays 17.
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Make gradlew executable
        run: chmod +x gradlew

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The APK carries mobile/ (+ shared frontend/src/lib) only as the offline
      # demo; chat loads the UI from the worker. Gradle's checkOfflineDemo task
      # refuses to assemble without it, so this runs before any gradlew invocation.
      - name: Build and bundle the offline demo
        working-directory: frontend
        run: |
          npm ci
          bash ../android/scripts/sync-offline-demo.sh

      - name: Unit tests and Android lint
        run: |
          python3 ci/test-apk-download.py
          python3 ci/test-publish-apk.py
          python3 ci/test-mobile-apk.py
          ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Build and verify debug APK
        run: |
          ./gradlew assembleDebug --max-workers=2 --stacktrace
          python3 ci/verify-mobile-apk.py app/build/outputs/apk/debug/app-debug.apk
      - name: Build Android test APK
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
        run: ./gradlew assembleDebugAndroidTest --max-workers=2 --stacktrace

      - name: Upload instrumentation APKs
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: android-instrumentation-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: github.repository == 'HobbyCoders/ai-shuffle' && github.actor_id == '76577322' && github.triggering_actor == github.actor && ((github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && inputs.publish_download && github.event_name != 'pull_request' && (inputs.release_tag != '' || github.ref == 'refs/heads/main')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — cannot sign the release APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        if: github.repository == 'HobbyCoders/ai-shuffle' && github.actor_id == '76577322' && github.triggering_actor == github.actor && ((github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && inputs.publish_download && github.event_name != 'pull_request' && (inputs.release_tag != '' || github.ref == 'refs/heads/main')
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # Minutes since the Unix epoch fit Android's versionCode range and
          # increase across both main CI and the separate release workflow.
          export ANDROID_VERSION_CODE=$(( $(date +%s) / 60 ))
          if [ -n "$RELEASE_TAG" ]; then
            version="$(printf '%s' "$RELEASE_TAG" | tr -d '[:space:]')"
            version="${version#v}"; version="${version#V}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || exit 1
            export ANDROID_VERSION_NAME="$version"
          fi
          ./gradlew assembleRelease bundleRelease --stacktrace
          python3 ci/verify-mobile-apk.py app/build/outputs/apk/release/app-release.apk
          python3 ci/verify-mobile-apk.py --app-bundle app/build/outputs/bundle/release/app-release.aab

      - name: Verify APK is signed with the release key
        if: github.repository == 'HobbyCoders/ai-shuffle' && github.actor_id == '76577322' && github.triggering_actor == github.actor && ((github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && inputs.publish_download && github.event_name != 'pull_request' && (inputs.release_tag != '' || github.ref == 'refs/heads/main')
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Prepare public APK download
        if: github.repository == 'HobbyCoders/ai-shuffle' && github.actor_id == '76577322' && github.triggering_actor == github.actor && ((github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && inputs.publish_download && github.event_name != 'pull_request' && (inputs.release_tag != '' || github.ref == 'refs/heads/main')
        run: python3 ci/prepare-apk-download.py

      - name: Upload public download files
        if: github.repository == 'HobbyCoders/ai-shuffle' && github.actor_id == '76577322' && github.triggering_actor == github.actor && ((github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && inputs.publish_download && github.event_name != 'pull_request' && (inputs.release_tag != '' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: android-download
          path: android/app/build/outputs/download/
          if-no-files-found: error

  android-ui:
    name: Android emulator verification (API ${{ matrix.api }})${{ github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:full' && ' (unrelated label event)' || '' }}
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 34
            target: default
          - api: 36
            target: google_apis
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-instrumentation-apks
          # run-android-ui-tests.sh installs from instrumentation-apks/ relative
          # to android/, its working directory.
          path: android/instrumentation-apks
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Check emulator readiness and instrumentation result parsers
        run: |
          python3 ci/test-emulator-readiness.py
          python3 ci/test-instrumentation-parser.py
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      # The emulator action catches launch-hook errors and still attempts boot.
      # A separate failing step is necessary to genuinely stop before launch.
      - name: Prepare AVD and check disk space before emulator startup
        run: |
          sdkmanager --install platform-tools 'platforms;android-${{ matrix.api }}' emulator 'system-images;android-${{ matrix.api }};${{ matrix.target }};x86_64'
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager create avd --force --name test --package 'system-images;android-${{ matrix.api }};${{ matrix.target }};x86_64' --device pixel_6 <<< no
          printf '\ndisk.dataPartition.size=6144M\n' >> "$ANDROID_AVD_HOME/test.avd/config.ini"
          bash ci/emulator-diagnostics.sh before-boot
          bash ci/emulator-storage.sh check
      - name: Exercise native onboarding and tool permissions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          working-directory: android
          # Reuse the AVD whose filesystem passed the standalone preflight.
          force-avd-creation: false
          # API 24+ first boot enforces 6 GiB regardless of smaller requests.
          disk-size: 6144M
          disable-animations: true
          pre-emulator-launch-script: bash ci/emulator-diagnostics.sh before-boot
          # Persist startup errors and guest logcat even if boot fails before script runs.
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back emulated -no-snapshot -memory 2048 -cores 2
            -logcat '*:I' > "$RUNNER_TEMP/android-emulator/emulator.log" 2>&1
          script: bash ci/run-android-ui-tests.sh
      - name: Collect emulator host diagnostics
        if: always()
        run: bash ci/emulator-diagnostics.sh after-emulator
      # Diagnostics only: a passing run is proven by the job result, so keep
      # reports, logcat and screenshots only when verification fails.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: android-ui-verification-api-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/android-emulator/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/ui-screenshots/
            android/app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn

  publish:
    name: Publish verified Android download${{ github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:full' && ' (unrelated label event)' || '' }}
    needs: [account-hub, build, android-ui]
    if: github.repository == 'HobbyCoders/ai-shuffle' && github.actor_id == '76577322' && github.triggering_actor == github.actor && ((github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && inputs.publish_download && github.event_name != 'pull_request' && (inputs.release_tag != '' || github.ref == 'refs/heads/main')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      contents: write
    # Never interrupt an asset upload midway through replacing the rolling APK.
    concurrency:
      group: android-download-${{ inputs.release_tag || 'android-latest' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-download
          path: android-download
      - name: Publish APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash android/ci/publish-apk.sh android-download

  readiness:
    name: Android merge readiness${{ github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:full' && ' (unrelated label event)' || '' }}
    needs: ['changes', 'account-hub', 'build', 'android-ui']
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'ci:full') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Require successful checks for this revision
        env:
          CI_FULL_REQUESTED: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          CI_REQUIRED_RESULTS: ${{ toJSON(needs) }}
          CI_DEFERRABLE_JOBS: '["android-ui"]'
          CI_ANDROID_APK_REQUIRED: ${{ needs.changes.outputs.apk }}
        run: python3 scripts/ci/require-full-ci.py
