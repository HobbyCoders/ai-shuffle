name: Android CI

# Android app (android/) and the Cloudflare account hub (android/hub). Paths-
# filtered like the other CI workflows: a PR that touches nothing under
# android/ never starts it. The push-to-main leg keeps producing the signed
# release APK artifact and publishes a permanent download after all checks pass.
on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Existing versioned release to attach the verified APK to
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  account-hub:
    name: Account hub Worker and D1 tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: android/hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/hub/package-lock.json
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Chat download bridge tests
        working-directory: android
        run: node --test app/src/test/js/chat-downloads.test.cjs

  build:
    name: Build signed release APK
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests and Android lint
        run: |
          python3 ci/test-apk-download.py
          python3 ci/test-publish-apk.py
          ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Build instrumentation APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --max-workers=2 --stacktrace

      - name: Upload instrumentation APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — cannot sign the release APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # Minutes since the Unix epoch fit Android's versionCode range and
          # increase across both main CI and the separate release workflow.
          export ANDROID_VERSION_CODE=$(( $(date +%s) / 60 ))
          if [ -n "$RELEASE_TAG" ]; then
            version="$(printf '%s' "$RELEASE_TAG" | tr -d '[:space:]')"
            version="${version#v}"; version="${version#V}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || exit 1
            export ANDROID_VERSION_NAME="$version"
          fi
          ./gradlew assembleRelease --stacktrace

      - name: Verify APK is signed with the release key
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Prepare public APK download
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: python3 ci/prepare-apk-download.py

      - name: Upload release APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: ai-shuffle-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload public download files
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: android-download
          path: android/app/build/outputs/download/
          if-no-files-found: error

  android-ui:
    name: Android emulator verification
    needs: build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-instrumentation-apks
          # run-android-ui-tests.sh installs from instrumentation-apks/ relative
          # to android/, its working directory.
          path: android/instrumentation-apks
      - uses: android-actions/setup-android@v3
      - name: Check emulator readiness and instrumentation result parsers
        run: |
          python3 ci/test-emulator-readiness.py
          python3 ci/test-instrumentation-parser.py
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      # The emulator action catches launch-hook errors and still attempts boot.
      # A separate failing step is necessary to genuinely stop before launch.
      - name: Prepare AVD and check disk space before emulator startup
        run: |
          sdkmanager --install platform-tools 'platforms;android-34' emulator 'system-images;android-34;default;x86_64'
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avdmanager create avd --force --name test --package 'system-images;android-34;default;x86_64' --device pixel_6 <<< no
          printf '\ndisk.dataPartition.size=6144M\n' >> "$ANDROID_AVD_HOME/test.avd/config.ini"
          bash ci/emulator-diagnostics.sh before-boot
          bash ci/emulator-storage.sh check
      - name: Exercise native onboarding and tool permissions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          working-directory: android
          # Reuse the AVD whose filesystem passed the standalone preflight.
          force-avd-creation: false
          # API 24+ first boot enforces 6 GiB regardless of smaller requests.
          disk-size: 6144M
          disable-animations: true
          pre-emulator-launch-script: bash ci/emulator-diagnostics.sh before-boot
          # Persist startup errors and guest logcat even if boot fails before script runs.
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back emulated -no-snapshot -memory 2048 -cores 2
            -logcat '*:I' > "$RUNNER_TEMP/android-emulator/emulator.log" 2>&1
          script: bash ci/run-android-ui-tests.sh
      - name: Collect emulator host diagnostics
        if: always()
        run: bash ci/emulator-diagnostics.sh after-emulator
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-verification
          path: |
            ${{ runner.temp }}/android-emulator/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/outputs/ui-screenshots/
            android/app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn

  publish:
    name: Publish verified Android download
    needs: [account-hub, build, android-ui]
    if: github.event_name != 'pull_request' && (inputs.release_tag != '' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # Never interrupt an asset upload midway through replacing the rolling APK.
    concurrency:
      group: android-download-${{ inputs.release_tag || 'android-latest' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-download
          path: android-download
      - name: Publish APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: bash android/ci/publish-apk.sh android-download
