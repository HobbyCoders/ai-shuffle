name: Build source-update UI bundle

on:
  workflow_call:
    inputs:
      source-ref:
        required: true
        type: string
      version:
        default: ''
        type: string
      artifact-name:
        default: source-ui
        type: string
      optional:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only the speculative main-suite cache may fail open. Publication callers
    # retain the blocking default and rebuild when a cache is unavailable.
    continue-on-error: ${{ inputs.optional }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          # The caller's control revision, never Python from an older candidate.
          ref: ${{ github.workflow_sha }}
          path: .ui-control
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve the immutable UI source revision
        id: source
        run: |
          revision=$(git rev-parse HEAD)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          version="$UI_VERSION"
          if [ -z "$version" ]; then
            version=$(python -I .ui-control/scripts/ci/publication_source.py version --source-root "$GITHUB_WORKSPACE" --revision "$revision" | python -I -c 'import json, sys; print(json.load(sys.stdin))')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          UI_VERSION: ${{ inputs.version }}
      - name: Build desktop and phone together without publication credentials
        env:
          UI_REVISION: ${{ steps.source.outputs.revision }}
          UI_VERSION: ${{ steps.source.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/source-ui"
          python -I .ui-control/scripts/build_ui_bundle.py --source-root "$GITHUB_WORKSPACE" --revision "$UI_REVISION" --version "$UI_VERSION" --output "$RUNNER_TEMP/source-ui/ui.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/source-ui/ui.zip
          retention-days: 7
          if-no-files-found: error
