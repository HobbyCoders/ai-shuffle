name: iOS CI

# iOS app (ios/). Builds the mobile UI it bundles, generates the Xcode project
# with XcodeGen, builds for the iOS Simulator without signing and runs the unit
# and WebKit tests. Paths-filtered like Android CI: only PRs that touch ios/ or
# mobile/ start it. frontend/ is deliberately not a trigger (same reasoning as
# android.yml); run this manually for a frontend PR that matters to the phone.
#
# macOS runners are PAID per minute and cost more than Linux ones. This
# workflow never signs, uploads or publishes; TestFlight stays a manual,
# owner-gated step (ios/RELEASING.md).
on:
  pull_request:
    paths:
      - 'ios/**'
      - 'mobile/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  simulator:
    name: Build and test iOS app (Simulator)
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The app ships its own build of the mobile UI (mobile/ + shared
      # frontend/src/lib); the app target refuses to build without it.
      - name: Build and bundle the mobile UI
        working-directory: frontend
        run: |
          npm ci
          bash ../ios/scripts/sync-mobile-ui.sh

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Build for the Simulator and run tests (unsigned)
        working-directory: ios
        run: |
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if ".iOS-" in runtime:
                  for device in devices[runtime]:
                      if device["name"].startswith("iPhone"):
                          print(device["udid"]); sys.exit(0)
          ')"
          if [ -z "$udid" ]; then echo '::error::No available iPhone simulator'; exit 1; fi
          xcodebuild test -quiet \
            -project AIShuffle.xcodeproj -scheme AIShuffle \
            -destination "id=$udid" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
