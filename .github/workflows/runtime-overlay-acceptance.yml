name: Docker runtime overlay acceptance

# Native, disposable acceptance only. No registry pushes or publisher credentials.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/runtime-overlay-acceptance.yml'
      - 'scripts/release/overlay_acceptance.py'
      - 'docker/update_contract.py'

permissions:
  contents: read

concurrency:
  group: runtime-overlay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  acceptance:
    name: Python 3.13 overlay (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
            url: https://github.com/astral-sh/python-build-standalone/releases/download/20261021/cpython-3.13.17%2B20261021-x86_64-unknown-linux-gnu-install_only.tar.gz
            sha256: cbda6f7767884fc456860b11fd184391a9320cae00a86c0f49a1c7ac6e236f7a
            size: 76891798
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
            url: https://github.com/astral-sh/python-build-standalone/releases/download/20261021/cpython-3.13.17%2B20261021-aarch64-unknown-linux-gnu-install_only.tar.gz
            sha256: 616ab0a31b2a3f28119582f4d1943e342f13bac2ec5a8dfe8572c3c0bcadb95a
            size: 58800287
    steps:
      - uses: actions/checkout@v4
      - name: Verify native runner architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: test "$(uname -m)" = "$EXPECTED_MACHINE"
      - name: Fetch the pinned candidate runtime
        env:
          OVERLAY_URL: ${{ matrix.url }}
          OVERLAY_SHA256: ${{ matrix.sha256 }}
          OVERLAY_SIZE: ${{ matrix.size }}
        run: |
          mkdir -p "$RUNNER_TEMP/overlay-input" "$RUNNER_TEMP/overlay-evidence"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            "$OVERLAY_URL" -o "$RUNNER_TEMP/overlay-input/python.tar.gz"
          test "$(stat -c %s "$RUNNER_TEMP/overlay-input/python.tar.gz")" = "$OVERLAY_SIZE"
          printf '%s  %s\n' "$OVERLAY_SHA256" "$RUNNER_TEMP/overlay-input/python.tar.gz" | sha256sum --check
      - uses: docker/setup-buildx-action@v3
      - name: Build disposable image from this revision
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          tags: ai-shuffle:overlay-acceptance
          load: true
          push: false
          cache-from: type=gha,scope=overlay-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=overlay-${{ matrix.arch }}
          build-args: GIT_SHA=${{ github.sha }}
      - name: Signed activation, cold restart, rollback and refusals
        run: |
          docker run --rm --user appuser --entrypoint python3 \
            --mount "type=bind,src=$RUNNER_TEMP/overlay-input,dst=/harness,readonly" \
            ai-shuffle:overlay-acceptance -I /app/scripts/release/overlay_acceptance.py \
            --overlay /harness/python.tar.gz --capability python-3.13 \
            --executable python/bin/python3 \
            > "$RUNNER_TEMP/overlay-evidence/acceptance.json"
      # The signed harness uses a stand-in app. Test the real locked dependencies
      # separately, in a fresh venv on the exact same candidate interpreter.
      - name: Install real application dependencies on the candidate runtime
        run: |
          docker run --rm --user appuser --entrypoint /bin/sh \
            --mount "type=bind,src=$RUNNER_TEMP/overlay-input,dst=/harness,readonly" \
            ai-shuffle:overlay-acceptance -eu -c '
              work=$(mktemp -d)
              tar -xzf /harness/python.tar.gz -C "$work"
              "$work/python/bin/python3" -m venv "$work/venv"
              python="$work/venv/bin/python"
              "$python" -m pip install --require-hashes -r /app/requirements.lock
              "$python" -m pip install --only-binary=:all: --require-hashes --no-deps -r /app/requirements-voice.lock
              "$python" -m pip install --no-deps --no-build-isolation /opt/fluid
              "$python" -m pip check
              "$python" -c "import fluid, fastapi, psycopg, cryptography; import sys; print(sys.version)"
            ' > "$RUNNER_TEMP/overlay-evidence/dependencies.log" 2>&1
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-overlay-${{ matrix.arch }}-${{ github.sha }}
          retention-days: 3
          path: ${{ runner.temp }}/overlay-evidence
          if-no-files-found: ignore
