name: CI

# Only run on pushes to main (direct commits/merges) and on pull requests.
# Without the branches filter, a push to a PR branch fires both the `push`
# and `pull_request` events, producing two identical CI runs per commit.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs (force-pushes / rapid successive commits) instead of
# letting stale runs finish and fail/email after a newer commit already ran.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    # Keep a hard job timeout to bound silent backend wedges and surface a useful failure rather than waiting
    # for the platform default.
    timeout-minutes: 20
    runs-on: [self-hosted, aish-ci]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # 3.12 matches production (the Docker image) and the vendored fluid
          # harness's requires-python floor.
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        # The vendored fluid harness must be importable or tests/core's fluid
        # modules fail at COLLECTION, aborting the whole run before any test
        # executes (red on main since the vendor-snapshot commit f9681e4a).
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e ./vendor/fluid

      - name: Run fast test subset
        # The suite uses an in-memory SQLite shim — no Postgres service needed.
        # addopts="" overrides any pytest.ini addopts so this never fails on coverage.
        run: python -m pytest tests/api tests/core tests/db tests/middleware -o addopts="" -q -p no:cacheprovider

  frontend:
    name: Frontend build & type-check
    # Choose a frontend runner suited to the suite parallelism and keep a bounded job timeout.
    timeout-minutes: 15
    runs-on: [self-hosted, aish-ci]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Svelte type-check
        run: npx svelte-check --tsconfig ./tsconfig.json
