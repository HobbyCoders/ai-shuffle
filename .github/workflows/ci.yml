name: CI

# Only run on pushes to main (direct commits/merges) and on pull requests.
# Without the branches filter, a push to a PR branch fires both the `push`
# and `pull_request` events, producing two identical CI runs per commit.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs (force-pushes / rapid successive commits) instead of
# letting stale runs finish and fail/email after a newer commit already ran.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run fast test subset
        # The suite uses an in-memory SQLite shim — no Postgres service needed.
        # addopts="" overrides any pytest.ini addopts so this never fails on coverage.
        run: python -m pytest tests/api tests/core tests/db tests/middleware -o addopts="" -q -p no:cacheprovider

  frontend:
    name: Frontend build & type-check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Svelte type-check
        run: npx svelte-check --tsconfig ./tsconfig.json
