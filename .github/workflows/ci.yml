name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout freezegun

      - name: Run unit tests
        run: pytest tests/core tests/db tests/mcp tests/middleware tests/services --tb=short --timeout=60 -o "addopts=" --no-header -q -p no:cacheprovider
        env:
          PYTHONDONTWRITEBYTECODE: 1

      - name: Run API tests
        run: pytest tests/api --tb=short --timeout=60 -o "addopts=" --no-header -q -p no:cacheprovider
        env:
          PYTHONDONTWRITEBYTECODE: 1

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check (svelte-check)
        working-directory: frontend
        run: npm run check

      - name: Run tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build
