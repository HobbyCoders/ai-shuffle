name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run fast test subset
        # The suite uses an in-memory SQLite shim — no Postgres service needed.
        # addopts="" overrides any pytest.ini addopts so this never fails on coverage.
        run: python -m pytest tests/api tests/core tests/db tests/middleware -o addopts="" -q -p no:cacheprovider

  frontend:
    name: Frontend build & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Svelte type-check
        run: npx svelte-check --tsconfig ./tsconfig.json
