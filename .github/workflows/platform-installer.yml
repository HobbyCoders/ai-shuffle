name: Publish a platform installer

# Publishes a macOS or Linux desktop build, or the Android release APK, to the
# hub's per-platform installer list at /v1/desktop/installers. Run it from the
# release tag (vX.Y.Z; "Use workflow from" set to the tag).
#
# macOS and Linux:
#   1. Run "Build macOS desktop artifact" or "Build Linux desktop artifact"
#      from the tag with the same version, so the artifact name carries the
#      tag's commit.
#   2. Within a day (the artifact expires after one), run this workflow with
#      the platform and that build's run ID.
# Android: run this workflow with platform android and no build run ID. It
# calls Android CI (android.yml) with the tag as release_tag, which builds,
# signs and emulator-verifies the release APK with versionName set to the tag
# and attaches it, its .sha256 and android-build.json to the tag's release.
# A build_run_id of an earlier Android CI run with the same release_tag skips
# the build instead.
#
# It uploads the packages to the tag's GitHub release, then
# desktop/scripts/publish-platform-installer.mjs checks the checksum file and
# build provenance, signs the installer entry and points the hub at it. It
# refuses an APK whose versionName is not the tag. The Windows installer path
# is unchanged.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to publish
        required: true
        type: choice
        options: [mac, linux, android]
      build_run_id:
        description: Run ID of the build of this tag (desktop-macos-artifact.yml, desktop-linux-artifact.yml, or android.yml with this release_tag). Leave empty for android to build it in this run.
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: platform-installer-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  android-build:
    name: Build and verify the release APK
    if: inputs.platform == 'android' && inputs.build_run_id == '' && github.ref_type == 'tag'
    uses: ./.github/workflows/android.yml
    with:
      publish_download: true
      release_tag: ${{ github.ref_name }}
    secrets: inherit

  publish:
    needs: android-build
    # Runs after a successful APK build, or without one for a given run ID.
    if: ${{ !cancelled() && (needs.android-build.result == 'success' || needs.android-build.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Holds DESKTOP_APPLICATION_SIGNING_KEY, CLOUDFLARE_API_TOKEN,
    # CLOUDFLARE_ACCOUNT_ID and ACCOUNT_HUB_DATABASE_ID, and only runs for v* tags.
    environment: release-signing
    timeout-minutes: 20
    env:
      PLATFORM: ${{ inputs.platform }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Require a stable release tag
        if: github.ref_type != 'tag'
        run: |
          echo '::error::Run this workflow from a vX.Y.Z tag'
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Name the build artifact of this tag
        id: artifact
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Stable vX.Y.Z tag required'; exit 1; }
          if [ "$PLATFORM" = android ]; then
            # android.yml's download artifact has a fixed name; android-build.json
            # inside it carries the version and commit the publisher checks.
            [[ -z "$BUILD_RUN_ID" || "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::Invalid build run ID'; exit 1; }
            echo "name=android-download" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::The build run ID is required for mac and linux'; exit 1; }
          prefix=$([ "$PLATFORM" = mac ] && echo macos || echo linux)
          revision=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          echo "name=$prefix-desktop-${RELEASE_TAG#v}-$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: artifact
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id || github.run_id }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/hub/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: android/hub
      - name: Upload packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          shopt -s nullglob
          if [ "$PLATFORM" = android ]; then
            (cd artifact && sha256sum --check AI-Shuffle-Android.apk.sha256)
            files=(artifact/AI-Shuffle-Android.apk artifact/AI-Shuffle-Android.apk.sha256 artifact/android-build.json)
          else
            (cd artifact && sha256sum --check SHA256SUMS)
            suffix=$([ "$PLATFORM" = mac ] && echo macos || echo linux)
            # Windows already publishes SHA256SUMS on the same release.
            cp artifact/SHA256SUMS "artifact/SHA256SUMS-$suffix"
            files=(artifact/*.dmg artifact/*.zip artifact/*.AppImage artifact/*.deb artifact/*-build-provenance.json "artifact/SHA256SUMS-$suffix")
          fi
          for file in "${files[@]}"; do
            if grep -Fxq "$(basename "$file")" <<< "$existing"; then
              echo "$(basename "$file") is already on the release; the publisher checks its bytes."
            else
              gh release upload "$RELEASE_TAG" "$file"
            fi
          done
      - name: Sign and point the hub at the installer
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_APPLICATION_SIGNING_KEY: ${{ secrets.DESKTOP_APPLICATION_SIGNING_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_HUB_DATABASE_ID: ${{ vars.ACCOUNT_HUB_DATABASE_ID }}
        run: node desktop/scripts/publish-platform-installer.mjs "$PLATFORM" artifact "$RELEASE_TAG"
