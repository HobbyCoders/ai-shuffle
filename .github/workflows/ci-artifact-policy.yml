name: CI artifact storage policy

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/*.py'
      - 'tests/scripts/test_owner_publication_policy.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install PyYAML==6.0.3 pytest==9.1.1
      - run: python scripts/ci/test-artifact-policy.py
      - run: python scripts/ci/test-cost-policy.py
      - run: python scripts/ci/test-merge-gate.py
      - run: python -m pytest -q -o addopts="" --confcutdir=tests/scripts tests/scripts/test_owner_publication_policy.py
