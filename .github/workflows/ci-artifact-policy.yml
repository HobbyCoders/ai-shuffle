name: CI artifact storage policy

on:
  pull_request:
  workflow_call:
    inputs:
      main_suite:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-artifact-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: inputs.main_suite != true
        run: python -m pip install PyYAML==6.0.3 pytest==9.1.1 httpx==0.27.2 cryptography==50.0.1
      # Only the main-suite caller expands policy coverage. PR/manual behaviour
      # retains its existing lightweight dependencies and two-file selection.
      - if: inputs.main_suite == true
        run: pip install -r requirements.txt -r requirements-dev.txt && pip install -e ./fluid
      - run: python scripts/ci/test-artifact-policy.py
      - run: python scripts/ci/test-cost-policy.py
      - if: inputs.main_suite != true
        run: python -m pytest -q -o addopts="" --confcutdir=tests/scripts tests/scripts/test_owner_publication_policy.py tests/scripts/test_edge_publication_gate.py
      # The pre-push gate runs no test suites. Its Android CI-script, Play
      # workflow, download-bridge and docs-copy checks run here on every PR;
      # main-suite runs the same command in its android-and-docs job.
      - if: inputs.main_suite != true
        run: python scripts/ci/main_suite.py android-and-docs
      - if: inputs.main_suite == true
        run: python -m pytest -q -o addopts="" --confcutdir=tests/scripts tests/scripts/test_owner_publication_policy.py tests/scripts/test_edge_publication_gate.py tests/scripts/test_local_ci.py tests/scripts/test_local_ci_preflight.py tests/scripts/test_local_ci_stages.py tests/scripts/test_security_gate.py tests/scripts/test_cloud_split.py tests/scripts/test_main_suite_parity.py
