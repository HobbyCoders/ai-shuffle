name: Merge gate

# One required status for every PR: "Merge gate". It is a commit status on the
# PR head, written by scripts/ci/merge-gate.py, which works out from each
# workflow's own pull_request path filters which suites apply and reports
# success only when the newest run of every applicable suite passed for that
# exact SHA. See docs/ci/merge-gate.md for how to require it.
#
# Event-driven rather than a polling job, so the cost is seconds per
# evaluation instead of a runner idling for as long as the slowest suite:
#   - pull_request_target: every push, reopen and label change writes pending,
#     waits up to three minutes for the applicable runs to be created, then
#     writes the verdict (immediately success when nothing applies).
#   - workflow_run: every watched workflow completing re-evaluates the SHA.
#   - workflow_dispatch: re-evaluate one PR by hand if a status looks stuck.
# Both automatic triggers run the default branch's copy of this file and
# script, so a PR cannot weaken the gate that judges it. PR code is never
# checked out or executed; the PR's workflow files are read as data.
#
# The workflows list must name every workflow with a pull_request trigger;
# scripts/ci/test-merge-gate.py enforces that.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_run:
    workflows:
      - Android CI
      - Android Play internal release
      - Android Play signing enrollment
      - CI artifact storage policy
      - CI Backend
      - CI Browser Workspace
      - CI fluid
      - CI JavaScript
      - Container PostgreSQL
      - Desktop CI
      - Desktop source update checks
      - Instance identity contracts
      - License server CI
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to re-evaluate
        required: true
        type: string

permissions: {}

# One evaluation per SHA at a time. A newer queued evaluation replaces an older
# queued one; each reads the full current state, so the last writer is always
# the newest evaluation.
concurrency:
  group: merge-gate-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  evaluate:
    # Deliberately not named "Merge gate": the required context is the commit
    # status, and a same-named job check would be ambiguous.
    name: Evaluate merge gate
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'workflow_dispatch'
    # Smallest GitHub-hosted runner (1 vCPU, 15-minute job cap). The longest
    # evaluation is the three-minute start-up wait plus a few API calls.
    runs-on: ubuntu-slim
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The default branch, never the PR head or merge commit.
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/ci
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Evaluate applicable suites and write the status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci/merge-gate.py
