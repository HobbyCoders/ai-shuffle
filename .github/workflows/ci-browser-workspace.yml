name: CI Browser Workspace

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-browser-workspace-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    name: Browser editor smoke checks
    # Keep every smoke check on a standard GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser-mcp/package-lock.json
      - run: npm ci --ignore-scripts --prefix browser-mcp
      - run: npm run build --prefix browser-mcp
      - run: npm test --prefix browser-mcp -- test/editors.test.ts

  workspace:
    name: Browser workspace (${{ matrix.chrome-mode }})
    strategy:
      fail-fast: false
      matrix:
        chrome-mode: [external, panel-demand, direct-page-demand]
    timeout-minutes: 25
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TESTING: '1'
      ALLOW_REAL_PG: '0'
      RUN_BROWSER_WORKSPACE_INTEGRATION: '1'
      RUN_BROWSER_WORKSPACE_UI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            fluid/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            browser-mcp/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e ./fluid
      - name: Install and build browser dependencies
        run: |
          npm ci --prefix frontend
          npm ci --ignore-scripts --prefix browser-mcp
          npm run build --prefix browser-mcp
      - name: Cache managed Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser-mcp/package-lock.json') }}
      - name: Install isolated Chromium
        timeout-minutes: 4
        working-directory: browser-mcp
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Use the primary signed Ubuntu archive, not the hosted mirror's
          # slow Azure fallback. Keep suites, components and Signed-By intact.
          sudo sed -i -E 's|^URIs:.*|URIs: https://archive.ubuntu.com/ubuntu/|' /etc/apt/sources.list.d/ubuntu.sources
          # Run the OS timeout as root too: a user-owned timeout cannot reap
          # sudo's apt children, leaving a lock behind for the next command.
          sudo env "PATH=$PATH" timeout --kill-after=10s 90s npx --no-install playwright-core install-deps chromium
          # Browser downloads stay owned by the runner and use its cache.
          timeout --kill-after=10s 90s npx --no-install playwright-core install chromium
          node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "CHROMIUM_PATH=" + require("playwright-core").chromium.executablePath() + "\n")'
      - name: Verify shadow-root auth editor discovery and edits
        working-directory: browser-mcp
        run: npm test -- test/editors.test.ts -t 'nested shadow auth fields'
      # Reuses this job's Chromium and playwright-core; about 15 seconds.
      - name: Verify desktop breadcrumb strip layout
        working-directory: frontend
        run: |
          npx vite dev --config tests/vite.crumb-strip.config.js --host 127.0.0.1 --port 5249 --strictPort > /tmp/crumb-strip-vite.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:5249/tests/crumb-strip.html && break; sleep 1; done
          node tests/verify-crumb-strip.mjs || { cat /tmp/crumb-strip-vite.log; exit 1; }
      - name: Verify shared browser and rendered desktop/mobile UI
        env:
          CHROME_MODE: ${{ matrix.chrome-mode }}
        run: |
          python -m pytest "tests/test_browser_workspace_integration.py::test_real_mcp_and_two_viewers_share_tabs_control_and_viewport[$CHROME_MODE]" -o addopts="" -q -s --timeout=240
          echo "Real Chromium + rendered UI: $CHROME_MODE passed (1/3 cases)." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload browser verification screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-workspace-screenshots-${{ matrix.chrome-mode }}
          path: |
            /tmp/browser-workspace-live-*.png
            /tmp/browser-workspace-*.png
            /tmp/browser-cold-start-*.png
            /tmp/provider-login-*.png
          if-no-files-found: ignore
          retention-days: 3

  browser-workspace:
    name: Real browser workspace
    if: always()
    needs: [smoke, workspace]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every branch to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const results = JSON.parse(process.env.RESULTS);
          const expected = ["smoke", "workspace"];
          assert.deepEqual(Object.keys(results).sort(), [...expected].sort(), 'missing branch');
          for (const name of expected) assert.equal(results[name].result, 'success', name);
          JS

