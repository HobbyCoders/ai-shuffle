name: CI Browser Workspace
run-name: "${{ github.workflow }}${{ github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:full' && ' (unrelated label event)' || '' }}"

on:
  pull_request:
    # Platform jobs are deferred on PRs. Add ci:full to run them on every push
    # (for PRs that really change this platform); removing it cancels them.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - 'app/api/browser_panel.py'
      - 'app/api/openai_billing.py'
      - 'app/core/openai_admin_usage.py'
      - 'app/core/usage_polling.py'
      - 'frontend/src/lib/api/openai-billing*'
      - 'app/api/ws_auth.py'
      - 'app/core/browser*.py'
      - 'app/core/native_chrome.py'
      - 'app/core/mcp_config.py'
      - 'app/core/builtin_mcp_servers.py'
      - 'browser-mcp/**'
      - 'frontend/src/lib/api/browser-panel*'
      - 'frontend/src/lib/browser-panel/**'
      - 'frontend/src/lib/components/browser/**'
      - 'frontend/src/lib/stores/browser-panel*'
      - 'frontend/tests/*browser-workspace*'
      - 'frontend/tests/BrowserWorkspaceParent.svelte'
      - 'frontend/tests/verify-provider-login.mjs'
      - 'frontend/tests/verify-browser-cold-start.mjs'
      - 'frontend/src/lib/components/deck/cards/settings/providers/OpenAICredits.svelte'
      - 'frontend/package*.json'
      - 'tests/test_browser_workspace_integration.py'
      - 'requirements*.txt'
      - '.github/workflows/ci-browser-workspace.yml'
      - 'scripts/ci/require-full-ci.py'
  workflow_dispatch:

concurrency:
  # Unrelated label events must not replace a running OR pending validation.
  group: ci-browser-workspace-${{ github.ref }}-${{ github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:full' && github.run_id || 'validation' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'ci:full'
    name: Browser editor smoke checks${{ github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:full' && ' (unrelated label event)' || '' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser-mcp/package-lock.json
      - run: npm ci --ignore-scripts --prefix browser-mcp
      - run: npm run build --prefix browser-mcp
      - run: npm test --prefix browser-mcp -- test/editors.test.ts

  workspace:
    name: Real browser workspace${{ github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:full' && ' (unrelated label event)' || '' }}
    needs: smoke
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    timeout-minutes: 10
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      TESTING: '1'
      ALLOW_REAL_PG: '0'
      RUN_BROWSER_WORKSPACE_INTEGRATION: '1'
      RUN_BROWSER_WORKSPACE_UI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            browser-mcp/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e ./fluid
      - name: Install and build browser dependencies
        run: |
          npm ci --prefix frontend
          npm ci --ignore-scripts --prefix browser-mcp
          npm run build --prefix browser-mcp
      - name: Install isolated Chromium
        working-directory: browser-mcp
        run: |
          npx --no-install playwright-core install --with-deps chromium
          node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "CHROMIUM_PATH=" + require("playwright-core").chromium.executablePath() + "\n")'
      - name: Verify shadow-root auth editor discovery and edits
        working-directory: browser-mcp
        run: npm test -- test/editors.test.ts -t 'nested shadow auth fields'
      - name: Verify shared browser and rendered desktop/mobile UI
        run: python -m pytest tests/test_browser_workspace_integration.py -o addopts="" -q -s --timeout=240
      - name: Upload browser verification screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-workspace-screenshots
          path: |
            /tmp/browser-workspace-live-*.png
            /tmp/browser-workspace-*.png
            /tmp/browser-cold-start-*.png
            /tmp/provider-login-*.png
          if-no-files-found: ignore
          retention-days: 3

  readiness:
    name: Browser merge readiness${{ github.event_name == 'pull_request' && (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'ci:full' && ' (unrelated label event)' || '' }}
    needs: ['smoke', 'workspace']
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'ci:full') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Require successful checks for this revision
        env:
          CI_FULL_REQUESTED: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          CI_REQUIRED_RESULTS: ${{ toJSON(needs) }}
          CI_DEFERRABLE_JOBS: '["workspace"]'
        run: python3 scripts/ci/require-full-ci.py
