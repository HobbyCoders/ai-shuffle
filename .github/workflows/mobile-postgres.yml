name: Mobile PostgreSQL contracts

on:
  pull_request:
    paths:
      - 'app/**'
      - 'tests/integration/test_mobile_postgres.py'
      - 'requirements*.txt'
      - 'fluid/**'
      - '.github/workflows/mobile-postgres.yml'
  push:
    branches: ['feat/android-account-hub']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: shuffle_mobile_test
          POSTGRES_USER: shuffle_mobile_test
          POSTGRES_PASSWORD: mobile-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shuffle_mobile_test -d shuffle_mobile_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e ./fluid
      - name: Run isolated real PostgreSQL contracts
        env:
          TESTING: '1'
          ALLOW_REAL_PG: '1'
          MOBILE_POSTGRES_TEST: '1'
          MOBILE_PG_HOST: '127.0.0.1'
          MOBILE_PG_PORT: '5432'
          MOBILE_PG_DATABASE: shuffle_mobile_test
          MOBILE_PG_USER: shuffle_mobile_test
          MOBILE_PG_PASSWORD: mobile-test-only
          AI_SHUFFLE_ENV_FILE: /dev/null
          PYTHONPATH: .
        run: >-
          python -m pytest tests/integration/test_mobile_postgres.py
          --confcutdir=tests/integration -o addopts="" -p no:cacheprovider
          --timeout=60 -v
