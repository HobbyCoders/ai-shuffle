name: main-suite

# One hosted proof per main commit. Dispatches on any other ref fail closed.
# A push skips what a pull request already passed on exactly these files
# (scripts/ci/proven.py); the daily run and a dispatch run everything.
on:
  push:
    branches: [main]
  schedule:
    # Everything, nothing skipped, on whatever main is at 08:00 UTC. It never
    # publishes: the nightly follows push and dispatch runs only.
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A started run always finishes; GitHub keeps only the newest waiting run and
# drops older waiting ones. Cancelling in progress let a burst of merges cancel
# every run, so nothing was proven and the nightly stalled until main went quiet.
# The daily run has its own group so it can never displace a waiting push run.
concurrency:
  group: main-suite-${{ github.ref }}${{ github.event_name == 'schedule' && '-daily' || github.event_name == 'workflow_dispatch' && '-manual' || '' }}
  cancel-in-progress: false

jobs:
  # Build beside the suite, not after it. This optional cache is never proof of
  # eligibility; publication still requires the exact successful main-suite run.
  source-ui:
    if: github.repository == 'HobbyCoders/ai-shuffle' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/source-ui-bundle.yml
    with:
      source-ref: ${{ github.sha }}
      artifact-name: source-ui-${{ github.sha }}-${{ github.run_attempt }}
      optional: true

  # Which areas a pull request already passed on exactly these files. Only a
  # push looks; any doubt or error answers "run it".
  proven:
    name: Find what a pull request already proved
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only a shortcut: if this job fails, every area runs and the run can still pass.
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      fluid: ${{ steps.check.outputs.fluid }}
      windows: ${{ steps.check.outputs.windows }}
      browser-workspace: ${{ steps.check.outputs.browser-workspace }}
      container: ${{ steps.check.outputs.container }}
      identity: ${{ steps.check.outputs.identity }}
      desktop-source: ${{ steps.check.outputs.desktop-source }}
      javascript-checks: ${{ steps.check.outputs.javascript-checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Look for pass records of these exact files
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/proven.py check --areas backend,fluid,windows,browser-workspace,container,identity,desktop-source,javascript-checks >> "$GITHUB_OUTPUT"

  backend:
    needs: [proven]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.ref == 'refs/heads/main') && needs.proven.outputs.backend != 'true' }}
    uses: ./.github/workflows/ci-backend.yml

  javascript:
    needs: [proven]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.ref == 'refs/heads/main') }}
    # The journey selection reads earlier runs and pass records.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/ci-frontend.yml
    with:
      checks_proven: ${{ needs.proven.outputs.javascript-checks == 'true' }}

  fluid:
    needs: [proven]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.ref == 'refs/heads/main') && needs.proven.outputs.fluid != 'true' }}
    uses: ./.github/workflows/ci-fluid.yml

  windows:
    needs: [proven]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.ref == 'refs/heads/main') && needs.proven.outputs.windows != 'true' }}
    uses: ./.github/workflows/windows-suite.yml
    with:
      main_suite: true

  browser-workspace:
    needs: [proven]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.ref == 'refs/heads/main') && needs.proven.outputs.browser-workspace != 'true' }}
    uses: ./.github/workflows/ci-browser-workspace.yml

  container:
    needs: [proven]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.ref == 'refs/heads/main') && needs.proven.outputs.container != 'true' }}
    uses: ./.github/workflows/container-postgres.yml

  identity:
    needs: [proven]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.ref == 'refs/heads/main') && needs.proven.outputs.identity != 'true' }}
    uses: ./.github/workflows/ci-instance-identity.yml
    with:
      main_suite: true

  policy:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci-artifact-policy.yml
    with:
      main_suite: true

  desktop-source:
    needs: [proven]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.ref == 'refs/heads/main') && needs.proven.outputs.desktop-source != 'true' }}
    uses: ./.github/workflows/desktop-source-checks.yml

  desktop:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/desktop.yml
    with:
      main_suite: true

  android-and-docs:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/ci/main_suite.py android-and-docs

  supply-chain:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/secret_scan.py
      # Identical report-only audit semantics to local/full (all locked packages,
      # including source-publisher). Existing hosted audits remain blocking too.
      - run: python scripts/dependency_audit.py
      # The advisory lists change without any file changing, so a pull request's
      # pass record cannot stand for them: the blocking audits of the backend
      # and JavaScript checks always run here, with the same commands.
      - name: Install what the Python audit inspects
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e ./fluid
      - name: Audit public Python dependencies
        timeout-minutes: 8
        run: |
          python -m pip install pip-audit==2.10.1
          python scripts/pip_audit_retry.py --skip-editable
          python scripts/pip_audit_retry.py -r requirements-voice.lock
      - name: Audit JavaScript dependencies
        run: |
          for package in frontend tools browser-mcp; do
            (cd "$package" && npx -y npm@11 audit --audit-level=high)
          done

  update-reach:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt && pip install -e ./fluid
      - name: Update-reach regression tests
        env:
          PYTHONPATH: .:fluid
        run: python -m pytest tests/test_update_reach.py tests/scripts/test_local_ci.py tests/scripts/test_edge_publication_gate.py -o addopts="" -q -n 2 --timeout=120
      - name: Strict signed-publication and merged-PR update reach
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/main_suite.py update-reach

  journey-issues:
    name: Report recovered UI journeys (non-blocking)
    # A red sibling shard must not suppress recovered cases from another shard.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [javascript]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The publisher checks the WHOLE workflow conclusion, not just Main suite.
    # Keep this advisory job outside the aggregate AND non-fatal at job level.
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Open or update flaky journey issues
        id: report
        timeout-minutes: 2
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m scripts.devloop.journey_issues
      - name: Warn if reporting could not finish
        if: always() && (failure() || steps.report.outcome == 'failure')
        run: echo "::warning title=UI journey issue reporting::Reporting could not finish; suite and publication results are unchanged."

  stop-on-failure:
    name: Stop on first failure (non-blocking)
    # A run with a failed job cannot publish. Cancel it at once so the fix is
    # not left waiting behind 20 more minutes of jobs that no longer matter.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Advisory, like the reporter above: outside the aggregate and non-fatal.
    continue-on-error: true
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cancel the run when a required job fails
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/stop_on_failure.py

  main-suite:
    name: Main suite
    if: always()
    needs: [proven, backend, javascript, fluid, windows, browser-workspace, container, identity, policy, desktop-source, desktop, android-and-docs, supply-chain, update-reach]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require every full-suite dependency
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python scripts/ci/main_suite.py aggregate
