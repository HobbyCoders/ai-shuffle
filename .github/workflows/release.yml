name: Release Docker and Android

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag to release (select that same tag as the workflow ref, e.g. v0.8.19)'
        required: true
        type: string
      build_desktop:
        description: 'Also build a Windows installer (desktop normally updates in app)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  packages: write

# Serialize complete releases, not only individual source pointer writes.
concurrency:
  group: stable-release-publish
  cancel-in-progress: false

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  # No publication or signing credentials before source and PR gates pass.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
      release_version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalise release version
        id: version
        # Accept v0.8.5, V0.8.5 or 0.8.5 from the dispatch box; tags are already vX.Y.Z.
        shell: bash
        run: |
          raw="$(printf '%s' "$VERSION" | tr -d '[:space:]')"
          raw="${raw#v}"; raw="${raw#V}"
          normalised="v${raw}"
          [[ "$normalised" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]] || { echo "::error::Invalid release version '$VERSION' (expected vX.Y.Z)"; exit 1; }
          echo "VERSION=$normalised" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$raw" >> "$GITHUB_ENV"
          echo "tag=$normalised" >> "$GITHUB_OUTPUT"
          echo "version=$raw" >> "$GITHUB_OUTPUT"
          echo "Releasing $normalised"
      - name: Require the workflow to run from the existing release tag
        env:
          WORKFLOW_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          [[ "$WORKFLOW_REF" == "refs/tags/$RELEASE_TAG" ]] || { echo "::error::Select the existing release tag as the workflow ref; main dispatch cannot enter the tags-only release environment"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check protected release source, Merge gate and connector bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python scripts/ci/release_preflight.py --tag "$RELEASE_TAG" --github --remote-catalog

  create-release:
    needs: preflight
    environment: release-signing
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.preflight.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.preflight.outputs.release_version }}
    outputs:
      release_tag: ${{ needs.preflight.outputs.release_tag }}
      promote_latest: ${{ steps.promote.outputs.promote_latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.preflight.outputs.release_tag }}
          fetch-depth: 0
      # latest, X.Y and X follow the newest final release only: a patch cut
      # for an older line, or a prerelease, never moves them.
      - name: Decide whether this release becomes latest
        id: promote
        shell: bash
        run: |
          highest="$( { git tag -l 'v[0-9]*'; echo "$VERSION"; } | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -n 1)"
          if [[ "$VERSION" != *-* && "$highest" == "$VERSION" ]]; then promote=true; else promote=false; fi
          echo "promote_latest=$promote" >> "$GITHUB_OUTPUT"
          echo "$VERSION promotes latest: $promote (newest final release: $highest)"

      - name: Check stable signing prerequisites before publication
        if: steps.promote.outputs.promote_latest == 'true'
        env:
          DESKTOP_APPLICATION_SIGNING_KEY: ${{ secrets.DESKTOP_APPLICATION_SIGNING_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_HUB_DATABASE_ID: ${{ vars.ACCOUNT_HUB_DATABASE_ID }}
        run: |
          node --input-type=module <<'JS'
          import { sign, verify } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          for (const name of ['DESKTOP_APPLICATION_SIGNING_KEY', 'CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'ACCOUNT_HUB_DATABASE_ID']) {
            if (!process.env[name]) throw new Error(`${name} is missing in release-signing`);
          }
          if (!/^[a-f0-9-]{36}$/.test(process.env.ACCOUNT_HUB_DATABASE_ID)) throw new Error('Invalid ACCOUNT_HUB_DATABASE_ID');
          const probe = Buffer.from('AI Shuffle release signing preflight');
          const signature = sign(null, probe, process.env.DESKTOP_APPLICATION_SIGNING_KEY);
          if (!verify(null, probe, readFileSync('desktop/build/application-update-key.pem'), signature)) throw new Error('Signing key does not match the shipped update public key');
          console.log('Signing inputs are present and the key matches; deployment access still needs owner verification.');
          JS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: AI Shuffle ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          draft: false
          make_latest: ${{ steps.promote.outputs.promote_latest }}
          prerelease: ${{ contains(env.VERSION, '-') }}
          generate_release_notes: true
          body: |
            ## AI Shuffle ${{ env.VERSION }}

            ### Downloads

            | Build | Platform | Download / install |
            |-------|----------|--------------------|
            | **Desktop** | Windows x64 (Intel / AMD) | [Windows installer (.exe)](https://hobbycoders.com/desktop) |
            | **Mobile** | Android 8.0+ | [Get it on Google Play](https://play.google.com/store/apps/details?id=com.hobbycoders.aishuffle) |
            | **Docker** | Linux amd64 | [Container image](https://github.com/orgs/HobbyCoders/packages/container/package/ai-shuffle-server) — `ghcr.io/hobbycoders/ai-shuffle-server:${{ env.RELEASE_VERSION }}` (private); buyers install from `docs/install` |

            Docker becomes available after its build and verification finish. Pull it
            from the container registry, not the release assets. Android installs and
            updates are delivered through Google Play, subject to track access and review.
            In-app updates are offered to installs only after this release's image
            passed verification and its signed source was published as the stable
            release.

            ### Desktop install

            On Windows, run the installer. To upgrade an existing copy, keep the same
            installation location, then use your usual AI Shuffle shortcut.
            Downloads require your account and an active license. Updates use the
            worker's license lease. The app runs its own worker and persistent
            PostgreSQL database.
            After that, use Download update and Update and restart inside AI Shuffle.
            The app fetches the newest stable release and prepares updates in the
            background. No command prompt or new installer is needed.
            Desktop installers are opt-in for manually dispatched releases, not built
            for every version. Existing desktop users should update inside the app.
            Other workers are managed inside the app under Devices.

            ### Mobile install

            Install or update AI Shuffle through [Google Play](https://play.google.com/store/apps/details?id=com.hobbycoders.aishuffle).
            Do not uninstall your existing app when updating. Play updates require
            verified signing continuity and compatible workers; no APK is attached
            by this release workflow. Releases go to **internal testing**, not public
            production. Join through the Play Console tester opt-in invitation using
            the same Google account you use in Play before opening the store link.

            ### Docker install

            The image is private. Customers pull it through their licensed registry
            path and the files in `docs/install` (compose file and Unraid template).
            For your own hosts, sign in once with `docker login ghcr.io` using a
            token that can read the package.

            For a **new install**, use Docker Engine on a Linux amd64 host, or Docker
            Desktop with Linux containers on an x64 computer. Run these commands in
            a Bash-compatible terminal:

            ```bash
            docker pull ghcr.io/hobbycoders/ai-shuffle-server:${{ env.RELEASE_VERSION }}
            docker run -d --name ai-shuffle --restart unless-stopped \
              --stop-timeout 90 --shm-size 1g \
              -p 127.0.0.1:8000:8000 \
              -v ai-shuffle-data:/data \
              -v ai-shuffle-workspace:/workspace \
              -v ai-shuffle-fluid:/home/appuser/.fluid \
              -v ai-shuffle-claude:/home/appuser/.claude \
              -v ai-shuffle-local:/home/appuser/.local \
              -v ai-shuffle-gh:/home/appuser/.config/gh \
              -v ai-shuffle-browser:/home/appuser/chrome-profile \
              ghcr.io/hobbycoders/ai-shuffle-server:${{ env.RELEASE_VERSION }}
            ```

            Open [http://localhost:8000](http://localhost:8000) on the Docker host
            after startup. Check readiness with `docker inspect --format '{{.State.Health.Status}}' ai-shuffle`
            and startup logs with `docker logs ai-shuffle`.

            The image includes a private PostgreSQL database. Named volumes retain
            the database, projects, settings and sign-ins when the container is
            replaced. Do not delete them. No external database or `.env` is needed.
            The port is bound to loopback only; do not expose it to the internet.

            **Updating an existing install:** back up first and keep your existing
            mounts and configuration; do not substitute the new-install volume
            names above. Change only the image tag to `${{ env.RELEASE_VERSION }}`
            and recreate the container with a 90-second shutdown timeout. Existing
            deployments using an external database must stay on their previous
            release until a separately tested migration is approved.

  docker:
    name: Docker image
    needs: create-release
    uses: ./.github/workflows/docker-publish.yml
    with:
      release_tag: ${{ needs.create-release.outputs.release_tag }}
      promote_latest: ${{ needs.create-release.outputs.promote_latest == 'true' }}
    secrets: inherit

  # The published image, pulled from the registry on a fresh GitHub-hosted
  # runner (nothing from the build runner's cache) and installed with the
  # buyer compose file. The stable in-app update waits for this.
  buyer-install:
    name: Buyer install on a clean runner
    needs: [create-release, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.docker.outputs.image }}
      RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.create-release.outputs.release_tag }}
      - name: Pull the published release image
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker pull "$IMAGE:${RELEASE_TAG#v}"
          docker logout ghcr.io
      # Also drives the first-session API checks; see the script's docstring.
      - name: Install from docs/install/compose
        run: python3 scripts/ci/verify_buyer_compose.py --image "$IMAGE:${RELEASE_TAG#v}" --artifacts "$RUNNER_TEMP/buyer-install"
      - name: Upload install evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: buyer-install-${{ needs.create-release.outputs.release_tag }}
          path: ${{ runner.temp }}/buyer-install
          if-no-files-found: ignore

  # The only job that signs an update customers are offered. It runs in the
  # release-signing environment (required reviewer, deployments only from
  # v* tags; see docs/ci/release-channels.md), after the release image passed
  # container verification in docker-publish.yml and the clean-runner buyer
  # install above. Prereleases are never offered as stable updates.
  source-stable:
    name: Sign the stable in-app update
    needs: [create-release, docker, buyer-install]
    if: needs.create-release.outputs.promote_latest == 'true'
    runs-on: ubuntu-latest
    environment: release-signing
    timeout-minutes: 15
    permissions:
      contents: write
    # Shares desktop-source.yml's group so D1 pointer writes never interleave.
    concurrency:
      group: desktop-source-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.create-release.outputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/hub/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: android/hub
      - name: Publish the signed stable source release
        env:
          SOURCE_CHANNEL: stable
          RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          DESKTOP_APPLICATION_SIGNING_KEY: ${{ secrets.DESKTOP_APPLICATION_SIGNING_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_HUB_DATABASE_ID: ${{ vars.ACCOUNT_HUB_DATABASE_ID }}
        run: node desktop/scripts/publish-source.mjs

  android:
    name: Android Play internal release
    needs: [create-release, docker]
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/android-play.yml
    with:
      release_tag: ${{ needs.create-release.outputs.release_tag }}
      publish_to_play: true
      workers_ready: ${{ vars.ANDROID_WORKERS_READY == 'true' }}
    secrets: inherit

  desktop:
    name: Windows installer (opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.build_desktop
    needs: create-release
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/desktop-installer.yml
    with:
      release_tag: ${{ needs.create-release.outputs.release_tag }}
    secrets: inherit
