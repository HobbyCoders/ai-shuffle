name: Create Release Packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.8.5)'
        required: true
        type: string

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  # Create the release before uploading desktop installers and update metadata.
  create-release:
    timeout-minutes: 60
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Normalise release version
        # Accept v0.8.5, V0.8.5 or 0.8.5 from the dispatch box; tags are already vX.Y.Z.
        shell: bash
        run: |
          raw="$(printf '%s' "$VERSION" | tr -d '[:space:]')"
          raw="${raw#v}"; raw="${raw#V}"
          normalised="v${raw}"
          [[ "$normalised" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "::error::Invalid release version '$VERSION' (expected vX.Y.Z)"; exit 1; }
          echo "VERSION=$normalised" >> "$GITHUB_ENV"
          echo "DESKTOP_VERSION=$raw" >> "$GITHUB_ENV"
          echo "Releasing $normalised"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: AI Shuffle ${{ env.VERSION }}
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          generate_release_notes: true
          body: |
            ## AI Shuffle ${{ env.VERSION }}

            ### Windows desktop download

            The desktop release includes the Windows x64 installer.

            | Platform | Processor | Download |
            |----------|-----------|----------|
            | **Windows** | Intel / AMD (x64) | [Windows installer (.exe)](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/AI-Shuffle-Desktop-${{ env.DESKTOP_VERSION }}-win-x64.exe) |

            The app runs an AI Shuffle worker on your computer and opens its web UI.
            It bundles Python, Node and its own persistent PostgreSQL database.
            There is no database server setup or database environment configuration.
            Other workers are managed inside the app under Devices.
            Linux Docker image: `ghcr.io/hobbycoders/ai-shuffle:latest`.

            The Windows installer becomes available when its build finishes.

            ### Android APK

            [Download Android APK](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/AI-Shuffle-Android.apk) · [Latest verified Android build](https://github.com/${{ github.repository }}/releases/tag/android-latest)

            Requires Android 8.0 or newer. Install over the existing app to keep
            your accounts and workers. The APK appears after Android verification passes
            and the compatible-worker rollout is approved (`ANDROID_WORKERS_READY=true`).

  android:
    name: Android APK
    needs: create-release
    uses: ./.github/workflows/android.yml
    with:
      release_tag: ${{ github.event.inputs.version || github.ref_name }}
      publish_download: ${{ vars.ANDROID_WORKERS_READY == 'true' }}
    secrets: inherit

  # Default releases package Windows only to bound desktop build costs.
  # Platform source/runtime support remains available for manual builds.
  desktop:
    name: Desktop (${{ matrix.target }})
    timeout-minutes: 90
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            os: blacksmith-4vcpu-windows-2025
            arch: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      # No signing certificates are configured.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalise release version
        # Accept v0.8.5, V0.8.5 or 0.8.5 from the dispatch box; tags are already vX.Y.Z.
        shell: bash
        run: |
          raw="$(printf '%s' "$VERSION" | tr -d '[:space:]')"
          raw="${raw#v}"; raw="${raw#V}"
          normalised="v${raw}"
          [[ "$normalised" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "::error::Invalid release version '$VERSION' (expected vX.Y.Z)"; exit 1; }
          echo "VERSION=$normalised" >> "$GITHUB_ENV"
          echo "Releasing $normalised"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: npm ci && npm run build

      - name: Install desktop dependencies
        run: npm ci

      - name: Stamp version from the release tag
        shell: bash
        # The package may already carry the release version; npm refuses a no-op
        # without --allow-same-version.
        run: npm version --no-git-tag-version --allow-same-version "${VERSION#v}"

      - name: Assemble the worker runtime
        shell: bash
        run: npm run build:worker -- --arch ${{ matrix.arch }} --frontend-build ../frontend/build

      - name: Build installers
        shell: bash
        run: npm run build && npx electron-builder --publish never --${{ matrix.arch }}

      - name: Upload installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.blockmap release/latest.yml)
          ls -la release/
          gh release upload "$VERSION" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
