name: Create Release Packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.8.5)'
        required: true
        type: string

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  # Create the release before uploading desktop installers and update metadata.
  create-release:
    timeout-minutes: 60
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Normalise release version
        # Accept v0.8.5, V0.8.5 or 0.8.5 from the dispatch box; tags are already vX.Y.Z.
        shell: bash
        run: |
          raw="$(printf '%s' "$VERSION" | tr -d '[:space:]')"
          raw="${raw#v}"; raw="${raw#V}"
          normalised="v${raw}"
          [[ "$normalised" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "::error::Invalid release version '$VERSION' (expected vX.Y.Z)"; exit 1; }
          echo "VERSION=$normalised" >> "$GITHUB_ENV"
          echo "DESKTOP_VERSION=$raw" >> "$GITHUB_ENV"
          echo "Releasing $normalised"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: AI Shuffle ${{ env.VERSION }}
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          generate_release_notes: true
          body: |
            ## AI Shuffle Desktop ${{ env.VERSION }}

            ### Desktop downloads

            Choose the installer for your operating system and processor.

            | Platform | Processor | Download |
            |----------|-----------|----------|
            | **Windows** | Intel / AMD (x64) | [Windows installer (.exe)](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/AI-Shuffle-Desktop-${{ env.DESKTOP_VERSION }}-win-x64.exe) |
            | **macOS** | Apple silicon (arm64) | [Mac installer (.dmg)](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/AI-Shuffle-Desktop-${{ env.DESKTOP_VERSION }}-mac-arm64.dmg) |
            | **Linux** | Intel / AMD (x64) | [AppImage](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/AI-Shuffle-Desktop-${{ env.DESKTOP_VERSION }}-linux-x86_64.AppImage) / [Debian package (.deb)](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/AI-Shuffle-Desktop-${{ env.DESKTOP_VERSION }}-linux-amd64.deb) |

            Install and open AI Shuffle, then connect to an existing AI Shuffle worker.
            The worker serves the web UI; the desktop app includes its own connection screen.

            Installers become available as each desktop build finishes.

  # Package the desktop app for each platform and upload to the release above.
  desktop:
    name: Desktop (${{ matrix.os }})
    timeout-minutes: 45
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      # No signing certificates are configured; do not let electron-builder
      # look for one and fail the macOS build.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalise release version
        # Accept v0.8.5, V0.8.5 or 0.8.5 from the dispatch box; tags are already vX.Y.Z.
        shell: bash
        run: |
          raw="$(printf '%s' "$VERSION" | tr -d '[:space:]')"
          raw="${raw#v}"; raw="${raw#V}"
          normalised="v${raw}"
          [[ "$normalised" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "::error::Invalid release version '$VERSION' (expected vX.Y.Z)"; exit 1; }
          echo "VERSION=$normalised" >> "$GITHUB_ENV"
          echo "Releasing $normalised"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Stamp version from the release tag
        shell: bash
        run: npm version --no-git-tag-version "${VERSION#v}"

      - name: Build installers
        run: npm run dist

      - name: Upload installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.dmg release/*.zip release/*.AppImage release/*.deb release/*.blockmap release/latest*.yml)
          ls -la release/
          gh release upload "$VERSION" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
