name: Create Release Packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.8.5)'
        required: true
        type: string

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  # Create the release before uploading desktop installers and update metadata.
  create-release:
    timeout-minutes: 60
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Normalise release version
        # Accept v0.8.5, V0.8.5 or 0.8.5 from the dispatch box; tags are already vX.Y.Z.
        shell: bash
        run: |
          raw="$(printf '%s' "$VERSION" | tr -d '[:space:]')"
          raw="${raw#v}"; raw="${raw#V}"
          normalised="v${raw}"
          [[ "$normalised" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "::error::Invalid release version '$VERSION' (expected vX.Y.Z)"; exit 1; }
          echo "VERSION=$normalised" >> "$GITHUB_ENV"
          echo "DESKTOP_VERSION=$raw" >> "$GITHUB_ENV"
          echo "Releasing $normalised"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: AI Shuffle ${{ env.VERSION }}
          draft: false
          prerelease: ${{ contains(env.VERSION, '-') }}
          generate_release_notes: true
          body: |
            ## AI Shuffle ${{ env.VERSION }}

            ### Downloads

            | Build | Platform | Download / install |
            |-------|----------|--------------------|
            | **Desktop** | Windows x64 (Intel / AMD) | [Windows installer (.exe)](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/AI-Shuffle-Desktop-${{ env.DESKTOP_VERSION }}-win-x64.exe) |
            | **Mobile** | Android 8.0+ | [Signed Android APK](https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/AI-Shuffle-Android.apk) |
            | **Docker** | Linux amd64 | [Container image](https://github.com/${{ github.repository }}/pkgs/container/ai-shuffle) — `ghcr.io/hobbycoders/ai-shuffle:${{ env.DESKTOP_VERSION }}`; see install instructions below |

            Downloads become available as their builds finish. Docker is pulled from
            the container registry, not downloaded from the release assets.

            ### Desktop install

            Run the Windows installer. The app runs an AI Shuffle worker on your
            computer and opens its web UI. It bundles Python, Node and its own
            persistent PostgreSQL database; no database configuration is needed.
            Other workers are managed inside the app under Devices.

            ### Mobile install

            Install the Android APK over the existing app to keep your accounts and
            workers. The APK appears after Android verification passes and the
            compatible-worker rollout is approved (`ANDROID_WORKERS_READY=true`).

            ### Docker install

            For a **new install**, use Docker Engine on a Linux amd64 host, or Docker
            Desktop with Linux containers on an x64 computer. Run these commands in
            a Bash-compatible terminal:

            ```bash
            docker pull ghcr.io/hobbycoders/ai-shuffle:${{ env.DESKTOP_VERSION }}
            docker run -d --name ai-shuffle --restart unless-stopped \
              --stop-timeout 90 --shm-size 1g \
              -p 127.0.0.1:8000:8000 \
              -v ai-shuffle-data:/data \
              -v ai-shuffle-workspace:/workspace \
              -v ai-shuffle-fluid:/home/appuser/.fluid \
              -v ai-shuffle-claude:/home/appuser/.claude \
              -v ai-shuffle-gh:/home/appuser/.config/gh \
              -v ai-shuffle-browser:/home/appuser/chrome-profile \
              ghcr.io/hobbycoders/ai-shuffle:${{ env.DESKTOP_VERSION }}
            ```

            Open [http://localhost:8000](http://localhost:8000) on the Docker host
            after startup. Check readiness with `docker inspect --format '{{.State.Health.Status}}' ai-shuffle`
            and startup logs with `docker logs ai-shuffle`.

            The image includes a private PostgreSQL database. Named volumes retain
            the database, projects, settings and sign-ins when the container is
            replaced. Do not delete them. No external database or `.env` is needed.
            The port is bound to loopback only; do not expose it to the internet.

            **Updating an existing install:** back up first and keep your existing
            mounts and configuration; do not substitute the new-install volume
            names above. Change only the image tag to `${{ env.DESKTOP_VERSION }}`
            and recreate the container with a 90-second shutdown timeout. Existing
            deployments using an external database must stay on their previous
            release until a separately tested migration is approved.

  android:
    name: Android APK
    needs: create-release
    uses: ./.github/workflows/android.yml
    with:
      release_tag: ${{ github.event.inputs.version || github.ref_name }}
      publish_download: ${{ vars.ANDROID_WORKERS_READY == 'true' }}
    secrets: inherit

  # Default releases package Windows only to bound desktop build costs.
  # Platform source/runtime support remains available for manual builds.
  desktop:
    name: Desktop (${{ matrix.target }})
    timeout-minutes: 90
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win-x64
            os: blacksmith-4vcpu-windows-2025
            arch: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      # No signing certificates are configured.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalise release version
        # Accept v0.8.5, V0.8.5 or 0.8.5 from the dispatch box; tags are already vX.Y.Z.
        shell: bash
        run: |
          raw="$(printf '%s' "$VERSION" | tr -d '[:space:]')"
          raw="${raw#v}"; raw="${raw#V}"
          normalised="v${raw}"
          [[ "$normalised" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "::error::Invalid release version '$VERSION' (expected vX.Y.Z)"; exit 1; }
          echo "VERSION=$normalised" >> "$GITHUB_ENV"
          echo "Releasing $normalised"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: npm ci && npm run build

      - name: Install desktop dependencies
        run: npm ci

      - name: Stamp version from the release tag
        shell: bash
        # The package may already carry the release version; npm refuses a no-op
        # without --allow-same-version.
        run: npm version --no-git-tag-version --allow-same-version "${VERSION#v}"

      - name: Assemble the worker runtime
        shell: bash
        run: npm run build:worker -- --arch ${{ matrix.arch }} --frontend-build ../frontend/build

      - name: Build installers
        shell: bash
        run: npm run build && npx electron-builder --publish never --${{ matrix.arch }}

      - name: Upload installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.blockmap release/latest.yml)
          ls -la release/
          gh release upload "$VERSION" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
