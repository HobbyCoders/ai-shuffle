name: Build and Push Docker Image

# Publish images for explicit dispatches and releases rather than rebuilding on every merge.
on:
  # Manual trigger (with the no-cache escape hatch).
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Rebuild an existing vX.Y.Z tag using the verification tools from this workflow ref'
        required: false
        type: string
      promote_latest:
        description: 'Also move latest, X.Y and X to this release (only for the newest final release)'
        required: false
        type: boolean
        default: false
      no_cache:
        description: 'Build without Docker cache (forces full rebuild)'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_tag:
        description: 'Immutable release tag to build and verify'
        required: true
        type: string
      promote_latest:
        description: 'Move latest, X.Y and X to this release after verification'
        required: false
        type: boolean
        default: false
      no_cache:
        required: false
        type: boolean
        default: false
    outputs:
      image:
        description: 'Private image repository the release was pushed to'
        value: ${{ jobs.build.outputs.image }}

# Serialize a release tag without cancelling a publish; manual branch rebuilds
# can still supersede each other. Different release versions do not conflict.
concurrency:
  group: docker-build-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ inputs.release_tag == '' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ai-shuffle-server

jobs:
  build:
    if: >-
      github.repository == 'HobbyCoders/ai-shuffle' && github.actor_id == '76577322' && github.triggering_actor == github.actor && ((github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    timeout-minutes: 45
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate requested release tag
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]'

      # Keep release source immutable while allowing repaired verification tools.
      - name: Checkout release source
        if: inputs.release_tag != ''
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          path: release-source
          fetch-depth: 0

      - name: Identify image source
        id: source
        working-directory: ${{ inputs.release_tag && 'release-source' || '.' }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "sequence=$(git rev-list --first-parent --count HEAD)" >> "$GITHUB_OUTPUT"
          # The release tag is the version source: "0.8.18" on a tag,
          # "0.8.18-dev.N+g<sha>" on main. Empty (tags not fetched) falls back
          # to the checked-in app.__version__.
          echo "app_version=$(python3 "$GITHUB_WORKSPACE/android/ci/resolve-version-name.py" --release-tag "$RELEASE_TAG" 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          # Shared with build-branch.yml — both build the same root Dockerfile,
          # so main and lab-branch builds reuse each other's layers.
          cache-key: Dockerfile

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker requires lowercase image names but github.repository preserves casing
      - name: Lowercase image name
        id: image
        run: |
          echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"
          echo "image=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          # A release always gets its exact version. latest, X.Y and X move
          # only when the caller promotes a final release (release.yml does);
          # rebuilding an old tag never drags them backwards. Prereleases
          # never get X.Y or X (metadata-action skips them).
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' && inputs.promote_latest }}
            type=semver,pattern={{major}},value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' && inputs.promote_latest }}
            type=raw,value=latest,enable=${{ inputs.release_tag != '' && inputs.promote_latest && !contains(inputs.release_tag, '-') }}
            # Manual main builds are the edge channel.
            type=raw,value=edge,enable=${{ inputs.release_tag == '' && github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ inputs.release_tag == '' }}
            # Tag with git short SHA (simple prefix, works for all events)
            type=raw,value=sha-${{ steps.source.outputs.short_sha }}

      - name: Build candidate image
        uses: useblacksmith/build-push-action@v2
        with:
          context: ${{ inputs.release_tag && 'release-source' || '.' }}
          file: ${{ inputs.release_tag && 'release-source/Dockerfile' || './Dockerfile' }}
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ai-shuffle:postgres-candidate
          load: true
          push: false
          # inputs.no_cache is '' on tag pushes; coerce to a strict boolean
          # (the action rejects anything but YAML true/false literals).
          no-cache: ${{ inputs.no_cache == true }}
          build-args: |
            ${{ inputs.no_cache && format('CACHEBUST={0}', github.run_id) || '' }}
            GIT_SHA=${{ steps.source.outputs.sha }}
            APPLICATION_SEQUENCE=${{ steps.source.outputs.sequence }}
            APP_VERSION=${{ steps.source.outputs.app_version }}
          # Layer caching is automatic via Blacksmith's sticky disk:
          # useblacksmith/setup-docker-builder persists /var/lib/buildkit across
          # runs, so no cache-from/cache-to registry round-trip is needed.

      # The container verification (boot the image, PostgreSQL bootstrap, UI
      # through a browser) roughly triples the job. Release tags get it;
      # manual `latest` rebuilds, which happen several times a day, do not —
      # run `gh workflow run container-postgres.yml` for the same check on
      # any branch.
      - name: Verify actual container lifecycle and UI
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        run: python scripts/verify_container_postgres.py --image ai-shuffle:postgres-candidate --artifacts "$RUNNER_TEMP/container-postgres"

      - name: Upload container evidence
        if: always() && (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '')
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: container-postgres-${{ github.sha }}
          path: ${{ runner.temp }}/container-postgres
          if-no-files-found: ignore

      - name: Push the candidate without rebuilding
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag ai-shuffle:postgres-candidate "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
