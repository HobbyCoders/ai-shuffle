name: CI fluid

# Unit suite for the fluid harness (fluid/). Manual only: pull requests run no CI;
# scripts/local_ci.py runs this suite before a push.
#
# fluid is developed on Windows; this Linux run is the one that catches
# POSIX-only failures (path separators, os.fork, unix sockets). Before the
# monorepo merge it ran inside the vendor-sync workflow, once a day plus on
# every fluid push. Dispatch it when a fluid change needs a POSIX check and no Linux worker
# is available.
#
# It stays a separate workflow because fluid's dev extras need mcp>=2 while
# the app pins mcp 1.x; the two suites cannot share one environment.
#
# Standard GitHub-hosted runners are free in public repositories; keep dispatches deliberate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-fluid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: fluid unit tests
    timeout-minutes: 20
    # A single-process pytest run needs no larger runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # Matches production (the Docker image) and fluid's requires-python.
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: fluid/pyproject.toml

      - name: Install fluid with its dev extras
        run: pip install './fluid[dev]'

      - name: Install ripgrep
        # Glob and Grep use rg when it is on PATH (as in the Docker image);
        # the engine-parity tests skip without it.
        run: command -v rg || (sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep)

      - name: Run the unit suite
        # fluid/pyproject.toml carries the pytest config (asyncio_mode=auto);
        # pytest picks it up as rootdir because the test path sits under it.
        run: python -m pytest fluid/tests/unit -q -p no:cacheprovider
