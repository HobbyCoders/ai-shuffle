name: CI fluid

# Full fluid unit suite on every PR, including drafts. Its dev dependencies
# stay isolated from the backend environment.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-fluid-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: fluid unit tests
    timeout-minutes: 20
    # A single-process pytest run needs no larger runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # Matches production (the Docker image) and fluid's requires-python.
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: fluid/pyproject.toml

      - name: Install fluid with its dev extras
        run: pip install './fluid[dev]'

      - name: Install ripgrep
        # Glob and Grep use rg when it is on PATH (as in the Docker image);
        # the engine-parity tests skip without it.
        # Only Ubuntu provides ripgrep. Unrelated third-party runner feeds can
        # return 403 and must not block this signed Ubuntu package install.
        timeout-minutes: 13
        run: |
          if command -v rg; then exit 0; fi
          python3 scripts/ci/bounded_apt.py sh -c '
            apt-get update -qq \
              -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources \
              -o Dir::Etc::sourceparts=- &&
            apt-get install -y -qq ripgrep'

      - name: Run the unit suite
        # fluid/pyproject.toml carries the pytest config (asyncio_mode=auto);
        # pytest picks it up as rootdir because the test path sits under it.
        run: python -m pytest fluid/tests/unit -q -p no:cacheprovider

  delegated-tool-output:
    name: delegated tool-output contract (${{ matrix.cli_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Verified stock function-hook builds, not a production version pin.
        cli_version: ["2.1.287", "2.1.308", "2.1.314"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Fluid test dependencies
        run: pip install './fluid[dev]'
      - name: Fetch the isolated stock CLI fixture
        run: >-
          python scripts/ci/fetch_claude_fixture.py
          --version '${{ matrix.cli_version }}'
          --output '${{ runner.temp }}/claude-fixture'
      - name: Inspect delegated model input with the scripted local provider
        env:
          FLUID_TEST_CLAUDE_BIN: ${{ runner.temp }}/claude-fixture
        run: python -m pytest fluid/tests/unit/test_delegated_tool_markers.py -q -p no:cacheprovider
