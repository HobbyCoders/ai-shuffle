name: CI fluid

# Full fluid unit suite on every PR, including drafts. Its dev dependencies
# stay isolated from the backend environment.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-fluid-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: fluid unit tests
    timeout-minutes: 20
    # A single-process pytest run needs no larger runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # Matches production (the Docker image) and fluid's requires-python.
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: fluid/pyproject.toml

      - name: Install fluid with its dev extras
        run: pip install './fluid[dev]'

      - name: Install ripgrep
        # Glob and Grep use rg when it is on PATH (as in the Docker image);
        # the engine-parity tests skip without it.
        # Only Ubuntu provides ripgrep. Unrelated third-party runner feeds can
        # return 403 and must not block this signed Ubuntu package install.
        timeout-minutes: 4
        run: |
          if command -v rg; then exit 0; fi
          for attempt in 1 2; do
            if timeout --kill-after=10s 90s sh -c '
              sudo apt-get update -qq \
                -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources \
                -o Dir::Etc::sourceparts=- &&
              sudo apt-get install -y -qq ripgrep'; then
              exit 0
            fi
            echo "::warning::ripgrep installation attempt $attempt failed or exceeded 90s"
          done
          echo "::error::ripgrep installation failed after two bounded attempts"
          exit 1

      - name: Run the unit suite
        # fluid/pyproject.toml carries the pytest config (asyncio_mode=auto);
        # pytest picks it up as rootdir because the test path sits under it.
        run: python -m pytest fluid/tests/unit -q -p no:cacheprovider
