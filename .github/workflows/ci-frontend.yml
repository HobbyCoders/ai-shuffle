name: CI JavaScript

# One runner checks only the JavaScript packages changed by a PR. Scheduled
# canaries check all three packages; documentation-only PRs do not start it.
#
# Blacksmith runners are PAID per minute; every trigger below is deliberate.
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'tools/**'
      - 'browser-mcp/**'
      - 'app/contract/schema/**'
      - '.github/workflows/ci-frontend.yml'
  # Main-branch canary. Merges to main no longer run CI directly — the PR
  # already ran it, and re-running on the merge commit doubled the bill for a
  # result that is green ~always. What that loses is semantic conflicts between
  # two branches that were each green alone; the canary catches those within
  # ~6h instead of at the next PR. The gate job below skips the paid runner
  # when main has not moved since the last green canary.
  schedule:
    - cron: '7 */6 * * *'
  # Manual canary (`gh workflow run ci-frontend.yml`).
  workflow_dispatch:

# Cancel superseded runs (force-pushes / rapid successive commits) instead of
# letting stale runs finish and fail/email after a newer commit already ran.
concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary-gate:
    name: Canary gate
    # Use a standard GitHub-hosted runner for the revision lookup, so unchanged revisions do not allocate a paid
    # canary job.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci-frontend.yml/runs?event=schedule&status=success&branch=main&per_page=1" --jq '.workflow_runs[0].head_sha // empty')"
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "main is still at $GITHUB_SHA, which the last canary already verified; skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "main moved from ${last:-<none>} to $GITHUB_SHA; running the canary."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: JavaScript package checks
    needs: canary-gate
    # PRs and manual runs always run; the schedule runs only when main moved.
    # !cancelled() keeps this job alive when the gate is skipped on a PR.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.canary-gate.outputs.changed == 'true') }}
    # Choose a frontend runner suited to the suite parallelism and keep a bounded job timeout.
    timeout-minutes: 20
    # Choose a frontend runner suited to the suite parallelism and keep a bounded job timeout.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: frontend
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'app/contract/schema/**'
              - '.github/workflows/ci-frontend.yml'
            tools:
              - 'tools/**'
              - 'tests/core/network/vectors.json'
              - '.github/workflows/ci-frontend.yml'
            browser:
              - 'browser-mcp/**'
              - '.github/workflows/ci-frontend.yml'


      # Upstream actions/setup-* on purpose: Blacksmith archived its
      # useblacksmith/setup-* forks and now routes the official cache actions
      # through its colocated cache transparently.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            tools/package-lock.json
            browser-mcp/package-lock.json

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.frontend == 'true'
        run: npm ci

      - name: Build
        if: github.event_name != 'pull_request' || steps.changes.outputs.frontend == 'true'
        run: npm run build

      - name: Svelte type-check
        if: github.event_name != 'pull_request' || steps.changes.outputs.frontend == 'true'
        run: npx svelte-check --tsconfig ./tsconfig.json

      - name: Frontend tests and contract consistency
        if: github.event_name != 'pull_request' || steps.changes.outputs.frontend == 'true'
        run: npm test && npm run contract:check && npm audit --audit-level=high

      - name: Build AI tools from source
        if: github.event_name != 'pull_request' || steps.changes.outputs.tools == 'true'
        working-directory: tools
        run: npm ci --ignore-scripts && npm run build && npm audit --audit-level=high

      # The worker network's crypto vectors must verify with WebCrypto, the API
      # the account hub and the mobile app use (tests/core/network/vectors.json
      # is also checked by the Python suite).
      - name: Verify worker-network crypto vectors with WebCrypto
        if: github.event_name != 'pull_request' || steps.changes.outputs.tools == 'true' || steps.changes.outputs.frontend == 'true'
        working-directory: .
        run: node tools/scripts/verify-network-vectors.mjs

      - name: Browser MCP build and tests
        if: github.event_name != 'pull_request' || steps.changes.outputs.browser == 'true'
        working-directory: browser-mcp
        run: npm ci --ignore-scripts && npm run build && npm test && npm audit --audit-level=high
