name: CI JavaScript
run-name: "${{ github.workflow }} (${{ inputs.runner_cpus || '4' }} vCPU)"

# One runner checks only the JavaScript packages changed by a PR. Manual runs
# check all three packages. The mobile UI (mobile/) compiles
# frontend/src/lib, so its own job runs for either package. A PR that changes only docs/content gets
# the two cheap docs checks (the two docs copies match, and the website's
# rendered docs.json is current) and nothing else.
#
# Blacksmith runners are PAID per minute; every trigger below is deliberate.
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'mobile/**'
      - 'tools/**'
      - 'browser-mcp/**'
      - 'app/contract/schema/**'
      # Docs: the in-app copy must match, and the website renders the buyer pages.
      - 'docs/content/**'
      - 'android/site/scripts/render-docs.mjs'
      - 'android/site/src/content/docs.json'
      - '.github/workflows/ci-frontend.yml'
  # Manual run on any ref (`gh workflow run ci-frontend.yml`).
  workflow_dispatch:
    inputs:
      runner_cpus:
        description: 'Runner vCPUs (compare the same commit before changing defaults)'
        type: choice
        options: ['4', '2']
        default: '4'

# Cancel superseded runs (force-pushes / rapid successive commits) instead of
# letting stale runs finish and fail/email after a newer commit already ran.
concurrency:
  group: ci-frontend-${{ github.ref }}-${{ inputs.runner_cpus || '4' }}
  cancel-in-progress: true

jobs:
  frontend:
    name: JavaScript package checks
    # Choose a frontend runner suited to the suite parallelism and keep a bounded job timeout.
    timeout-minutes: 20
    # Choose a frontend runner suited to the suite parallelism and keep a bounded job timeout.
    runs-on: ${{ inputs.runner_cpus == '2' && 'blacksmith-2vcpu-ubuntu-2404' || 'blacksmith-4vcpu-ubuntu-2404' }}
    defaults:
      run:
        working-directory: frontend
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'app/contract/schema/**'
              - '.github/workflows/ci-frontend.yml'
            tools:
              - 'tools/**'
              - 'tests/core/network/vectors.json'
              - '.github/workflows/ci-frontend.yml'
            browser:
              - 'browser-mcp/**'
              - '.github/workflows/ci-frontend.yml'
            docs:
              - 'docs/content/**'
              - 'frontend/src/lib/docs/content/**'
              - 'android/site/scripts/render-docs.mjs'
              - 'android/site/src/content/docs.json'
              - 'android/site/package.json'
              - 'android/site/package-lock.json'
              - '.github/workflows/ci-frontend.yml'


      # Upstream actions/setup-* on purpose: Blacksmith archived its
      # useblacksmith/setup-* forks and now routes the official cache actions
      # through its colocated cache transparently.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            tools/package-lock.json
            browser-mcp/package-lock.json
            android/site/package-lock.json

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.frontend == 'true'
        run: npm ci

      - name: Build
        if: github.event_name != 'pull_request' || steps.changes.outputs.frontend == 'true'
        run: npm run build

      - name: Svelte type-check
        if: github.event_name != 'pull_request' || steps.changes.outputs.frontend == 'true'
        run: npx svelte-check --tsconfig ./tsconfig.json

      - name: Frontend tests and contract consistency
        if: github.event_name != 'pull_request' || steps.changes.outputs.frontend == 'true'
        run: npm test && npm run contract:check && npm audit --audit-level=high

      - name: Build AI tools from source
        if: github.event_name != 'pull_request' || steps.changes.outputs.tools == 'true'
        working-directory: tools
        run: npm ci --ignore-scripts && npm run build && npm audit --audit-level=high

      # The worker network's crypto vectors must verify with WebCrypto, the API
      # the account hub and the mobile app use (tests/core/network/vectors.json
      # is also checked by the Python suite).
      - name: Verify worker-network crypto vectors with WebCrypto
        if: github.event_name != 'pull_request' || steps.changes.outputs.tools == 'true' || steps.changes.outputs.frontend == 'true'
        working-directory: .
        run: node tools/scripts/verify-network-vectors.mjs

      - name: Browser MCP build and tests
        if: github.event_name != 'pull_request' || steps.changes.outputs.browser == 'true'
        working-directory: browser-mcp
        run: npm ci --ignore-scripts && npm run build && npm test && npm audit --audit-level=high

      # The in-app Docs panel bundles its own copy of docs/content; the backend
      # serves docs/content itself. tests/test_buyer_docs.py checks the same
      # thing, but backend CI does not start for a docs-only PR.
      - name: Docs copies match
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs == 'true'
        working-directory: .
        run: diff -r docs/content frontend/src/lib/docs/content

      # hobbycoders.com serves /docs and /changelog from the committed
      # android/site/src/content/docs.json. A docs change without a fresh
      # render (npm run render-docs in android/site) fails here, as does an em
      # dash the renderer cannot turn into site style.
      - name: Website docs render check
        if: github.event_name != 'pull_request' || steps.changes.outputs.docs == 'true'
        working-directory: android/site
        run: npm ci && node scripts/render-docs.mjs --check

  # mobile/ is the UI bundled into the Android app. It compiles the same
  # frontend/src/lib with its own shell, so a frontend change can break its
  # type check, tests or build; android.yml does not start for frontend/**.
  mobile:
    name: Mobile UI checks
    timeout-minutes: 20
    runs-on: ${{ inputs.runner_cpus == '2' && 'blacksmith-2vcpu-ubuntu-2404' || 'blacksmith-4vcpu-ubuntu-2404' }}
    defaults:
      run:
        working-directory: mobile
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            mobile:
              - 'mobile/**'
              - 'frontend/**'
              - '.github/workflows/ci-frontend.yml'

      - name: Set up Node 22
        if: github.event_name != 'pull_request' || steps.changes.outputs.mobile == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # mobile/ has no lockfile of its own: it links ../frontend/node_modules.
      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.mobile == 'true'
        run: (cd ../frontend && npm ci) && npm run deps

      - name: Svelte type-check
        if: github.event_name != 'pull_request' || steps.changes.outputs.mobile == 'true'
        run: npm run check

      - name: Mobile tests
        if: github.event_name != 'pull_request' || steps.changes.outputs.mobile == 'true'
        run: npx vitest run

      # postbuild (scripts/check-build.mjs) fails if a build-time constant such
      # as __APP_VERSION__ was left unreplaced in the bundle.
      - name: Build
        if: github.event_name != 'pull_request' || steps.changes.outputs.mobile == 'true'
        run: npm run build
