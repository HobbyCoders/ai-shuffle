name: CI JavaScript

# Full JavaScript package checks on every PR, including drafts.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs (force-pushes / rapid successive commits) instead of
# letting stale runs finish and fail/email after a newer commit already ran.
concurrency:
  group: ci-frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: JavaScript package checks
    # Cap well below the 6-hour default.
    timeout-minutes: 20
    # Standard public Linux runner; no paid runner-size selection.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Official setup actions use the GitHub Actions dependency cache.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            tools/package-lock.json
            browser-mcp/package-lock.json

      # mobile/ has no lockfile of its own: it links ../frontend/node_modules.
      - name: Install dependencies
        run: npm ci

      # postbuild also builds mobile/ into build/mobile
      # (scripts/build-mobile-ui.mjs), which runs mobile's own postbuild check.
      - name: Build
        run: npm run build

      - name: Svelte type-check
        run: npx svelte-check --tsconfig ./tsconfig.json

      - name: Frontend tests and contract consistency
        run: |
          npm test
          npm run contract:check
          npx -y npm@11 audit --audit-level=high

      # mobile/ is the phone UI every worker serves at /mobile/; the Android
      # and iOS apps load it from the paired worker (the APK keeps one copy
      # only for its offline demo). It compiles the same frontend/src/lib with
      # its own shell, so a frontend change can break its type check, tests or
      # build `npm run deps` links mobile/node_modules to the
      # frontend/node_modules installed above; it is a no-op when the frontend
      # build already linked it.
      - name: Link mobile dependencies
        working-directory: mobile
        run: npm run deps

      - name: Mobile Svelte type-check
        working-directory: mobile
        run: npm run check

      - name: Mobile tests
        working-directory: mobile
        run: npm test

      - name: Build AI tools from source
        working-directory: tools
        run: npm ci --ignore-scripts && npm test && npx -y npm@11 audit --audit-level=high

      # The worker network's crypto vectors must verify with WebCrypto, the API
      # the account hub and the mobile app use (tests/core/network/vectors.json
      # is also checked by the Python suite).
      - name: Verify worker-network crypto vectors with WebCrypto
        working-directory: .
        run: node tools/scripts/verify-network-vectors.mjs

      - name: Install Browser MCP dependencies
        timeout-minutes: 2
        working-directory: browser-mcp
        run: npm ci --ignore-scripts

      - name: Cache managed Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser-mcp/package-lock.json') }}

      - name: Prepare sandboxed Chromium
        timeout-minutes: 4
        working-directory: browser-mcp
        run: |
          # Ubuntu 24.04's AppArmor policy otherwise denies Chromium's user
          # namespace sandbox. This changes only the disposable hosted runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Keep OS dependency setup even on a browser cache hit. Bound apt and
          # browser downloads together and retry once for transient mirrors.
          for attempt in 1 2; do
            if timeout --kill-after=10s 90s npx --no-install playwright-core install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Chromium dependency install attempt $attempt failed or exceeded 90s"
          done
          echo "::error::Chromium dependency installation failed after two bounded attempts"
          exit 1

      - name: Browser MCP build and tests
        timeout-minutes: 6
        working-directory: browser-mcp
        run: |
          npm run build
          export CHROMIUM_PATH="$(node -p 'require("playwright-core").chromium.executablePath()')"
          if timeout --kill-after=10s 240s npm test; then
            echo "Browser MCP tests completed within the 240s deadline"
          else
            result=$?
            echo "::error::Browser MCP tests failed (exit $result; deadline 240s)"
            exit "$result"
          fi
          npx -y npm@11 audit --audit-level=high

      # The in-app Docs panel bundles its own copy of docs/content; the backend
      # serves docs/content itself. tests/test_buyer_docs.py checks the same
      # thing.
      - name: Docs copies match
        working-directory: .
        run: diff -r docs/content frontend/src/lib/docs/content
