name: CI JavaScript

# Full JavaScript package checks on every PR, including drafts.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs (force-pushes / rapid successive commits) instead of
# letting stale runs finish and fail/email after a newer commit already ran.
concurrency:
  group: ci-frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend tests (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx svelte-kit sync
      - name: Prove frontend shard file union
        run: |
          node --input-type=module <<'JS'
          import { createVitest } from 'vitest/node';
          import { appendFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          // `vitest list --filesOnly` ignores --shard. Use the configured
          // sequencer that `vitest run --shard` actually calls, not a replica.
          const ctx = await createVitest('test', { run: true });
          let all, shards;
          try {
            const specs = await ctx.globTestSpecifications();
            all = specs.map(s => s.moduleId);
            shards = [];
            for (const index of [1, 2, 3, 4]) {
              ctx.config.shard = { index, count: 4 };
              const sequencer = new ctx.config.sequence.sequencer(ctx);
              shards.push((await sequencer.shard([...specs])).map(s => s.moduleId));
            }
          } finally {
            await ctx.close();
          }
          const union = shards.flat();
          assert.ok(all.length > 0 && shards.every(s => s.length > 0));
          assert.equal(new Set(union).size, union.length, 'duplicate shard file');
          assert.deepEqual([...union].sort(), [...all].sort(), 'missing or extra shard file');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Frontend file union: ${shards.map(s => s.length).join(' + ')} = ${all.length}; exact, disjoint unsharded inventory.\n`);
          JS
      - run: npx vitest run --shard=${{ matrix.shard }}/4

  contracts:
    name: JavaScript contracts, docs and frontend audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx svelte-kit sync
      - name: Frontend tests and contract consistency
        run: |
          npm run contract:check
          npx -y npm@11 audit --audit-level=high
      - name: Docs copies match
        working-directory: .
        run: diff -r docs/content frontend/src/lib/docs/content

  build:
    name: Frontend and mobile production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx svelte-kit sync
      # Frontend postbuild links dependencies and builds mobile, including its postbuild.
      - run: npm run build

  typechecks:
    name: Frontend and mobile typechecks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx svelte-kit sync
      - run: npx svelte-check --tsconfig ./tsconfig.json
      - run: npm run deps
        working-directory: mobile
      - run: npm run check
        working-directory: mobile

  mobile:
    name: Mobile tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx svelte-kit sync
      - run: npm run deps && npx svelte-kit sync && npm test
        working-directory: mobile

  tools:
    name: Tools tests and WebCrypto vectors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Build AI tools from source
        working-directory: tools
        run: npm ci --ignore-scripts && npm test && npx -y npm@11 audit --audit-level=high
      - name: Verify worker-network crypto vectors with WebCrypto
        run: node tools/scripts/verify-network-vectors.mjs

  browser-mcp:
    name: Browser MCP build and tests
    # Run independently: frontend checks took 14m on a standard runner, while
    # the real browser suite needs about 5m. Neither should consume the other's
    # budget or hide a hang behind the overall JavaScript deadline.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: browser-mcp/package-lock.json

      - name: Install Browser MCP dependencies
        timeout-minutes: 2
        working-directory: browser-mcp
        run: npm ci --ignore-scripts

      - name: Cache managed Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser-mcp/package-lock.json') }}

      - name: Prepare sandboxed Chromium
        timeout-minutes: 4
        working-directory: browser-mcp
        run: |
          # Ubuntu 24.04's AppArmor policy otherwise denies Chromium's user
          # namespace sandbox. This changes only the disposable hosted runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Use the primary signed Ubuntu archive, not the hosted mirror's
          # slow Azure fallback. Keep suites, components and Signed-By intact.
          sudo sed -i -E 's|^URIs:.*|URIs: https://archive.ubuntu.com/ubuntu/|' /etc/apt/sources.list.d/ubuntu.sources
          # Run the OS timeout as root too: a user-owned timeout cannot reap
          # sudo's apt children, leaving a lock behind for the next command.
          sudo env "PATH=$PATH" timeout --kill-after=10s 90s npx --no-install playwright-core install-deps chromium
          # Browser downloads stay owned by the runner and use its cache.
          timeout --kill-after=10s 90s npx --no-install playwright-core install chromium

      - name: Browser MCP build and tests
        timeout-minutes: 8
        working-directory: browser-mcp
        run: |
          npm run build
          export CHROMIUM_PATH="$(node -p 'require("playwright-core").chromium.executablePath()')"
          if timeout --kill-after=10s 420s npm test; then
            echo "Browser MCP tests completed within the 420s deadline"
          else
            result=$?
            echo "::error::Browser MCP tests failed (exit $result; deadline 420s)"
            exit "$result"
          fi
          npx -y npm@11 audit --audit-level=high

  javascript:
    name: JavaScript package checks
    if: always()
    needs: [frontend, contracts, build, typechecks, mobile, tools, browser-mcp]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every branch to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const results = JSON.parse(process.env.RESULTS);
          const expected = ["frontend", "contracts", "build", "typechecks", "mobile", "tools", "browser-mcp"];
          assert.deepEqual(Object.keys(results).sort(), [...expected].sort(), 'missing branch');
          for (const name of expected) assert.equal(results[name].result, 'success', name);
          JS
