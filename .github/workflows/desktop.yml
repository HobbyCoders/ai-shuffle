name: Desktop CI

# Desktop typechecks and unit tests on every PR, including drafts.
# Packaging and runtime assembly remain manual; releases live in release.yml.
on:
  pull_request:
  workflow_call:
    inputs:
      main_suite:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      upload_preview:
        description: 'Keep the verified preview installer for download (one day)'
        type: boolean
        default: false
      build_linux_runtime:
        description: 'Explicitly assemble the Linux desktop runtime (additional build cost)'
        type: boolean
        required: false
        default: false
      verify_stable_installer:
        description: 'Instead of the shell and preview packages: build the stable installer (stub worker, never published) and check its update-channel choice in silent installs'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck and unit tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    name: Package Windows shell
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && inputs.verify_stable_installer != true && inputs.main_suite != true
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Write a stub worker manifest
        run: npm run build:worker:stub
      - name: Build unpacked app
        run: npm run pack

  runtime:
    name: Assemble worker runtime (linux-x64)
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' && inputs.build_linux_runtime == true
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - run: npm ci
      - name: Assemble the runtime
        run: npm run build:worker -- --frontend-build ../frontend/build
      - name: Runtime is complete and imports the server
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("worker/manifest.json", "utf8"));
            if (m.stub) throw new Error("stub manifest");
            if (!m.cloudflared?.path || !m.cloudflared?.sha256) throw new Error("cloudflared manifest missing");
            const client = "worker/" + m.cloudflared.path;
            const digest = require("crypto").createHash("sha256").update(fs.readFileSync(client)).digest("hex");
            if (digest !== m.cloudflared.sha256) throw new Error("cloudflared checksum mismatch");
            for (const f of ["worker/python/bin/python3", "worker/node/bin/node", "worker/server/app/main.py", "worker/server/app/static/index.html", "worker/server/tools/dist/worker.js", "worker/server/browser-mcp/dist/index.js"]) {
              if (!fs.existsSync(f)) throw new Error("missing " + f);
            }
            console.log("runtime ok", m.python.version, m.node.version);
          '
          cd worker/server && ../python/bin/python3 -c "import app.core.config; print('server imports ok')"
          ../node/bin/node --version
          ./downloads/cloudflared/$(../python/bin/python3 -c "from app.core.cloudflared import VERSION; print(VERSION)")/cloudflared --version


  windows-preview:
    name: Windows preview installer and fresh database
    if: github.event_name == 'workflow_dispatch' && inputs.verify_stable_installer != true && inputs.main_suite != true
    needs: check
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PREVIEW_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json
      - name: Build real frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install desktop build tools
        run: npm ci
      - name: Assemble full Windows worker and PostgreSQL
        run: npm run build:worker -- --frontend-build ../frontend/build
      - name: Record exact candidate in packaged resources
        run: |
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($head -ne $env:PREVIEW_SOURCE_COMMIT) { throw 'Unexpected source revision' }
          @{
            sourceCommit = $head
            channel = 'preview'
            platform = 'win32-x64'
            workflowRun = $env:GITHUB_RUN_ID
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM worker/preview-build.json
      - name: Build isolated NSIS installer (never publish)
        run: |
          $base = (Get-Content package.json | ConvertFrom-Json).version
          $version = "$base-preview.$env:GITHUB_RUN_NUMBER"
          npm run dist:preview:win -- "--config.extraMetadata.version=$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and exercise actual Windows app
        run: |
          $installers = @(Get-ChildItem release-preview -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows preview installer' }
          $evidence = Join-Path $env:RUNNER_TEMP 'windows-preview-evidence'
          node scripts/verify-windows-preview.mjs $installers[0].FullName $evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $delivery = Join-Path $env:RUNNER_TEMP 'windows-preview-delivery'
          New-Item -ItemType Directory -Path $delivery -Force | Out-Null
          Copy-Item $installers[0].FullName $delivery
          Copy-Item worker/preview-build.json $delivery
          Copy-Item (Join-Path $evidence 'acceptance.json') $delivery
          $hash = (Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installers[0].Name)" | Set-Content -Encoding ascii (Join-Path $delivery 'SHA256SUMS')
          $signature = Get-AuthenticodeSignature $installers[0].FullName
          @{ status = [string]$signature.Status } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM (Join-Path $delivery 'signature.json')
      - name: Upload verified installer
        if: github.event_name == 'workflow_dispatch' && inputs.upload_preview
        uses: actions/upload-artifact@v4
        with:
          name: windows-preview-installer
          path: ${{ runner.temp }}/windows-preview-delivery/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload sanitized native acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-preview-acceptance
          path: ${{ runner.temp }}/windows-preview-evidence/
          if-no-files-found: ignore
          retention-days: 7

  # The stable installer's Stable/Nightly page (desktop/build/installer-channel.nsh,
  # issue #218). Builds the real stable config with a stub worker, publishes
  # nothing and never starts the app: it only runs silent installs and reads
  # %APPDATA%\ai-shuffle-desktop\updates\update-channel.json after each.
  stable-installer-channel:
    name: Stable installer channel choice (silent installs)
    if: inputs.verify_stable_installer == true
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Write a stub worker manifest
        run: npm run build:worker:stub
      - name: Build the stable NSIS installer (never publish)
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Silent installs write the channel file only when asked, and never overwrite it
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem release -Filter '*-win-x64.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one stable installer, found $($installers.Count)" }
          $installer = $installers[0].FullName
          $updates = Join-Path $env:APPDATA 'ai-shuffle-desktop\updates'
          $file = Join-Path $updates 'update-channel.json'
          $machineFile = Join-Path $env:ProgramData 'ai-shuffle-desktop\updates\update-channel.json'
          $nightly = '{"channel":"nightly"}'
          $stable = '{"channel":"stable"}'
          $results = [System.Collections.Generic.List[string]]::new()
          function Show($text) { if ($null -eq $text) { 'no file' } else { $text } }
          function Install([string]$label, [string[]]$arguments) {
            $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "${label}: the installer exited with $($process.ExitCode)" }
            $running = @(Get-Process -Name 'AI Shuffle' -ErrorAction SilentlyContinue)
            if ($running.Count -gt 0) { $running | Stop-Process -Force; throw "${label}: the installer started the app" }
          }
          function Check([string]$label, [string[]]$arguments, $expected) {
            Install $label $arguments
            # Exact bytes: a BOM or a newline would not match.
            $actual = if (Test-Path -LiteralPath $file) { [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($file)) } else { $null }
            if ($actual -cne $expected) { throw "${label}: expected $(Show $expected), found $(Show $actual)" }
            if (Test-Path -LiteralPath "$file.tmp") { throw "${label}: $file.tmp was left behind" }
            $results.Add("${label} ($($arguments -join ' ')): $(Show $actual)")
          }

          if (Test-Path -LiteralPath (Split-Path $updates)) { throw 'The runner already has an AI Shuffle profile' }
          Check '1. default install' @('/S', '/currentuser') $null
          if (-not (Test-Path "$env:LOCALAPPDATA\Programs\*\AI Shuffle.exe")) { throw '1. default install: AI Shuffle.exe was not installed for the current user' }
          if (Test-Path -LiteralPath $updates) { throw '1. default install: Stable created the updates folder' }
          Check '2. nightly install' @('/S', '/currentuser', '/CHANNEL=nightly') $nightly
          [IO.File]::WriteAllText($file, $stable)
          Check '3. existing choice kept' @('/S', '/CHANNEL=nightly') $stable
          Check '4. installer update' @('/S', '--updated') $stable
          Remove-Item -LiteralPath $file
          Check '5. all-users nightly install' @('/S', '/allusers', '/CHANNEL=nightly') $nightly
          if (-not (Test-Path "$env:ProgramFiles\*\AI Shuffle.exe")) { throw '5. all-users nightly install: AI Shuffle.exe was not installed for all users' }
          if (Test-Path -LiteralPath $machineFile) { throw "5. all-users nightly install: wrote $machineFile instead of the user's profile" }

          $results | ForEach-Object { Write-Host $_ }
          "### Stable installer channel choice`n" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $results | ForEach-Object { "- $_" } | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
