name: Container PostgreSQL

# Builds the production image and exercises a real container: PostgreSQL
# bootstrap, lifecycle, and the UI through a browser. That is a full image
# build on a paid runner, so PRs trigger it only when the container packaging
# itself changes. Application code is covered by the daily canary on main
# (gated on main having moved) and by `gh workflow run container-postgres.yml`.
#
# Blacksmith runners are PAID per minute; every trigger below is deliberate.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - '.dockerignore'
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'scripts/backup.sh'
      - 'scripts/verify_container_postgres.py'
      - 'tests/integration/container_ui_smoke.mjs'
      - '.github/workflows/container-postgres.yml'
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  # The canary gate reads run history.
  actions: read

concurrency:
  group: container-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canary-gate:
    name: Canary gate
    # Use a standard GitHub-hosted runner for the revision lookup, so unchanged revisions do not allocate a paid
    # canary job.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/container-postgres.yml/runs?event=schedule&status=success&branch=main&per_page=1" --jq '.workflow_runs[0].head_sha // empty')"
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "main is still at $GITHUB_SHA, which the last canary already verified; skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "main moved from ${last:-<none>} to $GITHUB_SHA; running the canary."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  container-postgres:
    name: Single-container PostgreSQL and browser
    needs: canary-gate
    # PRs and manual runs always run; the schedule runs only when main moved.
    # !cancelled() keeps this job alive when the gate is skipped on a PR.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.canary-gate.outputs.changed == 'true') }}
    # Use the smaller image-build runner with the sticky layer cache; retain the full container verification.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Image provenance for application updates
        id: source
        run: echo "sequence=$(git rev-list --first-parent --count HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: Dockerfile
      - name: Build candidate image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: ai-shuffle:postgres-candidate
          load: true
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            APPLICATION_SEQUENCE=${{ steps.source.outputs.sequence }}
      - name: Validate embedded-only Compose configuration
        run: docker compose config --quiet
      - name: Verify actual container lifecycle and UI
        run: python scripts/verify_container_postgres.py --image ai-shuffle:postgres-candidate --artifacts "$RUNNER_TEMP/container-postgres"
      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: container-postgres-${{ github.sha }}
          path: ${{ runner.temp }}/container-postgres
          if-no-files-found: ignore
