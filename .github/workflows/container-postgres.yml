name: Container PostgreSQL

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - '.dockerignore'
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'scripts/backup.sh'
      - 'scripts/verify_container_postgres.py'
      - 'tests/integration/container_ui_smoke.mjs'
      - 'app/**'
      - 'frontend/**'
      - 'requirements*.txt'
      - '.github/workflows/container-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  container-postgres:
    name: Single-container PostgreSQL and browser
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: Dockerfile
      - name: Build candidate image
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: ai-shuffle:postgres-candidate
          load: true
          push: false
          build-args: GIT_SHA=${{ github.sha }}
      - name: Validate default and legacy Compose configurations
        env:
          POSTGRES_PASSWORD: disposable-config-check
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.external.yml config --quiet
      - name: Verify actual container lifecycle and UI
        run: python scripts/verify_container_postgres.py --image ai-shuffle:postgres-candidate --artifacts "$RUNNER_TEMP/container-postgres"
      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-postgres-${{ github.sha }}
          path: ${{ runner.temp }}/container-postgres
          if-no-files-found: ignore
