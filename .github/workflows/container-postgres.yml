name: Container PostgreSQL

# Builds and verifies a candidate image on every PR without publishing it.
# Release publication remains in docker-publish.yml.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # CI's daily run gets its own group so it never queues with a push run.
  group: container-postgres-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'schedule' && '-daily' || github.event_name == 'workflow_dispatch' && '-manual' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  container-postgres:
    # Three groups of checks on three runners at once, each on its own build of
    # the same candidate image from the BuildKit layers cached in GitHub
    # Actions. A rebuild from cache is quicker than passing a saved image
    # between jobs, and the slowest group (the signed update, about 4.5 min)
    # sets the wall time. The release paths (docker-publish.yml,
    # build-branch.yml) still run both phases of verify_container_postgres.py
    # (lifecycle and updater) in one job.
    name: Container checks (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      # Every group reports, so one failure shows all of them.
      fail-fast: false
      matrix:
        lane: [lifecycle, updater, install]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Image provenance for application updates
        id: source
        run: |
          # Assign first so a failing command stops the step instead of
          # passing an empty APPLICATION_SEQUENCE to the build.
          sequence=$(python3 scripts/release/sequence_offset.py show)
          tree=$(git rev-parse HEAD^{tree})
          [[ "$sequence" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid container sequence '$sequence'"; exit 1; }
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Unreadable source tree"; exit 1; }
          { echo "sequence=$sequence"; echo "tree=$tree"; } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: ai-shuffle:postgres-candidate
          load: true
          push: false
          # Shared scope; GitHub cache access remains branch-isolated.
          cache-from: type=gha,scope=Dockerfile
          # Writing the cache took 43 s of a pull request's build, and a pull
          # request's cache serves only its own later pushes. Pull requests
          # read main's cache; main and the daily run write it, from one group.
          cache-to: ${{ github.event_name != 'pull_request' && matrix.lane == 'install' && 'type=gha,mode=max,scope=Dockerfile' || '' }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APPLICATION_SEQUENCE=${{ steps.source.outputs.sequence }}
            APPLICATION_SOURCE_TREE=${{ steps.source.outputs.tree }}
      - name: Validate embedded-only Compose configuration
        if: matrix.lane == 'install'
        run: docker compose config --quiet
      # lifecycle: boot, UI, restart, backup and restore, PostgreSQL failure,
      # identity and inherited-environment checks. updater: the synthetic
      # signed source update and the controlled restart that loads it.
      - name: Verify actual container lifecycle and UI
        if: matrix.lane != 'install'
        run: python scripts/verify_container_postgres.py --phases "$LANE" --image ai-shuffle:postgres-candidate --artifacts "$RUNNER_TEMP/container-postgres"
        env:
          LANE: ${{ matrix.lane }}
      # Opt-in agent isolation (#1957) on the same image: an install switched
      # on, restarted and switched off again, with the agent account denied
      # every protected DATA_DIR entry while it is on.
      - name: Verify agent isolation round trip
        if: matrix.lane == 'install'
        run: python scripts/ci/verify_agent_isolation.py --image ai-shuffle:postgres-candidate --artifacts "$RUNNER_TEMP/container-postgres"
      # The buyer's install path: docs/install/compose, unmodified, with only
      # the .env values a buyer fills in; then the first-session API checks
      # (owner password gate, beta license, no CLI login, agent turn refused
      # without a credential). The human half is docs/internal/acceptance-clean-box.md.
      - name: Install from the buyer compose file
        if: matrix.lane == 'install'
        run: python scripts/ci/verify_buyer_compose.py --image ai-shuffle:postgres-candidate --artifacts "$RUNNER_TEMP/container-postgres"
      # Diagnostics only; release evidence is uploaded by docker-publish.yml.
      - name: Upload container evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: container-postgres-${{ matrix.lane }}-${{ github.sha }}
          path: ${{ runner.temp }}/container-postgres
          if-no-files-found: ignore
