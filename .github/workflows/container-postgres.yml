name: Container PostgreSQL

# Builds the production image and exercises a real container: PostgreSQL
# bootstrap, lifecycle, the buyer Compose install and the UI through a browser.
# That is a full image build, so it runs only by hand, where
# Docker is not available locally
# (`gh workflow run container-postgres.yml --ref <branch>`). Every release runs
# the same container verification in docker-publish.yml before the image is pushed.
#
# Standard GitHub-hosted runners are free in public repositories; keep dispatches deliberate.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container-postgres:
    name: Single-container PostgreSQL and browser
    # Standard Linux runner with BuildKit layers cached in GitHub Actions.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Image provenance for application updates
        id: source
        run: echo "sequence=$(git rev-list --first-parent --count HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          tags: ai-shuffle:postgres-candidate
          load: true
          push: false
          # Shared scope; GitHub cache access remains branch-isolated.
          cache-from: type=gha,scope=Dockerfile
          cache-to: type=gha,mode=max,scope=Dockerfile
          build-args: |
            GIT_SHA=${{ github.sha }}
            APPLICATION_SEQUENCE=${{ steps.source.outputs.sequence }}
      - name: Validate embedded-only Compose configuration
        run: docker compose config --quiet
      - name: Verify actual container lifecycle and UI
        run: python scripts/verify_container_postgres.py --image ai-shuffle:postgres-candidate --artifacts "$RUNNER_TEMP/container-postgres"
      # Opt-in agent isolation (#1957) on the same image: an install switched
      # on, restarted and switched off again, with the agent account denied
      # every protected DATA_DIR entry while it is on.
      - name: Verify agent isolation round trip
        run: python scripts/ci/verify_agent_isolation.py --image ai-shuffle:postgres-candidate --artifacts "$RUNNER_TEMP/container-postgres"
      # The buyer's install path: docs/install/compose, unmodified, with only
      # the .env values a buyer fills in; then the first-session API checks
      # (owner password gate, beta license, no CLI login, agent turn refused
      # without a credential). The human half is docs/internal/acceptance-clean-box.md.
      - name: Install from the buyer compose file
        run: python scripts/ci/verify_buyer_compose.py --image ai-shuffle:postgres-candidate --artifacts "$RUNNER_TEMP/container-postgres"
      # Diagnostics only; release evidence is uploaded by docker-publish.yml.
      - name: Upload container evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 3
          name: container-postgres-${{ github.sha }}
          path: ${{ runner.temp }}/container-postgres
          if-no-files-found: ignore
