name: Test coverage map
run-name: "Test coverage map (per-test coverage of the Python suites)"

# A manual, one-off run that records which source lines each Python test runs
# (coverage.py with one context per test). The data shows which tests cover
# nothing another test does not, so the suite can be cut by evidence rather
# than by guess. It gates nothing: no pull request, push or schedule starts it,
# and a failing test does not fail it (the coverage it collected still uploads).
#
# PostgreSQL-only tests skip here (ALLOW_REAL_PG=0, as in the hermetic shards),
# and the frontend and phone suites are not measured.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-coverage-map
  cancel-in-progress: true

jobs:
  backend:
    name: backend shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    # Per-test contexts slow the run; the hermetic shard takes about 20 minutes.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      TESTING: "1"
      ALLOW_REAL_PG: "0"
      PYTHONPATH: .:fluid
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements*.txt
            requirements-voice.lock
            fluid/pyproject.toml

      - name: Install dependencies
        # Same as ci-backend.yml: fluid importable, without its dev extras.
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e ./fluid

      - name: Secure hosted Python dependency permissions
        run: chmod -R go-w "$(python -c 'import sys; print(sys.base_prefix)')"

      - name: Write the coverage settings
        run: printf '[run]\nrelative_files = True\nomit =\n    */tests/*\n    tests/*\n' > "$RUNNER_TEMP/covrc"

      - name: Run the hermetic backend shard with per-test coverage
        # The same tests and partition as ci-backend.yml's full run.
        env:
          COVERAGE_FILE: coverage-map/backend-${{ matrix.shard }}.db
        run: |
          mkdir -p coverage-map
          python -m pytest tests/api tests/core tests/db tests/middleware tests/contract tests/performance tests/mcp tests/services tests/unit tests/test_*.py \
            --ignore=tests/scripts --ignore=tests/core/test_docs_content.py \
            --deselect=tests/test_buyer_docs.py --deselect=tests/test_scan_blocking_db.py \
            --ignore=tests/core/test_container_runtime.py \
            --ignore=tests/core/test_container_image_contract.py \
            -o addopts="" -q -p no:cacheprovider --timeout=600 -n 4 \
            -p scripts.ci.backend_shards --backend-shard "${{ matrix.shard }}" --backend-shard-count 8 \
            --cov=app --cov=fluid --cov=scripts --cov-config="$RUNNER_TEMP/covrc" --cov-context=test --cov-report= \
            --junitxml=coverage-map/backend-${{ matrix.shard }}.xml \
            || echo "::warning::Some tests failed or errored; their coverage is still recorded."

      - name: Upload coverage-map-backend-${{ matrix.shard }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-map-backend-${{ matrix.shard }}
          path: coverage-map/
          retention-days: 14
          if-no-files-found: error

  scripts:
    name: CI scripts and policy tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TESTING: "1"
      ALLOW_REAL_PG: "0"
      PYTHONPATH: .:fluid
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements*.txt
            requirements-voice.lock
            fluid/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e ./fluid

      - name: Secure hosted Python dependency permissions
        run: chmod -R go-w "$(python -c 'import sys; print(sys.base_prefix)')"

      - name: Write the coverage settings
        run: printf '[run]\nrelative_files = True\nomit =\n    */tests/*\n    tests/*\n' > "$RUNNER_TEMP/covrc"

      - name: Run tests/scripts with per-test coverage
        env:
          COVERAGE_FILE: coverage-map/scripts.db
        run: |
          mkdir -p coverage-map
          python -m pytest tests/scripts \
            -o addopts="" -q -p no:cacheprovider --timeout=600 -n 4 --dist loadfile \
            --cov=app --cov=fluid --cov=scripts --cov-config="$RUNNER_TEMP/covrc" --cov-context=test --cov-report= \
            --junitxml=coverage-map/scripts.xml \
            || echo "::warning::Some tests failed or errored; their coverage is still recorded."

      - name: Upload coverage-map-scripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-map-scripts
          path: coverage-map/
          retention-days: 14
          if-no-files-found: error

  fluid:
    name: fluid unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: fluid/pyproject.toml

      - name: Install fluid with its dev extras
        run: pip install './fluid[dev]' 'pytest-cov>=4.1.0'

      - name: Install ripgrep
        # As in ci-fluid.yml: the engine-parity tests skip without rg.
        timeout-minutes: 13
        run: |
          if command -v rg; then exit 0; fi
          python3 scripts/ci/bounded_apt.py sh -c '
            apt-get update -qq \
              -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources \
              -o Dir::Etc::sourceparts=- &&
            apt-get install -y -qq ripgrep'

      - name: Write the coverage settings
        run: printf '[run]\nrelative_files = True\nomit =\n    */tests/*\n    tests/*\n' > "$RUNNER_TEMP/covrc"

      - name: Run the fluid unit suite with per-test coverage
        env:
          COVERAGE_FILE: coverage-map/fluid.db
        run: |
          mkdir -p coverage-map
          python -m pytest fluid/tests/unit -q -p no:cacheprovider -n 4 --dist loadfile \
            --cov=fluid/fluid --cov-config="$RUNNER_TEMP/covrc" --cov-context=test --cov-report= \
            --junitxml=coverage-map/fluid.xml \
            || echo "::warning::Some tests failed or errored; their coverage is still recorded."

      - name: Upload coverage-map-fluid
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-map-fluid
          path: coverage-map/
          retention-days: 14
          if-no-files-found: error
