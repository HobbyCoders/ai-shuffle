name: CI Backend
run-name: "${{ github.workflow }} (${{ inputs.runner_cpus || '2' }} vCPU)"

# Python half of the split CI: the app's fast test subset, the packaging
# checks and the real-PostgreSQL mobile contracts on one runner. (fluid's own
# unit suite stays in ci-fluid.yml: its dev extras need mcp>=2 while the app
# pins 1.x.) Paths-filtered: a PR that touches no backend file runs this
# workflow not at all, so docs-only PRs run no CI whatsoever — intended, that
# is the point of the split.
#
# Blacksmith runners are PAID per minute; every trigger below is deliberate.
on:
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'fluid/**'
      - 'scripts/network_migrate.py'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'requirements-native.txt'
      - 'requirements*.lock'
      - 'run_local.*'
      - 'scripts/**'
      - 'docker/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose*.yml'
      - 'pytest.ini'
      - '.github/workflows/ci-backend.yml'
      - '.github/workflows/release.yml'
  # Manual run on any ref (`gh workflow run ci-backend.yml`).
  workflow_dispatch:
    inputs:
      runner_cpus:
        description: 'Runner vCPUs (compare the same commit before changing defaults)'
        type: choice
        options: ['2', '4']
        default: '2'

permissions:
  contents: read

# Cancel superseded runs (force-pushes / rapid successive commits) instead of
# letting stale runs finish and fail/email after a newer commit already ran.
concurrency:
  group: ci-backend-${{ github.ref }}-${{ inputs.runner_cpus || '2' }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    # Keep a hard job timeout to bound silent backend wedges and surface a useful failure rather than waiting
    # for the platform default.
    timeout-minutes: 35
    # Same-commit comparison on 2026-09-15: 2 vCPU / 2 workers passed in 415s;
    # 4 vCPU / 4 workers passed in 287s (runs 35005402929 / 35005406199).
    # The lower runner tier avoids unnecessary cost. Keep worker count
    # matched to the runner: four workers previously starved 2-vCPU fixtures.
    runs-on: ${{ inputs.runner_cpus == '4' && 'blacksmith-4vcpu-ubuntu-2404' || 'blacksmith-2vcpu-ubuntu-2404' }}
    env:
      TESTING: "1"
      ALLOW_REAL_PG: "0"
      # The checkout below has full history: a missing old-schema commit is a
      # failure here, not a silent skip (tests/db/test_schema_lifecycle.py).
      SCHEMA_LIFECYCLE_REQUIRED: "1"
      PYTEST_WORKERS: ${{ inputs.runner_cpus == '4' && '4' || '2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The schema lifecycle tests build old-schema databases from git
          # history; a shallow clone would skip them.
          fetch-depth: 0

      # Upstream actions/setup-* on purpose: Blacksmith archived its
      # useblacksmith/setup-* forks and now routes the official cache actions
      # through its colocated cache transparently.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # 3.12 matches production (the Docker image) and the fluid
          # harness's requires-python floor.
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        # The fluid harness (fluid/) must be importable or tests/core's fluid
        # modules fail at COLLECTION, aborting the whole run before any test
        # executes. fluid's own unit suite runs separately in ci-fluid.yml;
        # never install its dev extras here, they upgrade mcp past the app's
        # pin and break a dozen app tests.
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e ./fluid

      - name: Reject blocking database calls on the event loop
        run: |
          python -m pytest tests/test_scan_blocking_db.py -o addopts="" -q
          python scripts/scan_blocking_db.py

      - name: Run fast test subset
        # The suite uses an in-memory SQLite shim — no Postgres service needed.
        # addopts="" overrides any pytest.ini addopts so this never fails on coverage.
        # --timeout=120 bounds the rare hard-wedge per test: a wedged run fails
        # in ~2 minutes with the hung test named, instead of billing the full
        # 20-minute job timeout with no diagnosis.
        # One pytest-xdist worker per vCPU; the dispatch input selects both
        # runner size and worker count for repeatable comparisons.
        # tests/mcp, services, unit, scripts and top-level tests/test_*.py are hermetic too (~45s at -n 4).
        run: python -m pytest tests/api tests/core tests/db tests/middleware tests/contract tests/performance tests/mcp tests/services tests/unit tests/scripts tests/test_*.py -o addopts="" -q -p no:cacheprovider --timeout=120 -n "$PYTEST_WORKERS"

      - name: Isolated folder shell escape tests (real bubblewrap)
        # The fast subset skips these: the runner has no bubblewrap. Install
        # it, lift Ubuntu 24.04's AppArmor block on unprivileged user
        # namespaces (the image's container needs the equivalent compose
        # security_opt lines), and require the sandbox so a broken setup
        # fails instead of skipping. ~20 s.
        env:
          CHAT_SHELL_REQUIRE_SANDBOX: '1'
          PYTHONPATH: .:fluid
        run: |
          sudo apt-get install -y -qq --no-install-recommends bubblewrap >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends bubblewrap)
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          bwrap --version
          python -m pytest tests/core/test_chat_shell.py -o addopts="" -q -rs -p no:cacheprovider --timeout=120

      - name: Boot smoke test (real server process)
        # Starts `python -m app.main` as a subprocess against a private
        # PostgreSQL 16 cluster (initialized on a free port by the container
        # supervisor's own Database class), then drives health, the owner
        # bootstrap, a session, the chat socket and a SIGTERM shutdown. It
        # catches "the app does not start", which the in-process TestClient
        # suites above cannot. Needs the runner's preinstalled PostgreSQL 16
        # binaries (not the service, which is still stopped here);
        # BOOT_SMOKE_REQUIRED makes missing binaries fail instead of skip.
        # Also runs the schema lifecycle's real-PostgreSQL concurrent start
        # (several workers run init_core on one empty database at once).
        # Serial on purpose: the server binds real ports. ~30 s.
        env:
          BOOT_SMOKE_REQUIRED: '1'
          SMOKE_PG_BIN: /usr/lib/postgresql/16/bin
        run: python -m pytest tests/smoke tests/db/test_schema_lifecycle.py -m boot_smoke -o addopts="" -q -rs -p no:cacheprovider --timeout=240

      - name: Start the runner's PostgreSQL
        # The Ubuntu runner image ships PostgreSQL preinstalled and stopped;
        # starting it costs seconds, where a service container costs a pull
        # and a health-check wait on every run. One database per contract
        # suite so neither sees the other's tables.
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "CREATE USER shuffle_mobile_test WITH PASSWORD 'mobile-test-only'" \
            -c "CREATE DATABASE shuffle_mobile_test OWNER shuffle_mobile_test" \
            -c "CREATE USER shuffle_network_test WITH PASSWORD 'network-test-only'" \
            -c "CREATE DATABASE shuffle_network_test OWNER shuffle_network_test" \
            -c "CREATE USER shuffle_safety_test WITH PASSWORD 'safety-test-only'" \
            -c "CREATE DATABASE shuffle_safety_test OWNER shuffle_safety_test"
          pg_isready -h 127.0.0.1 -p 5432

      - name: Measure managed PostgreSQL checkpoints and crash recovery
        env:
          ALLOW_REAL_PG: '1'
          TEST_POSTGRES_DSN: postgresql://shuffle_safety_test:safety-test-only@127.0.0.1:5432/shuffle_safety_test
          CONTAINER_RUNTIME_TEST_PG: '1'
          CONTAINER_RUNTIME_TEST_PRESSURE: '1'
          AI_SHUFFLE_ENV_FILE: /dev/null
          PYTHONPATH: .:fluid
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          python -c "import os; print('Pre-measurement load average:', os.getloadavg())"
          python -m pytest tests/core/test_container_runtime.py tests/core/test_container_image_contract.py -o addopts="" -q -s -p no:cacheprovider --timeout=120

      - name: Mobile PostgreSQL contracts
        env:
          ALLOW_REAL_PG: '1'
          MOBILE_POSTGRES_TEST: '1'
          TEST_POSTGRES_DSN: postgresql://REDACTED@127.0.0.1:5432/shuffle_mobile_test
          MOBILE_PG_HOST: '127.0.0.1'
          MOBILE_PG_PORT: '5432'
          MOBILE_PG_DATABASE: shuffle_mobile_test
          MOBILE_PG_USER: shuffle_mobile_test
          MOBILE_PG_PASSWORD: mobile-test-only
          AI_SHUFFLE_ENV_FILE: /dev/null
          PYTHONPATH: .
        run: >-
          python -m pytest tests/integration/test_mobile_postgres.py
          --confcutdir=tests/integration -o addopts="" -p no:cacheprovider
          --timeout=60 -v

      - name: Verify network migration on real PostgreSQL
        env:
          ALLOW_REAL_PG: '1'
          NETWORK_POSTGRES_TEST: '1'
          TEST_POSTGRES_DSN: postgresql://REDACTED@127.0.0.1:5432/shuffle_network_test
          NETWORK_PG_PORT: '5432'
          AI_SHUFFLE_ENV_FILE: /dev/null
          PYTHONPATH: .
        run: >-
          python -m pytest tests/integration/test_network_migration_postgres.py
          tests/integration/test_network_heads_postgres.py
          --confcutdir=tests/integration -o addopts="" -p no:cacheprovider
          --timeout=120 -v

      - name: Verify PostgreSQL pool and transaction safety
        env:
          ALLOW_REAL_PG: '1'
          PG_SAFETY_TEST: '1'
          TESTING: '1'
          TEST_POSTGRES_DSN: postgresql://shuffle_safety_test:safety-test-only@127.0.0.1:5432/shuffle_safety_test
          AI_SHUFFLE_ENV_FILE: /dev/null
          PYTHONPATH: .
        run: |
          python -m pytest tests/integration/test_postgres_safety.py \
            --confcutdir=tests/integration -o addopts="" -p no:cacheprovider \
            --timeout=120 -v
          python -m pytest tests/db/test_usage_budget_postgres.py tests/db/test_openrouter_usage_postgres.py \
            tests/db/test_dedupe_cancelled_usage_postgres.py tests/db/test_turn_usage_settlement_postgres.py \
            tests/db/test_fluid_delegated_batching_postgres.py tests/db/test_fluid_native_batching_postgres.py \
            tests/db/test_universal_search_pg.py tests/db/test_runs_activity_postgres.py \
            tests/core/test_pg_session_store.py tests/core/test_pg_session_store_rewind.py \
            tests/db/test_explore_retirement_postgres.py \
            -o addopts="" -p no:cacheprovider --timeout=120 -v

      - name: Audit public Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --skip-editable
