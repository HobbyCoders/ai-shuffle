name: CI Backend
run-name: "${{ github.workflow }} (8 shards, 4 workers each)"

# Backend coverage and security checks on every PR, including drafts.
# A pull request's shards run the tests its change can reach, chosen from the
# test map of the last full run on main (scripts/ci/backend_test_map.py); any
# doubt runs them all. Every other run (main, the daily and a manual run) runs
# every test and records the map. Contracts, security, policy and PostgreSQL
# safety run in full every time.
on:
  workflow_call:
    inputs:
      gated_by_caller:
        description: The caller judges these jobs itself (ci.yml), so the verdict job here does not queue for a runner
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      runner_cpus:
        description: 'Legacy input (retained for callers); shards use four workers on ubuntu-24.04'
        type: choice
        options: ['2', '4']
        default: '2'

permissions:
  contents: read

# Cancel superseded runs (force-pushes / rapid successive commits) instead of
# letting stale runs finish and fail/email after a newer commit already ran.
concurrency:
  # CI's daily run gets its own group so it never queues with a push run.
  group: ci-backend-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'schedule' && '-daily' || github.event_name == 'workflow_dispatch' && '-manual' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-select:
    name: backend-select
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.choose.outputs.shards }}
      count: ${{ steps.choose.outputs.count }}
      tests: ${{ steps.choose.outputs.tests }}
      selection: ${{ steps.choose.outputs.selection }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # A pull request diffs from the map's commit, which must be on main's
          # history; every other run chooses everything without git. Strings:
          # a number 0 is false in an expression, so `&& 0 || 1` is always 1.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The newest map a full run on main saved (backend-map below). A pull
      # request can read main's caches; it never saves one.
      - name: Restore the backend test map of the last full run on main
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: backend-test-map.json.gz
          key: backend-test-map-none
          restore-keys: backend-test-map-
      - name: Choose the backend tests this run needs
        id: choose
        run: python scripts/ci/backend_test_map.py ci-select --map backend-test-map.json.gz >> "$GITHUB_OUTPUT"
      # The CI job reads both choices from these step names (scripts/ci/main_gate.py).
      - name: "Selected backend shards: ${{ steps.choose.outputs.shards }}"
        run: echo "Shards ${{ steps.choose.outputs.shards }}"
      - name: "Backend test selection: ${{ steps.choose.outputs.selection }}"
        run: echo "Selection ${{ steps.choose.outputs.selection }}"

  backend-shard:
    name: backend-shard ${{ matrix.shard }}
    needs: backend-select
    # A pull request whose change no shard test can reach runs none.
    if: needs.backend-select.outputs.shards != '[]'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.backend-select.outputs.shards) }}
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    env:
      TESTING: "1"
      ALLOW_REAL_PG: "0"
      PYTHONPATH: .:fluid
      SELECTION: ${{ needs.backend-select.outputs.selection }}
      SELECTED_TESTS: ${{ needs.backend-select.outputs.tests }}
      # The chooser's count, not the matrix size: a rerun of failed jobs only
      # runs fewer matrix jobs but must partition the same way.
      SHARD_COUNT: ${{ needs.backend-select.outputs.count }}
      # Every run of all the tests records the map: main publishes its own
      # (backend-map below) and adopts a pull request's when that run's record
      # proves main's backend (ci.yml `backend-map`).
      RECORD_MAP: ${{ needs.backend-select.outputs.selection == 'all' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep history for tests that inspect public revisions. Schema lifecycle
          # tests use checked-in SQL fixtures and need no private-era commits.
          fetch-depth: 0

      # Official setup actions use the GitHub Actions dependency cache.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # 3.12 matches production (the Docker image) and the fluid
          # harness's requires-python floor.
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements*.txt
            requirements-voice.lock
            fluid/pyproject.toml

      - name: Install dependencies
        # The fluid harness (fluid/) must be importable or tests/core's fluid
        # modules fail at COLLECTION, aborting the whole run before any test
        # executes. fluid's own unit suite runs separately in ci-fluid.yml;
        # never install its dev extras here, they upgrade mcp past the app's
        # pin and break a dozen app tests.
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e ./fluid

      # setup-python's hosted tool cache can contain group/world-writable
      # stdlib files. Match the image's trusted dependency permissions rather
      # than weakening the root-phase import provenance assertions.
      - name: Secure hosted Python dependency permissions
        run: chmod -R go-w "$(python -c 'import sys; print(sys.base_prefix)')"

      - name: Record runner capacity
        run: nproc

      - name: Run fast test subset
        # The suite uses an in-memory SQLite shim — no Postgres service needed.
        # addopts="" overrides any pytest.ini addopts so this never fails on coverage.
        # --timeout=120 bounds the rare hard-wedge per test: a wedged run fails
        # in ~2 minutes with the hung test named, instead of billing the job
        # timeout with no diagnosis.
        # Eight deterministic partitions of the hermetic collection, four workers
        # each: one per vCPU (backend_gate.SHARD_WORKERS checks every receipt).
        # Policy, blocking-DB and serial container tests run in other required jobs.
        # Use --deselect for excluded top-level files: the glob passes them by
        # name, and --ignore does not apply to explicit file arguments. The
        # *_postgres.py and test_pg_session_store*.py files stay collected
        # here; they skip without ALLOW_REAL_PG=1 and run in the PostgreSQL
        # safety step.
        # backend_shard_run.py reruns only the failed tests, once (the hosted
        # Windows parts' retry). Tests that pass then pass the shard and are
        # listed as flaky in the job summary; one that fails twice, a
        # collection error or more than 20 failures fails it. The receipt
        # counts only with the rerun's pass recorded on it (backend_gate.py).
        # A full run also records which functions each test file runs
        # (tests/_test_map.py): main merges it into the map (backend-map), and
        # adopts a pull request's records once their pass proves main's files.
        # A pull request that runs only some tests records nothing.
        run: |
          if [ "$SELECTION" = all ]; then
            targets=(tests/api tests/core tests/db tests/middleware tests/contract tests/performance tests/mcp tests/services tests/unit tests/test_*.py)
          else
            mapfile -t targets < <(python -c 'import json, os; print("\n".join(json.loads(os.environ["SELECTED_TESTS"])))')
          fi
          record=()
          if [ "$RECORD_MAP" = true ]; then
            record=(-p tests._test_map)
            export BACKEND_TEST_MAP_DIR="$RUNNER_TEMP/map-hits"
          fi
          python scripts/ci/backend_shard_run.py -- \
            python -m pytest --durations=50 --junitxml=reports/hermetic-1.xml "${targets[@]}" \
              --ignore=tests/scripts --ignore=tests/core/test_docs_content.py \
              --deselect=tests/test_buyer_docs.py --deselect=tests/test_scan_blocking_db.py \
              --ignore=tests/core/test_container_runtime.py \
              --ignore=tests/core/test_container_image_contract.py \
              -o addopts="" -q -p no:cacheprovider --timeout=120 -n 4 "${record[@]}" \
              -p scripts.ci.backend_shards --backend-shard "${{ matrix.shard }}" \
              --backend-shard-count "$SHARD_COUNT" --backend-selection "$SELECTION"

      - name: Upload backend-shard-${{ matrix.shard }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-shard-${{ matrix.shard }}-a${{ github.run_attempt }}
          path: |
            reports/
            backend-results/
          if-no-files-found: error
          retention-days: 7

      # Optional: a lost record only leaves pull requests the previous map.
      - name: Upload backend-map-hits-${{ matrix.shard }}
        if: env.RECORD_MAP == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-map-hits-${{ matrix.shard }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/map-hits/
          if-no-files-found: error
          retention-days: 3

  # Merge the full run's records into the map pull requests choose tests from.
  # Only after every shard passed: a map missing a shard would miss its tests.
  # Losing a map only makes the next pull requests run every test, so no
  # failure here fails the run; no verdict needs this job.
  backend-map:
    name: backend-map
    needs: [backend-select, backend-shard]
    if: github.event_name != 'pull_request' && needs.backend-select.outputs.selection == 'all' && needs.backend-shard.result == 'success'
    continue-on-error: true
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the shards' records
        uses: actions/download-artifact@v4
        with:
          pattern: backend-map-hits-*-a*
          path: hit-attempts
      - name: Download the shards' timings
        uses: actions/download-artifact@v4
        with:
          pattern: backend-shard-*-a*
          path: shard-attempts
      # A failure here leaves pull requests the previous map, or every test.
      - name: Merge the backend test map
        id: merge
        continue-on-error: true
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          python scripts/ci/shard_evidence.py --prefix backend-map-hits --count 8 --source hit-attempts --destination hits
          python scripts/ci/shard_evidence.py --prefix backend-shard --count 8 --source shard-attempts --destination shards
          python scripts/ci/backend_test_map.py merge --hits hits --durations shards --out backend-test-map.json.gz --commit "$HEAD_SHA"
          ls -l backend-test-map.json.gz
      - name: Save the map for pull requests
        if: steps.merge.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: backend-test-map.json.gz
          key: backend-test-map-${{ github.run_id }}-${{ github.run_attempt }}

  backend-contracts:
    name: backend-contracts
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    env:
      TESTING: "1"
      ALLOW_REAL_PG: "0"
      PYTHONPATH: .:fluid
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep history for tests that inspect public revisions. Schema lifecycle
          # tests use checked-in SQL fixtures and need no private-era commits.
          fetch-depth: 0

      # Official setup actions use the GitHub Actions dependency cache.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # 3.12 matches production (the Docker image) and the fluid
          # harness's requires-python floor.
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements*.txt
            requirements-voice.lock
            fluid/pyproject.toml

      - name: Install dependencies
        # The fluid harness (fluid/) must be importable or tests/core's fluid
        # modules fail at COLLECTION, aborting the whole run before any test
        # executes. fluid's own unit suite runs separately in ci-fluid.yml;
        # never install its dev extras here, they upgrade mcp past the app's
        # pin and break a dozen app tests.
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e ./fluid

      # setup-python's hosted tool cache can contain group/world-writable
      # stdlib files. Match the image's trusted dependency permissions rather
      # than weakening the root-phase import provenance assertions.
      - name: Secure hosted Python dependency permissions
        run: chmod -R go-w "$(python -c 'import sys; print(sys.base_prefix)')"

      - name: Record runner capacity
        run: nproc

      # pull_request + checkout's default ref tests refs/pull/<number>/merge,
      # not the PR head: duplicate IDs introduced by a clean merge must fail.
      - name: Validate merged live-smoke catalog and generated table
        run: python -m scripts.live_smoke render --check

      - name: Boot smoke test (real server process)
        # Starts `python -m app.main` as a subprocess against a private
        # PostgreSQL 16 cluster (initialized on a free port by the container
        # supervisor's own Database class), then drives health, the owner
        # bootstrap, a session, the chat socket and a SIGTERM shutdown. It
        # catches "the app does not start", which the in-process TestClient
        # suites above cannot. Needs the runner's preinstalled PostgreSQL 16
        # binaries (not the service, which is still stopped here);
        # BOOT_SMOKE_REQUIRED makes missing binaries fail instead of skip.
        # Also runs the schema lifecycle's real-PostgreSQL concurrent start
        # (several workers run init_core on one empty database at once).
        # Serial on purpose: the server binds real ports. ~30 s.
        env:
          BOOT_SMOKE_REQUIRED: '1'
          SMOKE_PG_BIN: /usr/lib/postgresql/16/bin
        run: python -m pytest --durations=50 --junitxml=reports/contracts-8-1.xml tests/smoke tests/db/test_schema_lifecycle.py -m boot_smoke -o addopts="" -q -rs -p no:cacheprovider --timeout=240

      - name: Start the runner's PostgreSQL
        # The ubuntu-24.04 runner image ships PostgreSQL 16 preinstalled and stopped;
        # starting it costs seconds, where a service container costs a pull
        # and a health-check wait on every run. One database per contract
        # suite so neither sees the other's tables.
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "CREATE USER shuffle_mobile_test WITH PASSWORD 'mobile-test-only'" \
            -c "CREATE DATABASE shuffle_mobile_test OWNER shuffle_mobile_test" \
            -c "CREATE USER shuffle_network_test WITH PASSWORD 'network-test-only'" \
            -c "CREATE DATABASE shuffle_network_test OWNER shuffle_network_test" \
            -c "CREATE USER shuffle_safety_test WITH PASSWORD 'safety-test-only'" \
            -c "CREATE DATABASE shuffle_safety_test OWNER shuffle_safety_test"
          pg_isready -h 127.0.0.1 -p 5432

      - name: Measure managed PostgreSQL checkpoints and crash recovery
        # local_ci backend-linux also runs these files serially: plain cases
        # in check and full, outside the parallel fast subset. While #350 is
        # unresolved, local full PG cases require LOCAL_CI_CONTAINER_PG=1;
        # LOCAL_CI_CONTAINER_PRESSURE=1 adds measurements and implies PG.
        # This manual hosted measurement step opts into both below.
        env:
          ALLOW_REAL_PG: '1'
          TEST_POSTGRES_DSN: postgresql://shuffle_safety_test:safety-test-only@127.0.0.1:5432/shuffle_safety_test
          CONTAINER_RUNTIME_TEST_PG: '1'
          CONTAINER_RUNTIME_TEST_PRESSURE: '1'
          AI_SHUFFLE_ENV_FILE: /dev/null
          PYTHONPATH: .:fluid
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          python -c "import os; print('Pre-measurement load average:', os.getloadavg())"
          python -m pytest --durations=50 --junitxml=reports/contracts-10-1.xml tests/core/test_container_runtime.py tests/core/test_container_image_contract.py -o addopts="" -q -s -p no:cacheprovider --timeout=120

      - name: Mobile PostgreSQL contracts
        env:
          ALLOW_REAL_PG: '1'
          MOBILE_POSTGRES_TEST: '1'
          TEST_POSTGRES_DSN: postgresql://shuffle_mobile_test:mobile-test-only@127.0.0.1:5432/shuffle_mobile_test
          MOBILE_PG_HOST: '127.0.0.1'
          MOBILE_PG_PORT: '5432'
          MOBILE_PG_DATABASE: shuffle_mobile_test
          MOBILE_PG_USER: shuffle_mobile_test
          MOBILE_PG_PASSWORD: mobile-test-only
          AI_SHUFFLE_ENV_FILE: /dev/null
          PYTHONPATH: .
        run: >-
          python -m pytest --durations=50 --junitxml=reports/contracts-11-1.xml tests/integration/test_mobile_postgres.py
          --confcutdir=tests/integration -o addopts="" -p no:cacheprovider
          --timeout=60 -v

      - name: Verify network migration on real PostgreSQL
        env:
          ALLOW_REAL_PG: '1'
          NETWORK_POSTGRES_TEST: '1'
          TEST_POSTGRES_DSN: postgresql://shuffle_network_test:network-test-only@127.0.0.1:5432/shuffle_network_test
          NETWORK_PG_PORT: '5432'
          AI_SHUFFLE_ENV_FILE: /dev/null
          PYTHONPATH: .
        run: >-
          python -m pytest --durations=50 --junitxml=reports/contracts-12-1.xml tests/integration/test_network_migration_postgres.py
          tests/integration/test_network_heads_postgres.py
          --confcutdir=tests/integration -o addopts="" -p no:cacheprovider
          --timeout=120 -v

      # Run the timing ratchets on this runner, in parallel with PostgreSQL safety.
      # Full controls once per database; both primary ratchets four more times.
      # Keep a dedicated database, separate from the other contracts on this runner.
      - name: Measure large-fold contention on both databases
        env:
          TESTING: '1'
          AI_SHUFFLE_TRANSCRIPT_PRODUCER: '1'
          AI_SHUFFLE_ENV_FILE: /dev/null
          PYTHONPATH: .
          CONTENTION_ATTEMPTS: '5'
        run: |
          # Only this step uses the throwaway login; never store a password in the workflow.
          password=$(openssl rand -hex 24)
          printf '::add-mask::%s\n' "$password"
          printf "CREATE ROLE shuffle_contention_test LOGIN PASSWORD '%s';\n" "$password" | \
            sudo -u postgres psql -v ON_ERROR_STOP=1
          sudo -u postgres createdb --owner shuffle_contention_test shuffle_contention_test
          contention_dsn="postgresql://shuffle_contention_test:${password}@127.0.0.1:5432/shuffle_contention_test"
          for attempt in $(seq 1 "$CONTENTION_ATTEMPTS"); do
            selection=()
            if [ "$attempt" -gt 1 ]; then
              selection=(-k 'test_background_projection or test_large_preparation')
            fi
            python -m pytest --durations=50 tests/test_transcript_projection_ingest_budget.py "${selection[@]}" \
              -o addopts="" -q -s -p no:cacheprovider --timeout=60 \
              --junitxml="reports/large-fold-shim-${attempt}.xml"
            ALLOW_REAL_PG=1 TEST_POSTGRES_DSN="$contention_dsn" \
              python -m pytest --durations=50 tests/db/test_transcript_projection_ingest_postgres.py "${selection[@]}" \
              -o addopts="" -q -s -p no:cacheprovider --timeout=60 \
              --junitxml="reports/large-fold-pg-${attempt}.xml"
          done

      - name: Upload backend-contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-contracts
          path: reports/
          if-no-files-found: error
          retention-days: 7

  # Two runners: `checks` runs the guards and audits and most of the policy
  # suite, `policy` its slowest files. One runner took six minutes, the policy
  # suite alone about five on four workers (959 s of tests).
  backend-security:
    name: backend-security (${{ matrix.part }})
    if: always()
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        part: [checks, policy]
    env:
      TESTING: "1"
      ALLOW_REAL_PG: "0"
      PYTHONPATH: .:fluid
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep history for tests that inspect public revisions. Schema lifecycle
          # tests use checked-in SQL fixtures and need no private-era commits.
          fetch-depth: 0

      # Official setup actions use the GitHub Actions dependency cache.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # 3.12 matches production (the Docker image) and the fluid
          # harness's requires-python floor.
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements*.txt
            requirements-voice.lock
            fluid/pyproject.toml

      - name: Install dependencies
        # The fluid harness (fluid/) must be importable or tests/core's fluid
        # modules fail at COLLECTION, aborting the whole run before any test
        # executes. fluid's own unit suite runs separately in ci-fluid.yml;
        # never install its dev extras here, they upgrade mcp past the app's
        # pin and break a dozen app tests.
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e ./fluid

      # setup-python's hosted tool cache can contain group/world-writable
      # stdlib files. Match the image's trusted dependency permissions rather
      # than weakening the root-phase import provenance assertions.
      - name: Secure hosted Python dependency permissions
        run: chmod -R go-w "$(python -c 'import sys; print(sys.base_prefix)')"

      - name: Record runner capacity
        run: nproc

      - name: Reject blocking database calls on the event loop
        # The only run of tests/test_scan_blocking_db.py: the fast subset
        # ignores it.
        if: matrix.part == 'checks'
        run: |
          python -m pytest --durations=50 --junitxml=reports/security-4-1.xml tests/test_scan_blocking_db.py -o addopts="" -q
          python scripts/scan_blocking_db.py

      - name: Agent isolation with real accounts (root)
        # tests/core/test_agent_isolation_root.py (#1957) needs root: it
        # migrates a throwaway DATA_DIR to a second uid and runs the Bash tool
        # and Monitor shells through the spawn runner as a third, checking
        # each protected entry gives "Permission denied". sudo keeps the
        # runner's Python; no bytecode is written as root. ~10 s.
        if: matrix.part == 'checks'
        env:
          AGENT_ISOLATION_ROOT_REQUIRED: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: .:fluid
        run: sudo -E env "PATH=$PATH" python -m pytest --durations=50 --junitxml=reports/security-7-1.xml tests/core/test_agent_isolation_root.py -o addopts="" -q -rs -p no:cacheprovider --timeout=180

      - name: Audit public Python dependencies
        # Always fail closed; each audit shares a 180s budget across PyPI timeout retries.
        if: matrix.part == 'checks'
        timeout-minutes: 8
        run: |
          python -m pip install pip-audit==2.10.1
          python scripts/pip_audit_retry.py --skip-editable
          python scripts/pip_audit_retry.py -r requirements-voice.lock
      # 1.7.12 or newer: older releases reject a schedule's `timezone` key,
      # which the nightly (desktop-source.yml) uses.
      - name: Lint all workflow syntax/actions (pinned actionlint)
        if: matrix.part == 'checks'
        run: |
          lint_dir="$(mktemp -d)"
          trap 'rm -rf "$lint_dir"' EXIT
          curl --fail --location --retry 2 --max-time 120 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$lint_dir/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $lint_dir/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$lint_dir/actionlint.tar.gz" -C "$lint_dir" actionlint
          "$lint_dir/actionlint" -shellcheck=

      # Four workers, each test file on one of them (--dist loadfile): one
      # serial run took nine minutes. `policy` runs the slowest files, longest
      # first (about 150 s each for the first three); `checks` runs every other
      # file of the suite. Both halves come from the one list below, so
      # together they run the whole suite once.
      - name: Full workflow, publication, security and docs policy regressions
        env:
          PART: ${{ matrix.part }}
        run: |
          slow=(tests/scripts/test_test_scratch.py tests/scripts/test_backend_shard_run.py
                tests/scripts/test_backend_shards.py tests/scripts/test_ci_plan.py tests/scripts/test_windows_parts.py)
          if [ "$PART" = policy ]; then
            targets=("${slow[@]}")
          else
            targets=(tests/scripts tests/test_buyer_docs.py tests/core/test_docs_content.py)
            for file in "${slow[@]}"; do
              test -f "$file" || { echo "::error::$file is gone: update the policy split"; exit 1; }
              targets+=("--ignore=$file")
            done
          fi
          python -m pytest "${targets[@]}" \
            -o addopts="" -q -p no:cacheprovider --timeout=120 -n 4 --dist loadfile \
            --durations=50 --junitxml=reports/policy.xml

      - name: Upload backend-security
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-security-${{ matrix.part }}
          path: reports/
          if-no-files-found: error
          retention-days: 7

  # Run database safety beside the policy and serial contract suites. Two
  # runners, each with its own PostgreSQL: these tests share one database
  # serially and watch cluster-wide locks and backends, so they never run side
  # by side on one cluster. `indexing` runs the three slowest files (about
  # 135 s), `safety` the rest (about 105 s); one runner took five minutes.
  backend-postgres:
    name: backend-postgres (${{ matrix.part }})
    if: always()
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        part: [safety, indexing]
    env:
      TESTING: "1"
      ALLOW_REAL_PG: "0"
      PYTHONPATH: .:fluid
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep history for tests that inspect public revisions. Schema lifecycle
          # tests use checked-in SQL fixtures and need no private-era commits.
          fetch-depth: 0

      # Official setup actions use the GitHub Actions dependency cache.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # 3.12 matches production (the Docker image) and the fluid
          # harness's requires-python floor.
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements*.txt
            requirements-voice.lock
            fluid/pyproject.toml

      - name: Install dependencies
        # The fluid harness (fluid/) must be importable or tests/core's fluid
        # modules fail at COLLECTION, aborting the whole run before any test
        # executes. fluid's own unit suite runs separately in ci-fluid.yml;
        # never install its dev extras here, they upgrade mcp past the app's
        # pin and break a dozen app tests.
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e ./fluid

      # setup-python's hosted tool cache can contain group/world-writable
      # stdlib files. Match the image's trusted dependency permissions rather
      # than weakening the root-phase import provenance assertions.
      - name: Secure hosted Python dependency permissions
        run: chmod -R go-w "$(python -c 'import sys; print(sys.base_prefix)')"

      - name: Record runner capacity
        run: nproc

      - name: Start the runner's PostgreSQL
        # The ubuntu-24.04 runner image ships PostgreSQL 16 preinstalled and stopped;
        # starting it costs seconds, where a service container costs a pull
        # and a health-check wait on every run. This job only uses the safety database.
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "CREATE USER shuffle_safety_test WITH PASSWORD 'safety-test-only'" \
            -c "CREATE DATABASE shuffle_safety_test OWNER shuffle_safety_test" \
            -c "SET allow_in_place_tablespaces = true" \
            -c "CREATE TABLESPACE history_index_test LOCATION ''" \
            -c "GRANT CREATE ON TABLESPACE history_index_test TO shuffle_safety_test"
          pg_isready -h 127.0.0.1 -p 5432

      - name: Verify PostgreSQL pool and transaction safety
        env:
          ALLOW_REAL_PG: '1'
          PG_SAFETY_TEST: '1'
          TESTING: '1'
          TEST_POSTGRES_DSN: postgresql://shuffle_safety_test:safety-test-only@127.0.0.1:5432/shuffle_safety_test
          AI_SHUFFLE_ENV_FILE: /dev/null
          PYTHONPATH: .
          PART: ${{ matrix.part }}
        # Both parts split the one list below, so together they run every file once.
        run: |
          files=(tests/db/test_usage_budget_postgres.py tests/db/test_openrouter_usage_postgres.py
            tests/db/test_dedupe_cancelled_usage_postgres.py tests/db/test_turn_usage_settlement_postgres.py
            tests/db/test_fluid_delegated_batching_postgres.py tests/db/test_fluid_native_batching_postgres.py
            tests/db/test_universal_search_pg.py tests/db/test_runs_activity_postgres.py
            tests/core/test_pg_session_store.py tests/core/test_pg_session_store_rewind.py
            tests/db/test_explore_retirement_postgres.py tests/db/test_builtin_refresh_postgres.py
            tests/db/test_turn_context_postgres.py tests/db/test_git_repository_record_postgres.py
            tests/db/test_transcript_projection_postgres.py tests/db/test_session_message_window_postgres.py
            tests/db/test_handoff_bulk_postgres.py tests/db/test_history_indexing_postgres.py
            tests/db/test_event_write_lock_timeout_postgres.py
            tests/db/test_interaction_lock_recovery_postgres.py tests/db/test_recording_failure_outbox_postgres.py
            tests/db/test_stop_validation_recovery_postgres.py
            tests/db/test_fluid_session_ownership_postgres.py tests/db/test_fluid_streamed_load_postgres.py
            tests/db/test_stop_merge_boundary_postgres.py tests/db/test_stop_legacy_upgrade_postgres.py
            tests/db/test_stop_receipt_authority_postgres.py tests/db/test_scoped_remote_stop_postgres.py
            tests/db/test_stop_recovery_and_notice_postgres.py
            tests/db/test_session_delete_lock_order_postgres.py tests/db/test_pool_shutdown_postgres.py
            tests/db/test_agent_memory_postgres.py)
          slow=(tests/db/test_history_indexing_postgres.py tests/db/test_event_write_lock_timeout_postgres.py
            tests/db/test_handoff_bulk_postgres.py)
          rest=()
          for file in "${files[@]}"; do
            [[ " ${slow[*]} " == *" $file "* ]] || rest+=("$file")
          done
          if [ $(( ${#rest[@]} + ${#slow[@]} )) -ne ${#files[@]} ]; then
            echo "::error::every slow file must be in the list"; exit 1
          fi
          if [ "$PART" = indexing ]; then
            python -m pytest --durations=50 --junitxml=reports/security-13-2.xml "${slow[@]}" \
              -o addopts="" -p no:cacheprovider --timeout=120 -v
            exit 0
          fi
          python -m pytest --durations=50 --junitxml=reports/security-13-1.xml tests/integration/test_postgres_safety.py \
            --confcutdir=tests/integration -o addopts="" -p no:cacheprovider \
            --timeout=120 -v
          python -m pytest --durations=50 --junitxml=reports/security-13-2.xml "${rest[@]}" \
            -o addopts="" -p no:cacheprovider --timeout=120 -v

          python -m pytest --durations=50 --junitxml=reports/security-13-3.xml tests/core/test_start_model_replay_scope.py \
            -o addopts="" -p no:cacheprovider --timeout=120 -v

      - name: Upload backend-postgres
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-postgres-${{ matrix.part }}
          path: reports/
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend tests
    if: always() && inputs.gated_by_caller != true
    needs: [backend-select, backend-shard, backend-contracts, backend-security, backend-postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download successful shard receipts
        if: needs.backend-select.outputs.shards != '[]'
        uses: actions/download-artifact@v4
        with:
          pattern: backend-shard-*-a*
          path: shard-attempts
      - name: Select latest attempt per backend shard
        env:
          BACKEND_SHARDS: ${{ needs.backend-select.outputs.shards }}
        run: |
          count=$(python -c 'import json, os; print(len(json.loads(os.environ["BACKEND_SHARDS"])))')
          python scripts/ci/shard_evidence.py --prefix backend-shard --count "$count" --source shard-attempts --destination shard-results
      - name: Fail closed on incomplete coverage
        if: always()
        env:
          BACKEND_NEEDS: ${{ toJSON(needs) }}
          BACKEND_SHARDS: ${{ needs.backend-select.outputs.shards }}
          BACKEND_SELECTION: ${{ needs.backend-select.outputs.selection }}
          HEAD_SHA: ${{ github.sha }}
        run: python scripts/ci/backend_gate.py --head "$HEAD_SHA"
