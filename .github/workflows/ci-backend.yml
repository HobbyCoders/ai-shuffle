name: CI Backend
run-name: "${{ github.workflow }} (4 shards, 2 workers each)"

# Full backend coverage and security checks on every PR, including drafts.
# Cross-tree contracts and credential-path checks make path-based skips unsafe.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      runner_cpus:
        description: 'Legacy input (retained for callers); shards use two workers on ubuntu-latest'
        type: choice
        options: ['2', '4']
        default: '2'

permissions:
  contents: read

# Cancel superseded runs (force-pushes / rapid successive commits) instead of
# letting stale runs finish and fail/email after a newer commit already ran.
concurrency:
  group: ci-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-shard:
    name: backend-shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 35
    runs-on: ubuntu-latest
    env:
      TESTING: "1"
      ALLOW_REAL_PG: "0"
      PYTHONPATH: .:fluid
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep history for tests that inspect public revisions. Schema lifecycle
          # tests use checked-in SQL fixtures and need no private-era commits.
          fetch-depth: 0

      # Official setup actions use the GitHub Actions dependency cache.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # 3.12 matches production (the Docker image) and the fluid
          # harness's requires-python floor.
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements*.txt
            requirements-voice.lock
            fluid/pyproject.toml

      - name: Install dependencies
        # The fluid harness (fluid/) must be importable or tests/core's fluid
        # modules fail at COLLECTION, aborting the whole run before any test
        # executes. fluid's own unit suite runs separately in ci-fluid.yml;
        # never install its dev extras here, they upgrade mcp past the app's
        # pin and break a dozen app tests.
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e ./fluid

      # setup-python's hosted tool cache can contain group/world-writable
      # stdlib files. Match the image's trusted dependency permissions rather
      # than weakening the root-phase import provenance assertions.
      - name: Secure hosted Python dependency permissions
        run: chmod -R go-w "$(python -c 'import sys; print(sys.base_prefix)')"

      - name: Record runner capacity
        run: nproc

      - name: Run fast test subset
        # The suite uses an in-memory SQLite shim — no Postgres service needed.
        # addopts="" overrides any pytest.ini addopts so this never fails on coverage.
        # --timeout=120 bounds the rare hard-wedge per test: a wedged run fails
        # in ~2 minutes with the hung test named, instead of billing the job
        # timeout with no diagnosis.
        # Four deterministic partitions of the actual full collection, two workers each.
        # tests/mcp, services, unit, scripts and top-level tests/test_*.py are hermetic too (~45s at -n 4).
        # The excluded files run in full in a step of this job with the same
        # or a stronger setup (named in each step's comment), so they are not
        # run twice. tests/test_scan_blocking_db.py needs --deselect: the glob
        # passes it by name, and --ignore does not apply to named files. The
        # *_postgres.py and test_pg_session_store*.py files stay collected
        # here; they skip without ALLOW_REAL_PG=1 and run in the PostgreSQL
        # safety step.
        run: |
          python -m pytest --durations=50 --junitxml=reports/hermetic-1.xml tests/api tests/core tests/db tests/middleware tests/contract \
              tests/performance tests/mcp tests/services tests/unit tests/scripts tests/test_*.py \
              --deselect=tests/test_scan_blocking_db.py \
              --ignore=tests/core/test_container_runtime.py \
              --ignore=tests/core/test_container_image_contract.py \
              -o addopts="" -q -p no:cacheprovider --timeout=120 -n 2 \
              -p scripts.ci.backend_shards --backend-shard "${{ matrix.shard }}"

      - name: Upload backend-shard-${{ matrix.shard }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-shard-${{ matrix.shard }}-a${{ github.run_attempt }}
          path: |
            reports/
            backend-results/
          if-no-files-found: error
          retention-days: 7

  backend-contracts:
    name: backend-contracts
    timeout-minutes: 35
    runs-on: ubuntu-latest
    env:
      TESTING: "1"
      ALLOW_REAL_PG: "0"
      PYTHONPATH: .:fluid
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep history for tests that inspect public revisions. Schema lifecycle
          # tests use checked-in SQL fixtures and need no private-era commits.
          fetch-depth: 0

      # Official setup actions use the GitHub Actions dependency cache.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # 3.12 matches production (the Docker image) and the fluid
          # harness's requires-python floor.
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements*.txt
            requirements-voice.lock
            fluid/pyproject.toml

      - name: Install dependencies
        # The fluid harness (fluid/) must be importable or tests/core's fluid
        # modules fail at COLLECTION, aborting the whole run before any test
        # executes. fluid's own unit suite runs separately in ci-fluid.yml;
        # never install its dev extras here, they upgrade mcp past the app's
        # pin and break a dozen app tests.
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e ./fluid

      # setup-python's hosted tool cache can contain group/world-writable
      # stdlib files. Match the image's trusted dependency permissions rather
      # than weakening the root-phase import provenance assertions.
      - name: Secure hosted Python dependency permissions
        run: chmod -R go-w "$(python -c 'import sys; print(sys.base_prefix)')"

      - name: Record runner capacity
        run: nproc

      # pull_request + checkout's default ref tests refs/pull/<number>/merge,
      # not the PR head: duplicate IDs introduced by a clean merge must fail.
      - name: Validate merged live-smoke catalog and generated table
        run: python -m scripts.live_smoke render --check

      - name: Boot smoke test (real server process)
        # Starts `python -m app.main` as a subprocess against a private
        # PostgreSQL 16 cluster (initialized on a free port by the container
        # supervisor's own Database class), then drives health, the owner
        # bootstrap, a session, the chat socket and a SIGTERM shutdown. It
        # catches "the app does not start", which the in-process TestClient
        # suites above cannot. Needs the runner's preinstalled PostgreSQL 16
        # binaries (not the service, which is still stopped here);
        # BOOT_SMOKE_REQUIRED makes missing binaries fail instead of skip.
        # Also runs the schema lifecycle's real-PostgreSQL concurrent start
        # (several workers run init_core on one empty database at once).
        # Serial on purpose: the server binds real ports. ~30 s.
        env:
          BOOT_SMOKE_REQUIRED: '1'
          SMOKE_PG_BIN: /usr/lib/postgresql/16/bin
        run: python -m pytest --durations=50 --junitxml=reports/contracts-8-1.xml tests/smoke tests/db/test_schema_lifecycle.py -m boot_smoke -o addopts="" -q -rs -p no:cacheprovider --timeout=240

      - name: Start the runner's PostgreSQL
        # The Ubuntu runner image ships PostgreSQL preinstalled and stopped;
        # starting it costs seconds, where a service container costs a pull
        # and a health-check wait on every run. One database per contract
        # suite so neither sees the other's tables.
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "CREATE USER shuffle_mobile_test WITH PASSWORD 'mobile-test-only'" \
            -c "CREATE DATABASE shuffle_mobile_test OWNER shuffle_mobile_test" \
            -c "CREATE USER shuffle_network_test WITH PASSWORD 'network-test-only'" \
            -c "CREATE DATABASE shuffle_network_test OWNER shuffle_network_test" \
            -c "CREATE USER shuffle_safety_test WITH PASSWORD 'safety-test-only'" \
            -c "CREATE DATABASE shuffle_safety_test OWNER shuffle_safety_test"
          pg_isready -h 127.0.0.1 -p 5432

      - name: Measure managed PostgreSQL checkpoints and crash recovery
        # local_ci backend-linux also runs these files serially: plain cases
        # in check and full, outside the parallel fast subset. While #350 is
        # unresolved, local full PG cases require LOCAL_CI_CONTAINER_PG=1;
        # LOCAL_CI_CONTAINER_PRESSURE=1 adds measurements and implies PG.
        # This manual hosted measurement step opts into both below.
        env:
          ALLOW_REAL_PG: '1'
          TEST_POSTGRES_DSN: postgresql://shuffle_safety_test:safety-test-only@127.0.0.1:5432/shuffle_safety_test
          CONTAINER_RUNTIME_TEST_PG: '1'
          CONTAINER_RUNTIME_TEST_PRESSURE: '1'
          AI_SHUFFLE_ENV_FILE: /dev/null
          PYTHONPATH: .:fluid
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          python -c "import os; print('Pre-measurement load average:', os.getloadavg())"
          python -m pytest --durations=50 --junitxml=reports/contracts-10-1.xml tests/core/test_container_runtime.py tests/core/test_container_image_contract.py -o addopts="" -q -s -p no:cacheprovider --timeout=120

      - name: Mobile PostgreSQL contracts
        env:
          ALLOW_REAL_PG: '1'
          MOBILE_POSTGRES_TEST: '1'
          TEST_POSTGRES_DSN: postgresql://shuffle_mobile_test:mobile-test-only@127.0.0.1:5432/shuffle_mobile_test
          MOBILE_PG_HOST: '127.0.0.1'
          MOBILE_PG_PORT: '5432'
          MOBILE_PG_DATABASE: shuffle_mobile_test
          MOBILE_PG_USER: shuffle_mobile_test
          MOBILE_PG_PASSWORD: mobile-test-only
          AI_SHUFFLE_ENV_FILE: /dev/null
          PYTHONPATH: .
        run: >-
          python -m pytest --durations=50 --junitxml=reports/contracts-11-1.xml tests/integration/test_mobile_postgres.py
          --confcutdir=tests/integration -o addopts="" -p no:cacheprovider
          --timeout=60 -v

      - name: Verify network migration on real PostgreSQL
        env:
          ALLOW_REAL_PG: '1'
          NETWORK_POSTGRES_TEST: '1'
          TEST_POSTGRES_DSN: postgresql://shuffle_network_test:network-test-only@127.0.0.1:5432/shuffle_network_test
          NETWORK_PG_PORT: '5432'
          AI_SHUFFLE_ENV_FILE: /dev/null
          PYTHONPATH: .
        run: >-
          python -m pytest --durations=50 --junitxml=reports/contracts-12-1.xml tests/integration/test_network_migration_postgres.py
          tests/integration/test_network_heads_postgres.py
          --confcutdir=tests/integration -o addopts="" -p no:cacheprovider
          --timeout=120 -v

      - name: Upload backend-contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-contracts
          path: reports/
          if-no-files-found: error
          retention-days: 7

  backend-security:
    name: backend-security
    if: always()
    timeout-minutes: 35
    runs-on: ubuntu-latest
    env:
      TESTING: "1"
      ALLOW_REAL_PG: "0"
      PYTHONPATH: .:fluid
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep history for tests that inspect public revisions. Schema lifecycle
          # tests use checked-in SQL fixtures and need no private-era commits.
          fetch-depth: 0

      # Official setup actions use the GitHub Actions dependency cache.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          # 3.12 matches production (the Docker image) and the fluid
          # harness's requires-python floor.
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements*.txt
            requirements-voice.lock
            fluid/pyproject.toml

      - name: Install dependencies
        # The fluid harness (fluid/) must be importable or tests/core's fluid
        # modules fail at COLLECTION, aborting the whole run before any test
        # executes. fluid's own unit suite runs separately in ci-fluid.yml;
        # never install its dev extras here, they upgrade mcp past the app's
        # pin and break a dozen app tests.
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e ./fluid

      # setup-python's hosted tool cache can contain group/world-writable
      # stdlib files. Match the image's trusted dependency permissions rather
      # than weakening the root-phase import provenance assertions.
      - name: Secure hosted Python dependency permissions
        run: chmod -R go-w "$(python -c 'import sys; print(sys.base_prefix)')"

      - name: Record runner capacity
        run: nproc

      - name: Reject blocking database calls on the event loop
        # The only run of tests/test_scan_blocking_db.py: the fast subset
        # ignores it.
        run: |
          python -m pytest --durations=50 --junitxml=reports/security-4-1.xml tests/test_scan_blocking_db.py -o addopts="" -q
          python scripts/scan_blocking_db.py

      - name: Agent isolation with real accounts (root)
        # tests/core/test_agent_isolation_root.py (#1957) needs root: it
        # migrates a throwaway DATA_DIR to a second uid and runs the Bash tool
        # and Monitor shells through the spawn runner as a third, checking
        # each protected entry gives "Permission denied". sudo keeps the
        # runner's Python; no bytecode is written as root. ~10 s.
        env:
          AGENT_ISOLATION_ROOT_REQUIRED: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: .:fluid
        run: sudo -E env "PATH=$PATH" python -m pytest --durations=50 --junitxml=reports/security-7-1.xml tests/core/test_agent_isolation_root.py -o addopts="" -q -rs -p no:cacheprovider --timeout=180

      - name: Start the runner's PostgreSQL
        # The Ubuntu runner image ships PostgreSQL preinstalled and stopped;
        # starting it costs seconds, where a service container costs a pull
        # and a health-check wait on every run. One database per contract
        # suite so neither sees the other's tables.
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "CREATE USER shuffle_mobile_test WITH PASSWORD 'mobile-test-only'" \
            -c "CREATE DATABASE shuffle_mobile_test OWNER shuffle_mobile_test" \
            -c "CREATE USER shuffle_network_test WITH PASSWORD 'network-test-only'" \
            -c "CREATE DATABASE shuffle_network_test OWNER shuffle_network_test" \
            -c "CREATE USER shuffle_safety_test WITH PASSWORD 'safety-test-only'" \
            -c "CREATE DATABASE shuffle_safety_test OWNER shuffle_safety_test"
          pg_isready -h 127.0.0.1 -p 5432

      - name: Verify PostgreSQL pool and transaction safety
        env:
          ALLOW_REAL_PG: '1'
          PG_SAFETY_TEST: '1'
          TESTING: '1'
          TEST_POSTGRES_DSN: postgresql://shuffle_safety_test:safety-test-only@127.0.0.1:5432/shuffle_safety_test
          AI_SHUFFLE_ENV_FILE: /dev/null
          PYTHONPATH: .
        run: |
          python -m pytest --durations=50 --junitxml=reports/security-13-1.xml tests/integration/test_postgres_safety.py \
            --confcutdir=tests/integration -o addopts="" -p no:cacheprovider \
            --timeout=120 -v
          python -m pytest --durations=50 --junitxml=reports/security-13-2.xml tests/db/test_usage_budget_postgres.py tests/db/test_openrouter_usage_postgres.py \
            tests/db/test_dedupe_cancelled_usage_postgres.py tests/db/test_turn_usage_settlement_postgres.py \
            tests/db/test_fluid_delegated_batching_postgres.py tests/db/test_fluid_native_batching_postgres.py \
            tests/db/test_universal_search_pg.py tests/db/test_runs_activity_postgres.py \
            tests/core/test_pg_session_store.py tests/core/test_pg_session_store_rewind.py \
            tests/db/test_explore_retirement_postgres.py tests/db/test_builtin_refresh_postgres.py \
            tests/db/test_turn_context_postgres.py tests/db/test_git_repository_record_postgres.py \
            tests/db/test_transcript_projection_postgres.py tests/db/test_session_message_window_postgres.py \
            tests/db/test_handoff_bulk_postgres.py \
            -o addopts="" -p no:cacheprovider --timeout=120 -v

      # One unconditional measurement per database on PRs; five on main-suite.
      # Ordinary backend shards still cover the complete isolated test tree.
      - name: Measure large-fold contention on both databases
        env:
          TESTING: '1'
          AI_SHUFFLE_TRANSCRIPT_PRODUCER: '1'
          AI_SHUFFLE_ENV_FILE: /dev/null
          PYTHONPATH: .
          CONTENTION_ATTEMPTS: ${{ github.ref == 'refs/heads/main' && '5' || '1' }}
        run: |
          for attempt in $(seq 1 "$CONTENTION_ATTEMPTS"); do
            python -m pytest --durations=50 tests/test_transcript_projection_ingest_budget.py \
              -o addopts="" -q -s -p no:cacheprovider --timeout=60 \
              --junitxml="reports/large-fold-shim-${attempt}.xml"
            ALLOW_REAL_PG=1 TEST_POSTGRES_DSN=postgresql://shuffle_safety_test:safety-test-only@127.0.0.1:5432/shuffle_safety_test \
              python -m pytest --durations=50 tests/db/test_transcript_projection_ingest_postgres.py \
              -o addopts="" -q -s -p no:cacheprovider --timeout=60 \
              --junitxml="reports/large-fold-pg-${attempt}.xml"
          done

      - name: Audit public Python dependencies
        # Kept on every run: it takes about 2 s.
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --skip-editable
          python -m pip_audit -r requirements-voice.lock
      - name: Lint all workflow syntax/actions (pinned actionlint)
        run: |
          lint_dir="$(mktemp -d)"
          trap 'rm -rf "$lint_dir"' EXIT
          curl --fail --location --retry 2 --max-time 120 https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o "$lint_dir/actionlint.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $lint_dir/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$lint_dir/actionlint.tar.gz" -C "$lint_dir" actionlint
          "$lint_dir/actionlint" -shellcheck=

      - name: Full workflow, publication, security and docs policy regressions
        run: >-
          python -m pytest tests/scripts tests/test_buyer_docs.py tests/core/test_docs_content.py
          -o addopts="" -q -p no:cacheprovider --timeout=120
          --durations=50 --junitxml=reports/policy.xml

      - name: Upload backend-security
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-security
          path: reports/
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend tests
    if: always()
    needs: [backend-shard, backend-contracts, backend-security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download successful shard receipts
        uses: actions/download-artifact@v4
        with:
          pattern: backend-shard-*-a*
          path: shard-attempts
      - name: Select latest attempt per backend shard
        run: python scripts/ci/shard_evidence.py --prefix backend-shard --count 4 --source shard-attempts --destination shard-results
      - name: Fail closed on incomplete coverage
        if: always()
        env:
          BACKEND_NEEDS: ${{ toJSON(needs) }}
          HEAD_SHA: ${{ github.sha }}
        run: python scripts/ci/backend_gate.py --head "$HEAD_SHA"
