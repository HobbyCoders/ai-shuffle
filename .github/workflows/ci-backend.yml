            Zl9jb3VudGVyKCktdDouM2Z9IGV4aXQ9e3IucmV0dXJuY29kZX0iLCByLnN0ZG91dCwgci5zdGRlcnIsIGZsdXNoPVRydWUpCiAgICAgICAgaWYg
            ci5yZXR1cm5jb2RlOiByYWlzZSBTeXN0ZW1FeGl0KHIucmV0dXJuY29kZSkKcHJpbnQoZiJGSU5BTF9NQUlOX1NURVBfU0VDT05EUz17dGltZS5w
            ZXJmX2NvdW50ZXIoKS1zdGFydDouM2Z9IiwgZmx1c2g9VHJ1ZSkK
        run: |
          python -c 'import base64, os; exec(base64.b64decode(os.environ["TRANSCRIPT_PROOF"]))'
          for attempt in $(seq 1 "$CONTENTION_ATTEMPTS"); do
            selection=()
            if [ "$attempt" -gt 1 ]; then
              selection=(-k 'test_background_projection')
            fi
            python -m pytest --durations=50 tests/test_transcript_projection_ingest_budget.py "${selection[@]}" \
              -o addopts="" -q -s -p no:cacheprovider --timeout=60 \
              --junitxml="reports/large-fold-shim-${attempt}.xml"
            ALLOW_REAL_PG=1 TEST_POSTGRES_DSN=postgresql://shuffle_safety_test:safety-test-only@127.0.0.1:5432/shuffle_safety_test \
              python -m pytest --durations=50 tests/db/test_transcript_projection_ingest_postgres.py "${selection[@]}" \
              -o addopts="" -q -s -p no:cacheprovider --timeout=60 \
              --junitxml="reports/large-fold-pg-${attempt}.xml"
          done

      - name: Audit public Python dependencies
        # Kept on every run: it takes about 2 s.
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --skip-editable
          python -m pip_audit -r requirements-voice.lock
      - name: Lint all workflow syntax/actions (pinned actionlint)
        run: |
          lint_dir="$(mktemp -d)"
          trap 'rm -rf "$lint_dir"' EXIT
          curl --fail --location --retry 2 --max-time 120 https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o "$lint_dir/actionlint.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $lint_dir/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$lint_dir/actionlint.tar.gz" -C "$lint_dir" actionlint
          "$lint_dir/actionlint" -shellcheck=

      - name: Full workflow, publication, security and docs policy regressions
        run: >-
          python -m pytest tests/scripts tests/test_buyer_docs.py tests/core/test_docs_content.py
          -o addopts="" -q -p no:cacheprovider --timeout=120
          --durations=50 --junitxml=reports/policy.xml

      - name: Upload backend-security
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-security
          path: reports/
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend tests
    if: always()
    needs: [backend-shard, backend-contracts, backend-security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download successful shard receipts
        uses: actions/download-artifact@v4
        with:
          pattern: backend-shard-*-a*
          path: shard-attempts
      - name: Select latest attempt per backend shard
        run: python scripts/ci/shard_evidence.py --prefix backend-shard --count 4 --source shard-attempts --destination shard-results
      - name: Fail closed on incomplete coverage
        if: always()
        env:
          BACKEND_NEEDS: ${{ toJSON(needs) }}
          HEAD_SHA: ${{ github.sha }}
        run: python scripts/ci/backend_gate.py --head "$HEAD_SHA"
