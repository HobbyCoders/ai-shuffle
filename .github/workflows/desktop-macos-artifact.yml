name: Build macOS desktop artifact (manual opt-in)

# Developer ID signing and notarization come from repository secrets
# (desktop/RELEASING.md). Without them the build is unsigned, as before;
# half-configured secrets fail. DESKTOP_REQUIRE_SIGNING=true (repository
# variable) refuses an unsigned build.

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: 'Explicitly enable paid macOS desktop packaging'
        required: false
        default: false
        type: boolean
      version:
        description: 'Desktop version to build (for example 0.8.8)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos:
    if: >-
      github.repository == 'HobbyCoders/ai-shuffle' && github.actor_id == '76577322' && github.triggering_actor == github.actor && ((github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) &&
      (inputs.build_macos == true)
    name: macOS arm64 artifact with source provenance
    runs-on: blacksmith-6vcpu-macos-latest
    # Notarization of a large app can queue at Apple for a while.
    timeout-minutes: 150
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate version
        run: |
          version="${REQUESTED_VERSION#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo '::error::Invalid desktop version'; exit 1; }
          echo "DESKTOP_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install desktop build tools and stamp version
        run: |
          npm ci
          npm version --no-git-tag-version --allow-same-version "$DESKTOP_VERSION"
      - name: Assemble native worker and record exact source
        run: |
          npm run build:worker -- --arch arm64 --frontend-build ../frontend/build
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync('worker/build-source.json', JSON.stringify({
            version: process.env.DESKTOP_VERSION,
            sourceCommit: process.env.GITHUB_SHA,
            buildUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          }, null, 2) + '\n');
          NODE
      - name: Choose code signing
        id: signing
        env:
          DESKTOP_REQUIRE_SIGNING: ${{ vars.DESKTOP_REQUIRE_SIGNING }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/signing.mjs mac --args-file "$RUNNER_TEMP/signing-args.txt" --github-env
      - name: Build Mac installers
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # notarytool takes the App Store Connect key as a file path.
          if [ -n "$APPLE_API_KEY_P8" ]; then
            export APPLE_API_KEY="$RUNNER_TEMP/notary-api-key.p8"
            (umask 077; printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY")
          fi
          unset APPLE_API_KEY_P8
          signing=()
          while IFS= read -r arg; do if [ -n "$arg" ]; then signing+=("$arg"); fi; done < "$RUNNER_TEMP/signing-args.txt"
          npm run build
          node node_modules/electron-builder/cli.js --publish never --arm64 "${signing[@]}"
          rm -f "$RUNNER_TEMP/notary-api-key.p8"
      - name: Check signature, notarization and Gatekeeper
        if: steps.signing.outputs.signed == 'true'
        env:
          NOTARIZED: ${{ steps.signing.outputs.notarized }}
        run: |
          app=$(find release/mac-arm64 -maxdepth 1 -name '*.app' | head -n 1)
          [ -n "$app" ] || { echo '::error::No .app in release/mac-arm64'; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Runtime)'
          if [ "$NOTARIZED" = 'true' ]; then
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
            for dmg in release/*.dmg; do spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg" || echo "::warning::$dmg is not stapled; the app inside is."; done
          fi
      - name: Record artifact digests
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.signing_mode }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const source = JSON.parse(fs.readFileSync('worker/build-source.json', 'utf8'));
          const worker = JSON.parse(fs.readFileSync('worker/manifest.json', 'utf8'));
          const files = fs.readdirSync('release').filter(name => /\.(dmg|zip|blockmap)$/.test(name) || name === 'latest-mac.yml');
          if (!files.some(name => name.endsWith('.dmg')) || !files.some(name => name.endsWith('.zip'))) throw new Error('Missing Mac installers');
          const artifacts = files.map(name => {
            const bytes = fs.readFileSync(`release/${name}`);
            return { name, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') };
          });
          fs.writeFileSync('release/macos-build-provenance.json', JSON.stringify({ ...source, signing: process.env.SIGNING_MODE, cloudflared: worker.cloudflared, artifacts }, null, 2) + '\n');
          fs.writeFileSync('release/SHA256SUMS', artifacts.filter(a => /\.(dmg|zip)$/.test(a.name)).map(a => `${a.sha256}  ${a.name}\n`).join(''));
          NODE
      - name: Upload Mac installers and provenance
        uses: actions/upload-artifact@v4
        with:
          name: macos-desktop-${{ env.DESKTOP_VERSION }}-${{ github.sha }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest-mac.yml
            desktop/release/macos-build-provenance.json
            desktop/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
