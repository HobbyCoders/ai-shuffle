name: Build macOS desktop artifact (manual opt-in)

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: 'Explicitly enable paid macOS desktop packaging'
        required: false
        default: false
        type: boolean
      version:
        description: 'Desktop version to build (for example 0.8.8)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos:
    if: inputs.build_macos == true
    name: macOS arm64 artifact with source provenance
    runs-on: blacksmith-6vcpu-macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate version
        run: |
          version="${REQUESTED_VERSION#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo '::error::Invalid desktop version'; exit 1; }
          echo "DESKTOP_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install desktop build tools and stamp version
        run: |
          npm ci
          npm version --no-git-tag-version --allow-same-version "$DESKTOP_VERSION"
      - name: Assemble native worker and record exact source
        run: |
          npm run build:worker -- --arch arm64 --frontend-build ../frontend/build
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync('worker/build-source.json', JSON.stringify({
            version: process.env.DESKTOP_VERSION,
            sourceCommit: process.env.GITHUB_SHA,
            buildUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          }, null, 2) + '\n');
          NODE
      - name: Build Mac installers
        run: npm run build && npx electron-builder --publish never --arm64
      - name: Record artifact digests
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const source = JSON.parse(fs.readFileSync('worker/build-source.json', 'utf8'));
          const worker = JSON.parse(fs.readFileSync('worker/manifest.json', 'utf8'));
          const files = fs.readdirSync('release').filter(name => /\.(dmg|zip|blockmap)$/.test(name) || name === 'latest-mac.yml');
          if (!files.some(name => name.endsWith('.dmg')) || !files.some(name => name.endsWith('.zip'))) throw new Error('Missing Mac installers');
          const artifacts = files.map(name => {
            const bytes = fs.readFileSync(`release/${name}`);
            return { name, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') };
          });
          fs.writeFileSync('release/macos-build-provenance.json', JSON.stringify({ ...source, cloudflared: worker.cloudflared, artifacts }, null, 2) + '\n');
          NODE
      - name: Upload Mac installers and provenance
        uses: actions/upload-artifact@v4
        with:
          name: macos-desktop-${{ env.DESKTOP_VERSION }}-${{ github.sha }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest-mac.yml
            desktop/release/macos-build-provenance.json
          if-no-files-found: error
          retention-days: 30
