<!doctype html>
<html lang="en" data-platform="mobile">
	<head>
		<meta charset="utf-8" />
		<!-- This page is our own bundle, loaded from the app's asset origin. Script
		     and styles come only from the bundle; the network is for the worker
		     (HTTPS/WSS) and for media it serves. The Android side additionally
		     confines the WebView to the asset origin plus the paired worker. -->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https: wss:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
		<meta name="theme-color" content="#0f0f0f" />
		<meta name="mobile-web-app-capable" content="yes" />
		<title>AI Shuffle</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
